name: CI

# Changes that touch only prose, images, or issue templates build nothing,
# so they do not run CI. The user guide (docs/user-guide/guide.json) is not
# ignored: the go job validates it.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "NOTICE"
      - "docs/screenshots/**"
      - "docs/brand/**"
      - "screenshots/**"
      - "assets/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "NOTICE"
      - "docs/screenshots/**"
      - "docs/brand/**"
      - "screenshots/**"
      - "assets/**"
      - ".github/ISSUE_TEMPLATE/**"

# A new push to a pull request cancels its older run. Runs on main always
# finish, so every merged commit is checked.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Go checks and the user guide share one runner: the module and build
  # caches are already warm, and each extra job would repeat checkout and Go
  # setup. The cross-compile runs beside it, one job per platform, so it does
  # not wait for the tests.
  go:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          # The newest patch release, not one a runner has cached: patches
          # fix security problems in the standard library that builds ship.
          check-latest: true
          # Self-hosted runners keep Go's caches on disk; uploading them
          # to GitHub's cache only held jobs up for many minutes.
          cache: ${{ !vars.CI_RUNS_ON }}
      - name: User guide
        run: |
          python3 scripts/test_publish_docs.py
          python3 scripts/test_check_user_guide.py
          python3 scripts/check-user-guide.py
          python3 scripts/publish-docs.py --destination "$RUNNER_TEMP/docs-validation" --version 0.0.0-test --commit "$GITHUB_SHA"
      - name: Changelog fragments
        run: |
          python3 scripts/test_changelog.py
          python3 scripts/changelog.py check
      - name: Apt source migration
        run: python3 scripts/test_apt_signed_source.py
      - name: Translation checks
        run: |
          python3 scripts/test_i18n.py
          python3 scripts/i18n.py check
      - name: Format check
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' \
            -not -path './web/*' \
            -not -path './.gocache/*' \
            -not -path './vendor/*' \
            -not -path '*/node_modules/*'))
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Installer scripts
        # shellcheck and pwsh come with the Ubuntu runner.
        run: |
          shellcheck --shell=sh scripts/install.sh
          sh -n scripts/install.sh
          pwsh -NoProfile -Command '$errors = $null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null; if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }'
      # Lint runs govet (the standard linters in .golangci.yml), so there is
      # no separate go vet step.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        # The action unpacks golangci-lint into $HOME, which the home
        # runners share: two jobs at once failed with "Text file busy". Each
        # job's own temp folder keeps them apart.
        env:
          HOME: ${{ runner.temp }}
        with:
          version: v2.14.0
      # Coverage feeds only the badge, published from main.
      - name: Test
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            go test ./... -coverprofile=coverage.out
          else
            go test ./...
          fi
      - name: Upload coverage profile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: coverage.out
          retention-days: 1
          if-no-files-found: error

  # toskar and toskarctl build for every platform a release ships, so a
  # change that breaks one OS fails here, not at release.
  cross-compile:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64]
    name: cross-compile (${{ matrix.target }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          # The newest patch release, not one a runner has cached: patches
          # fix security problems in the standard library that builds ship.
          check-latest: true
          # Self-hosted runners keep Go's caches on disk; uploading them
          # to GitHub's cache only held jobs up for many minutes.
          cache: ${{ !vars.CI_RUNS_ON }}
      - name: Build toskar and toskarctl
        env:
          CGO_ENABLED: "0"
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          export GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}"
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -o "bin/${GOOS}-${GOARCH}/toskar${ext}" ./cmd/daemon
          go build -o "bin/${GOOS}-${GOARCH}/toskarctl${ext}" ./cmd/devctl
      # Tests run only on Linux and macOS runners; vet type-checks them for
      # each target too, so a Unix-only call in a shared test file fails here.
      - name: Type-check tests
        env:
          CGO_ENABLED: "0"
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          export GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}"
          go vet ./...

  installer:
    # install.sh on a real Ubuntu with systemd: the .deb from a local
    # release, the service, and install-and-join with a join token (#40).
    # It installs system-wide with sudo, so it stays on a throwaway GitHub
    # runner, never a self-hosted one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          # The newest patch release, not one a runner has cached: patches
          # fix security problems in the standard library that builds ship.
          check-latest: true
      # Each job gets its own pnpm: self-hosted runners share a home folder,
      # and two jobs installing into ~/setup-pnpm at once break each other.
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the Linux amd64 package
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
          export PATH="$(go env GOPATH)/bin:$PATH"
          ONLY=linux-amd64 VERSION=0.0.0-ci ./scripts/build/package-core-release.sh
      # The package from a signed apt repository, added the documented way,
      # with no [trusted=yes] (#599): signed here with a key made for the
      # test, served locally, and installed in a fresh Ubuntu container.
      - name: Signed apt repository
        run: |
          sudo apt-get install -y dpkg-dev apt-utils
          shellcheck scripts/build/apt-index.sh scripts/build/test-apt-repo.sh packaging/linux/apt-signed-source.sh
          APT_TEST_DEBS=dist ./scripts/build/test-apt-repo.sh
      - name: Install and join
        run: |
          shellcheck scripts/test-install.sh
          ./scripts/test-install.sh

  coverage-badge:
    needs: go
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          # The newest patch release, not one a runner has cached: patches
          # fix security problems in the standard library that builds ship.
          check-latest: true
          # Self-hosted runners keep Go's caches on disk; uploading them
          # to GitHub's cache only held jobs up for many minutes.
          cache: ${{ !vars.CI_RUNS_ON }}
      - uses: actions/download-artifact@v8
        with:
          name: coverage-profile
          path: .
      - name: Publish coverage badge
        env:
          PUBLISH_COVERAGE_BADGE: "1"
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x scripts/publish-coverage-badge.sh
          ./scripts/publish-coverage-badge.sh coverage.out

  frontend:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # Each job gets its own pnpm: self-hosted runners share a home folder,
      # and two jobs installing into ~/setup-pnpm at once break each other.
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          # Not on self-hosted runners, whose pnpm store stays on disk.
          cache: ${{ !vars.CI_RUNS_ON && 'pnpm' || '' }}
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm exec tsc -b --pretty false
      - run: pnpm test
      - run: pnpm build

  # axe-core over every page of the built UI with demo data, in both themes
  # at desktop and phone widths (#217). Contrast needs a real browser.
  accessibility:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    # It takes about 6 minutes. A hung browser install once held a PR for
    # over two hours; this fails it instead.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          # The newest patch release, not one a runner has cached: patches
          # fix security problems in the standard library that builds ship.
          check-latest: true
          # Self-hosted runners keep Go's caches on disk; uploading them
          # to GitHub's cache only held jobs up for many minutes.
          cache: ${{ !vars.CI_RUNS_ON }}
      # Each job gets its own pnpm: self-hosted runners share a home folder,
      # and two jobs installing into ~/setup-pnpm at once break each other.
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          # Not on self-hosted runners, whose pnpm store stays on disk.
          cache: ${{ !vars.CI_RUNS_ON && 'pnpm' || '' }}
          cache-dependency-path: |
            web/pnpm-lock.yaml
            scripts/screenshots/pnpm-lock.yaml
      - name: Build the web UI
        working-directory: web
        run: pnpm install && pnpm build
      - name: Install the browser
        timeout-minutes: 10
        working-directory: scripts/screenshots
        # A self-hosted runner has Chromium's system libraries installed
        # already and no sudo to install them.
        run: pnpm install && pnpm exec playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
      - name: Check every page
        run: node scripts/screenshots/a11y.mjs
      # Moves between every page many times and fails if the heap, DOM
      # nodes, or listeners keep growing, or a page throws (#231).
      - name: Check for memory leaks
        run: node scripts/screenshots/leaks.mjs
