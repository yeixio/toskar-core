name: Quality

# The quality test set against real models (spec §64). The same cases run
# against the stub model in CI on every change; this runs them against a
# daemon with real models installed, on a self-hosted runner, so defaults
# are changed with evidence. The self-hosted job runs when the repository
# variable QUALITY_RUNNER is "docker".

on:
  schedule:
    - cron: "17 6 * * 1"
  # The real model takes about fifteen minutes, so it is not run on pull
  # requests: they get the stub run in CI, and a release is held to the
  # real model by the Release workflow. Start this by hand to check a
  # change to chat before it merges.
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to test. The workflow itself always comes from main.
        default: main
      models:
        description: 'Models for the self-hosted run, as a JSON list, such as ["recommended","qwen2.5-32b-q4"]. Blank for QUALITY_MODELS.'
        default: ""
      deliberate:
        description: The Deliberate mode the reasoning set measures (#459). The weekly run measures single.
        type: choice
        options: [single, always]
        default: single
      image_model:
        description: The picture model the media set tests, such as z-image-turbo (#548). Blank for FLUX.2 [klein] 4B.
        default: ""
      video_model:
        description: The clip model the media set tests, such as wan2.2-t2v-a14b (#548). Blank for Wan 2.2 TI2V 5B.
        default: ""
      repeats:
        description: How many times the served model runs each case, sampling with a seed each time (#834).
        default: "3"

jobs:
  # The quality set with a real model on CPU (Llama 3.2 1B through
  # llama-server), the web answered from tests/quality/web.json. Each case
  # runs three times, sampling with seeds 1-3 (#834), so the report gives
  # the pass rate with a 95% interval and names the flaky cases, and the
  # saved runs (quality-runs.jsonl) can be rescored after a check changes.
  # It fails when fewer than 90% of runs pass; the report lists every answer.
  # The prompt cache (#838) is checked against the same model and against
  # Gemma 3 4B, which has a sliding window: how much of a chat's later turn
  # comes from the cache, and that a warm answer matches a cold one.
  served-model:
    runs-on: ${{ fromJSON(vars.TRUSTED_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          # The newest patch release, not one a runner has cached: patches
          # fix security problems in the standard library that builds ship.
          check-latest: true
      - uses: actions/cache@v6
        with:
          path: .quality-cache
          key: quality-model-b11174-llama-3.2-1b-q4km-gemma-3-4b-q4km
      - name: Quality set with a real model
        env:
          GH_TOKEN: ${{ github.token }}
          TOSKAR_QUALITY_REPORT: ${{ runner.temp }}/quality-report.md
          TOSKAR_QUALITY_REPEATS: ${{ inputs.repeats || '3' }}
          TOSKAR_QUALITY_SAVE: ${{ runner.temp }}/quality-runs.jsonl
          TOSKAR_QUALITY_RUN: TestQualitySet|TestPromptCache
          TOSKAR_QUALITY_CACHE_REPORT: ${{ runner.temp }}/cache-report.md
        run: scripts/quality-model.sh run
      # Gemma 3's sliding window (1,024 tokens) is where a llama.cpp update
      # is likeliest to stop reusing the cache (#838).
      - name: Prompt cache with a sliding-window model
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_MODEL_GGUF_URL: https://huggingface.co/ggml-org/gemma-3-4b-it-GGUF/resolve/main/gemma-3-4b-it-Q4_K_M.gguf
          QUALITY_MODEL_PORT: "8090"
          TOSKAR_QUALITY_RUN: TestPromptCache
          TOSKAR_QUALITY_CACHE_REPORT: ${{ runner.temp }}/cache-report-gemma.md
          # Gemma 3 can write another word warm than cold at a near-tie,
          # however the cache is set up, so its equivalence is reported.
          TOSKAR_QUALITY_CACHE_EQUIVALENCE: measure
        run: scripts/quality-model.sh run
      - name: Report
        if: always()
        run: |
          for f in quality-report.md cache-report.md cache-report-gemma.md; do
            if [ -f "$RUNNER_TEMP/$f" ]; then
              head -c 60000 "$RUNNER_TEMP/$f" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: quality-report-core
          path: |
            ${{ runner.temp }}/quality-report.md
            ${{ runner.temp }}/quality-runs.jsonl
            ${{ runner.temp }}/cache-report.md
            ${{ runner.temp }}/cache-report-gemma.md
          if-no-files-found: ignore

  # The quality set against the daemon built from the commit under test,
  # with the models it recommends for the self-hosted runner's hardware
  # (#296). The runner's own Toskar, if any, is never used. Everything built
  # from the checkout runs in containers under the runner's rootless Docker:
  # the daemon with a throwaway data folder and the web answered from
  # tests/quality/web.json (TOSKAR_WEB_FIXTURES), and the tests beside it, so a
  # branch dispatched here can't touch the machine. Models and runtimes are
  # kept in Docker volumes, so only the first run downloads them. It runs
  # when the repository variable QUALITY_RUNNER is "docker".
  #
  # The runner is someone's computer, so the daemon is held to part of it:
  # QUALITY_MEMORY (default 32g, with no swap) and QUALITY_CPUS (default
  # three quarters of the cores). QUALITY_GPU=vulkan gives it the AMD or
  # Intel card (/dev/dri) and Vulkan drivers. It picks its models to fit,
  # and if it still runs out, the kernel stops the container, not the
  # machine.
  #
  # It runs once per model in QUALITY_MODELS (or the models input), one at a
  # time on the one GPU: "recommended" is what the daemon picks for a new
  # user; a catalog id, such as qwen2.5-32b-q4, tests that model.
  real-models:
    if: vars.QUALITY_RUNNER == 'docker'
    runs-on: [self-hosted, toskar-models]
    timeout-minutes: 480
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        model: ${{ fromJSON(inputs.models || vars.QUALITY_MODELS || '["recommended"]') }}
    name: real-models (${{ matrix.model }})
    env:
      NAME: toskar-quality-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
      MEMORY: ${{ vars.QUALITY_MEMORY || '32g' }}
      CPUS: ${{ vars.QUALITY_CPUS }}
      GPU: ${{ vars.QUALITY_GPU }}
    steps:
      - name: Remove what an interrupted run left
        run: |
          # A run cut off by a crash or a runner restart never cleans up, and
          # its daemon would keep holding memory.
          docker ps -aq --filter name=toskar-quality- | xargs -r docker rm -f
          docker network ls -q --filter name=toskar-quality- | xargs -r docker network rm
          docker images -q --filter reference='toskar-quality-*' | xargs -r docker image rm -f
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Build the daemon
        run: |
          # QUALITY_GPU=vulkan builds the image with Vulkan and Mesa's
          # drivers for an AMD or Intel card (the Dockerfile's gpu target).
          target=runtime
          if [ "$GPU" = vulkan ]; then target=gpu; fi
          docker build --pull --target "$target" --build-arg COMMIT="$(git rev-parse --short HEAD)" -t "$NAME" .
      - name: Start the daemon
        run: |
          # A key made for this run: the tests reach the daemon over the
          # container network, which is not loopback, so they send it.
          key="ygg_$(openssl rand -hex 24)"
          echo "::add-mask::$key"
          echo "QUALITY_KEY=$key" >> "$GITHUB_ENV"
          docker network create "$NAME"
          cpus="${CPUS:-$(( $(nproc) * 3 / 4 ))}"
          echo "Daemon limited to $MEMORY of memory and $cpus CPUs"
          gpu=()
          if [ "$GPU" = vulkan ]; then gpu=(--device /dev/dri); fi
          docker run -d --name "$NAME" --network "$NAME" \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory "$MEMORY" --memory-swap "$MEMORY" --cpus "$cpus" \
            --oom-score-adj 1000 --pids-limit 4096 "${gpu[@]}" \
            -v toskar-quality-models:/data/models \
            -v toskar-quality-runtimes:/data/runtimes \
            -v "$PWD/tests/quality/web.json:/fixtures/web.json:ro" \
            -e TOSKAR_WEB_FIXTURES=/fixtures/web.json \
            -e TOSKAR_API_KEY="$key" \
            -e TOSKAR_DISCOVERY_ENABLED=false \
            -e TOSKAR_INTERNAL_HOST=127.0.0.1 \
            ${{ vars.QUALITY_DOCKER_FLAGS }} \
            "$NAME"
          if [ "$GPU" = vulkan ]; then
            echo "GPUs the daemon can use:"
            docker exec "$NAME" vulkaninfo --summary 2>/dev/null | grep -E "deviceName|deviceType" || echo "::warning::No Vulkan device in the container; the run will use the CPU."
          fi
      - name: Quality set
        run: |
          mkdir -p .quality
          docker run --rm --network "$NAME" \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 4g --memory-swap 4g --cpus 2 \
            -v "$PWD:/src" -w /src \
            -v toskar-quality-go:/go \
            -e TOSKAR_QUALITY_URL="http://$NAME:7331" \
            -e TOSKAR_QUALITY_KEY="$QUALITY_KEY" \
            -e TOSKAR_QUALITY_INSTALL=recommended \
            -e TOSKAR_QUALITY_MODEL="${{ matrix.model }}" \
            -e TOSKAR_QUALITY_REPORT=/src/.quality/report.md \
            golang:1.26-bookworm \
            go test ./tests/quality -run TestQualitySet -count=1 -v -timeout 280m
      # Topic controls (#345): the share of off-topic cases held and of
      # on-topic ones wrongly refused, with the same models.
      - name: Topic controls
        if: ${{ !cancelled() }}
        run: |
          mkdir -p .quality
          docker run --rm --network "$NAME" \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 4g --memory-swap 4g --cpus 2 \
            -v "$PWD:/src" -w /src \
            -v toskar-quality-go:/go \
            -e TOSKAR_QUALITY_URL="http://$NAME:7331" \
            -e TOSKAR_QUALITY_KEY="$QUALITY_KEY" \
            -e TOSKAR_QUALITY_INSTALL=recommended \
            -e TOSKAR_QUALITY_MODEL="${{ matrix.model }}" \
            -e TOSKAR_QUALITY_TOPIC_REPORT=/src/.quality/topics.md \
            golang:1.26-bookworm \
            go test ./tests/quality -run TestTopicQuality -count=1 -v -timeout 60m
      # Files (#510): every type Toskar reads, attached and asked about,
      # and every type it makes, asked for and then opened.
      - name: Files
        if: ${{ !cancelled() }}
        run: |
          mkdir -p .quality
          docker run --rm --network "$NAME" \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 4g --memory-swap 4g --cpus 2 \
            -v "$PWD:/src" -w /src \
            -v toskar-quality-go:/go \
            -e TOSKAR_QUALITY_URL="http://$NAME:7331" \
            -e TOSKAR_QUALITY_KEY="$QUALITY_KEY" \
            -e TOSKAR_QUALITY_INSTALL=recommended \
            -e TOSKAR_QUALITY_MODEL="${{ matrix.model }}" \
            -e TOSKAR_QUALITY_FILES_REPORT=/src/.quality/files.md \
            golang:1.26-bookworm \
            go test ./tests/quality -run 'TestFiles' -count=1 -v -timeout 60m
      # Media (#510): pictures, edits, video, and speech Toskar makes,
      # judged by a model that sees (gemma-3-4b) or by transcription, and
      # pictures it reads. Once a week, with the recommended models: it
      # sets up picture and video making first (about 14 GB the first time,
      # kept in the models volume), so the other models don't repeat it.
      - name: Media
        if: ${{ !cancelled() && matrix.model == 'recommended' }}
        # A Hugging Face token whose account accepted a gated model's
        # license, for testing a model that needs one (#551). It reaches the
        # container through the environment, never the command line.
        env:
          TOSKAR_QUALITY_HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p .quality
          docker run --rm --network "$NAME" \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 4g --memory-swap 4g --cpus 2 \
            -v "$PWD:/src" -w /src \
            -v toskar-quality-go:/go \
            -e TOSKAR_QUALITY_URL="http://$NAME:7331" \
            -e TOSKAR_QUALITY_KEY="$QUALITY_KEY" \
            -e TOSKAR_QUALITY_INSTALL=recommended \
            -e TOSKAR_QUALITY_MODEL="${{ matrix.model }}" \
            -e TOSKAR_QUALITY_MEDIA_INSTALL=1 \
            -e TOSKAR_QUALITY_MEDIA_IMAGE_MODEL="${{ inputs.image_model }}" \
            -e TOSKAR_QUALITY_MEDIA_VIDEO_MODEL="${{ inputs.video_model }}" \
            -e TOSKAR_QUALITY_HF_TOKEN \
            -e TOSKAR_QUALITY_MEDIA_REPORT=/src/.quality/media.md \
            golang:1.26-bookworm \
            go test ./tests/quality -run 'TestMedia' -count=1 -v -timeout 180m
      # Reasoning (#459): how often the model gets questions with one right
      # answer right, by kind, and the time and tokens it takes. Measured,
      # not gated: the baseline Deliberate is compared against.
      - name: Reasoning
        if: ${{ !cancelled() }}
        run: |
          mkdir -p .quality
          docker run --rm --network "$NAME" \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 4g --memory-swap 4g --cpus 2 \
            -v "$PWD:/src" -w /src \
            -v toskar-quality-go:/go \
            -e TOSKAR_QUALITY_URL="http://$NAME:7331" \
            -e TOSKAR_QUALITY_KEY="$QUALITY_KEY" \
            -e TOSKAR_QUALITY_INSTALL=recommended \
            -e TOSKAR_QUALITY_MODEL="${{ matrix.model }}" \
            -e TOSKAR_QUALITY_DELIBERATE="${{ inputs.deliberate || 'single' }}" \
            -e TOSKAR_QUALITY_REASONING_REPORT=/src/.quality/reasoning.md \
            -e TOSKAR_QUALITY_REASONING_JSON=/src/.quality/reasoning.json \
            golang:1.26-bookworm \
            go test ./tests/quality -run 'TestReasoning' -count=1 -v -timeout 240m
      # The triage set (#455): issues of this repository labeled the way
      # the Triage workflow asks. Measured, not gated: precision, recall,
      # and how often the type was right.
      - name: Triage
        if: ${{ !cancelled() }}
        run: |
          mkdir -p .quality
          docker run --rm --network "$NAME" \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 4g --memory-swap 4g --cpus 2 \
            -v "$PWD:/src" -w /src \
            -v toskar-quality-go:/go \
            -e TOSKAR_QUALITY_URL="http://$NAME:7331" \
            -e TOSKAR_QUALITY_KEY="$QUALITY_KEY" \
            -e TOSKAR_QUALITY_INSTALL=recommended \
            -e TOSKAR_QUALITY_MODEL="${{ matrix.model }}" \
            -e TOSKAR_QUALITY_TRIAGE_REPORT=/src/.quality/triage.md \
            -e TOSKAR_QUALITY_TRIAGE_JSON=/src/.quality/triage.json \
            golang:1.26-bookworm \
            go test ./tests/quality -run 'TestTriage' -count=1 -v -timeout 60m
      - name: Report
        if: always()
        run: |
          for f in .quality/report.md .quality/topics.md .quality/files.md .quality/media.md .quality/reasoning.md .quality/triage.md; do
            if [ -f "$f" ]; then
              head -c 60000 "$f" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-report-real-models-${{ matrix.model }}
          path: |
            .quality/report.md
            .quality/topics.md
            .quality/files.md
            .quality/media.md
            .quality/reasoning.md
            .quality/reasoning.json
            .quality/triage.md
            .quality/triage.json
          if-no-files-found: ignore
      - name: Daemon log
        if: failure()
        run: |
          if [ "$(docker inspect -f '{{.State.OOMKilled}}' "$NAME" 2>/dev/null)" = true ]; then
            echo "::error::The daemon ran out of its $MEMORY of memory. Raise QUALITY_MEMORY or have it pick a smaller model."
          fi
          docker logs --tail 200 "$NAME" 2>&1 || true
      - name: Clean up
        if: always()
        run: |
          docker rm -f "$NAME" >/dev/null 2>&1 || true
          docker network rm "$NAME" >/dev/null 2>&1 || true
          docker image rm "$NAME" >/dev/null 2>&1 || true
