name: Examples

# The official SDKs against a throwaway Core built from this commit, so a
# Core change that breaks them fails here, before it merges: every SDK's
# shared conformance cases (toskar-sdks conformance/run.py), then every
# example in examples/, checked for what it prints (examples/test.py).
# Core chats with toskar-sdks' scripted model, so no model is downloaded.
# toskar-sdks runs both against its own changes, so an SDK change that
# breaks them fails there first.
on:
  pull_request:
  push:
    branches: [main]
  # The SDKs change too: each night against their main.
  schedule:
    - cron: "53 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: yeixio/toskar-sdks
          path: toskar-sdks
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: ${{ !vars.CI_RUNS_ON }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build Core
        env:
          CGO_ENABLED: "0"
        # Not $RUNNER_TEMP/toskar: the Ask Toskar action keeps its Toskar's
        # folder there, and a home runner can still have one.
        run: go build -o "$RUNNER_TEMP/toskar-daemon" ./cmd/daemon
      - name: Build the SDKs
        run: |
          (cd toskar-sdks/go && go build -o "$RUNNER_TEMP/toskar-conformance-go" ./cmd/toskar-conformance)
          python -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q "./toskar-sdks/python[anywhere]"
          (cd toskar-sdks/typescript && npm ci && npm run build)
      - name: Run the SDKs' conformance cases
        run: |
          python toskar-sdks/conformance/run.py --core "$RUNNER_TEMP/toskar-daemon" \
            --program "go=$RUNNER_TEMP/toskar-conformance-go" \
            --program "python=$RUNNER_TEMP/venv/bin/python toskar-sdks/python/conformance.py" \
            --program "node=node toskar-sdks/typescript/conformance.mjs"
      - name: Lint the CI examples' GitHub workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 examples/ci/github/*.yml
      - name: Run the examples
        run: python examples/test.py --core "$RUNNER_TEMP/toskar-daemon" --sdks toskar-sdks --python "$RUNNER_TEMP/venv/bin/python"
