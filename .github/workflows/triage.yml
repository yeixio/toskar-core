name: Triage

# Suggests labels for each new issue, as a comment a maintainer acts on
# (#455): Toskar triaging its own issues with the Ask Toskar action. It
# asks the Toskar on the computer beside the runner in TOSKAR_RUNS_ON, at
# TOSKAR_URL, with TOSKAR_API_KEY, a key made with For a CI job, so the
# issue's text can't reach anyone's memories or make a tool act, and the
# model TOSKAR_MODEL (auto unless set), fixed so runs compare. The labels
# it may suggest, and what each means, are in .github/triage.json: one
# type, up to two areas, and a platform only when the issue is about
# that platform, limits the answer's schema enforces. Until those variables
# are set it does nothing. Run it by hand on an existing issue to try it:
# that writes to the run's summary, and comments only when asked.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
      comment:
        description: Comment on the issue (otherwise only the run's summary)
        type: boolean
        default: false

permissions:
  contents: read

# One at a time on Toskar's computer. In a flood of issues GitHub keeps one
# run waiting and cancels the rest, so spam can't crowd the computer; run
# it by hand for an issue that was skipped.
concurrency:
  group: triage
  cancel-in-progress: false

jobs:
  # Reads the issue, with no permission to write anything.
  suggest:
    if: vars.TOSKAR_URL != '' && vars.TOSKAR_RUNS_ON != ''
    runs-on: ${{ fromJSON(vars.TOSKAR_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    outputs:
      labels: ${{ steps.toskar.outputs.answer }}
      issue: ${{ steps.issue.outputs.number }}
    steps:
      # Only triage.json, read from this commit: no checkout, since a sparse
      # one stays sparse for the next job on a shared self-hosted runner.
      - name: The labels it may suggest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/triage.json?ref=$GITHUB_SHA" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/triage.json"
      - name: The issue, and what to ask
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || inputs.issue }}
        run: |
          # Closed while it waited, as spam is: nothing to suggest.
          if [ "$(gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" != OPEN ]; then
            echo "Issue $NUMBER is closed; nothing to suggest."
            echo "open=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "open=true" >> "$GITHUB_OUTPUT"
          gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body --jq '.title + "\n\n" + .body' > "$RUNNER_TEMP/issue.txt"
          jq '{
            type: "object",
            properties: {
              type: {enum: (.type | keys)},
              area: {type: "array", items: {enum: (.area | keys)}, maxItems: 2},
              platform: {type: "array", items: {enum: (.platform | keys)}, maxItems: 2}
            },
            required: ["type", "area", "platform"]
          }' "$RUNNER_TEMP/triage.json" > "$RUNNER_TEMP/triage.schema.json"
          {
            echo "number=$NUMBER"
            echo "prompt<<EOF_PROMPT"
            echo "Label this issue of Toskar, a local AI app."
            echo "type: the one kind of issue it is:"
            jq -r '.type | to_entries[] | "- \(.key): \(.value)"' "$RUNNER_TEMP/triage.json"
            echo "area: the part of Toskar the issue is mainly about: usually one, two only when both are central, none when nothing fits well. Don't add an area just because the issue touches it:"
            jq -r '.area | to_entries[] | "- \(.key): \(.value)"' "$RUNNER_TEMP/triage.json"
            echo "platform: only when the issue happens on, or is specifically about, that platform or hardware. Usually none: []."
            jq -r '.platform | to_entries[] | "- \(.key): \(.value)"' "$RUNNER_TEMP/triage.json"
            echo "EOF_PROMPT"
          } >> "$GITHUB_OUTPUT"
      - uses: yeixio/toskar-action@v1
        if: steps.issue.outputs.open == 'true'
        id: toskar
        with:
          url: ${{ vars.TOSKAR_URL }}
          api-key: ${{ secrets.TOSKAR_API_KEY }}
          model: ${{ vars.TOSKAR_MODEL || 'auto' }}
          prompt: ${{ steps.issue.outputs.prompt }}
          input-file: ${{ runner.temp }}/issue.txt
          json-schema: ${{ runner.temp }}/triage.schema.json
          temperature: "0"
          timeout: 10m

  # Writes a comment with the allowed labels, never the answer's own text.
  comment:
    needs: suggest
    if: needs.suggest.outputs.labels != ''
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # Only triage.json, read from this commit: no checkout, since a sparse
      # one stays sparse for the next job on a shared self-hosted runner.
      - name: The labels it may suggest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/triage.json?ref=$GITHUB_SHA" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/triage.json"
      - name: Suggest them
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.suggest.outputs.issue }}
          ANSWER: ${{ needs.suggest.outputs.labels }}
          COMMENT: ${{ github.event_name == 'issues' || inputs.comment }}
        run: |
          # Only labels in triage.json, in its groups, never the answer's own text.
          labels=$(jq -c --slurpfile allowed "$RUNNER_TEMP/triage.json" '
            [.type // empty] as $t | (.area // []) as $a | (.platform // []) as $p
            | [($t[] | select(. as $l | $allowed[0].type | has($l))),
               ($a[] | select(. as $l | $allowed[0].area | has($l))),
               ($p[] | select(. as $l | $allowed[0].platform | has($l)))]
            | unique' <<<"$ANSWER")
          [ "$labels" != "[]" ] || exit 0
          {
            printf '**Toskar suggests:** %s\n\n' "$(jq -r 'map("`" + . + "`") | join(", ")' <<<"$labels")"
            printf '<sub>From [Ask Toskar](https://github.com/yeixio/toskar-action), on our own computer. A maintainer applies the labels.</sub>\n'
            printf '<!-- toskar-triage %s -->\n' "$labels"
          } > comment.md
          { echo "### Issue #$ISSUE"; cat comment.md; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$COMMENT" = true ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          fi
