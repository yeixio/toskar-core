name: User guide screenshots

# The user guide's screenshots (docs/user-guide/screens.json) are captured
# from the web UI with demo data, not taken by hand, so they follow the
# interface (#882). On a pull request this captures them, says which ones
# changed, and attaches them for review; a screen that doesn't render fails.
# On main it commits the ones that changed, so the guide at a release tag
# shows that release's interface. It commits only images, which aren't in
# the paths below, so it doesn't start itself again.
on:
  pull_request:
    paths:
      - "web/**"
      - "i18n/**"
      - "internal/screenshot/**"
      - "cmd/screenshot/**"
      - "docs/user-guide/guide.json"
      - "docs/user-guide/screens.json"
      - "scripts/screenshots/**"
      - "scripts/capture-docs-screenshots.sh"
      - ".github/workflows/docs-screenshots.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "i18n/**"
      - "internal/screenshot/**"
      - "cmd/screenshot/**"
      - "docs/user-guide/guide.json"
      - "docs/user-guide/screens.json"
      - "scripts/screenshots/**"
      - "scripts/capture-docs-screenshots.sh"
      - ".github/workflows/docs-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ${{ fromJSON(vars.TRUSTED_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          # Self-hosted runners keep Go's caches on disk. Saving them to
          # GitHub took 18-21 minutes after under a minute of work, and ran
          # the job past its limit (#970, #971).
          cache: false
      # Each job gets its own pnpm: self-hosted runners share a home folder,
      # and two jobs installing into ~/setup-pnpm at once break each other.
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            scripts/screenshots/pnpm-lock.yaml
      - name: Capture the user guide's screenshots
        run: scripts/capture-docs-screenshots.sh
      - name: Which screenshots changed
        id: changed
        run: |
          set -euo pipefail
          changed="$(git status --porcelain -- docs/user-guide/images | awk '{print $2}')"
          {
            echo "### User guide screenshots"
            if [ -z "$changed" ]; then
              echo "No screenshot changed."
            else
              echo "These changed; they're attached to this run as **user-guide-screenshots**:"
              echo
              printf -- '- `%s`\n' $changed
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "any=$([ -n "$changed" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.changed.outputs.any == 'true'
        continue-on-error: true
        with:
          name: user-guide-screenshots
          path: docs/user-guide/images
          retention-days: 7
      - name: Keep what the page showed when a screen timed out
        if: failure()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: user-guide-screenshot-failures
          path: screenshot-failed-*.png
          if-no-files-found: ignore
          retention-days: 7
      # On main, the changed screenshots go straight to main with the docs
      # deploy key (the ruleset lets deploy keys push), or in a pull request
      # without one.
      - name: Commit the changed screenshots
        if: github.event_name != 'pull_request' && steps.changed.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # main may have moved while the screens were captured, even with
          # these same screenshots, as when a refresh merged meanwhile. A
          # rebase can't merge two PNGs, so the screenshots go on top of
          # the newest main instead, and nothing is committed if it has
          # them already. A change to the interface since then starts
          # another run, which captures it.
          shots="$RUNNER_TEMP/user-guide-images"
          rm -rf "$shots"
          cp -R docs/user-guide/images "$shots"
          git fetch origin main
          git checkout -f -B docs-screenshots origin/main
          rm -rf docs/user-guide/images
          cp -R "$shots" docs/user-guide/images
          git add -A docs/user-guide/images
          if git diff --cached --quiet; then
            echo "main already has these screenshots"
            exit 0
          fi
          git commit -m "docs: refresh the user guide's screenshots"
          scripts/release-publish.sh docs-screenshots \
            "Refresh the user guide's screenshots" \
            "Captured from $GITHUB_SHA by the User guide screenshots workflow."
