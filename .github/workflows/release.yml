name: Release

# Press Run workflow under Actions → Release to release main. It takes the
# newest version in CHANGELOG.md, which the Release PR wrote, checks main
# passed its checks and the quality gate, then tags the commit and ships it.
# Give a version, such as 1.16.0-beta.1, for a pre-release or to choose one.
# Pushing a v* tag by hand still works too.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 1.16.0-beta.1 (leave empty for the newest in CHANGELOG.md)
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: read

# One release at a time, so two presses can't pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The tag this run releases: the pushed tag, or the next one for main. A
  # pressed run checks the version here and tags only once the checks and
  # quality pass, so a failed run leaves no tag behind.
  version:
    runs-on: ${{ fromJSON(vars.TRUSTED_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          sparse-checkout: |
            .github/scripts
            CHANGELOG.md
          sparse-checkout-cone-mode: false
      - id: pick
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error title=Not released::Release from main, not $GITHUB_REF_NAME."
            exit 1
          fi
          SHA="$GITHUB_SHA" .github/scripts/pick-release-tag.sh

  # The tagged commit passed CI, Examples, and every other check that ran on
  # main for it. The checks a pull request skips for its paths all run on
  # main, so this is where they hold a release.
  checks:
    needs: version
    runs-on: ${{ fromJSON(vars.TRUSTED_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: The tagged commit is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/require-green.sh

  # Chat quality gates the release: the quality set against a real model
  # (tests/quality, scripts/quality-model.sh) must not be clearly under its
  # 90% bar, the whole 95% interval below it (#834), before anything is
  # published.
  quality:
    needs: checks
    runs-on: ${{ fromJSON(vars.TRUSTED_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          # The newest patch release, not one a runner has cached: patches
          # fix security problems in the standard library that builds ship.
          check-latest: true
          cache: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/cache@v6
        if: runner.environment == 'github-hosted'
        with:
          path: .quality-cache
          key: quality-model-b11174-llama-3.2-1b-q4km
      - name: Note the network counters
        run: scripts/ci-traffic.sh start "$HOME/.cache/toskar-quality-model"
      - name: Quality set with a real model
        env:
          GH_TOKEN: ${{ github.token }}
          TOSKAR_QUALITY_REPORT: ${{ runner.temp }}/quality-report.md
        run: scripts/quality-model.sh run
      - name: Network use
        if: always()
        run: scripts/ci-traffic.sh report
      - name: Report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/quality-report.md" ]; then
            head -c 60000 "$RUNNER_TEMP/quality-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-report-core
          path: ${{ runner.temp }}/quality-report.md
          if-no-files-found: ignore

  release:
    needs: [version, quality]
    runs-on: ${{ fromJSON(vars.TRUSTED_RUNS_ON || '"ubuntu-latest"') }}
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      # A pressed run tags the commit now that it passed. The tag is pushed
      # with the workflow's own token, which doesn't start another Release.
      - name: Tag the release
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          existing="$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)"
          if [ -n "$existing" ]; then
            # A re-run after the tag went out.
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error title=Not released::$TAG already exists on ${existing:0:7}, not ${GITHUB_SHA:0:7}."
              exit 1
            fi
            echo "$TAG is already on ${GITHUB_SHA:0:7}."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "Tagged ${GITHUB_SHA:0:7} as $TAG."
      - name: Save the release guide
        run: cp docs/user-guide/guide.json /tmp/guide.json
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          # The newest patch release, not one a runner has cached: patches
          # fix security problems in the standard library that builds ship.
          check-latest: true
          cache: ${{ runner.environment == 'github-hosted' }}
      # Each job gets its own pnpm: self-hosted runners share a home folder,
      # and two jobs installing into ~/setup-pnpm at once break each other.
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install packaging tools
        run: |
          # A self-hosted runner has dpkg-dev and apt-utils installed already.
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            sudo apt-get update
            sudo apt-get install -y dpkg-dev apt-utils
          fi
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build packages
        env:
          VERSION: ${{ needs.version.outputs.tag }}
          # The apt repository is signed (#599); a stable release, which
          # publishes it, fails without the key rather than going unsigned.
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          APT_REQUIRE_SIGNING: ${{ !contains(needs.version.outputs.tag, '-') && '1' || '' }}
        run: |
          VERSION="${VERSION#v}"
          chmod +x scripts/build/package-core-release.sh scripts/build/write-brew-formula.sh scripts/build/apt-index.sh scripts/build/test-apt-repo.sh
          VERSION="$VERSION" ./scripts/build/package-core-release.sh
          VERSION="$VERSION" ./scripts/build/write-brew-formula.sh
          ./scripts/build/apt-index.sh
      # A fresh Ubuntu adds the signed repository the documented way and
      # installs toskar from it, before anything is published (#599).
      - name: Test the apt repository
        if: ${{ !contains(needs.version.outputs.tag, '-') }}
        run: ./scripts/build/test-apt-repo.sh dist/apt
      - name: Write the release body
        env:
          PRERELEASE: ${{ contains(needs.version.outputs.tag, '-') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Thank everyone outside MAINTAINERS.md with a commit since the
          # last release. A failed lookup leaves the line out, not the release.
          THANKS="$(./scripts/release-thanks.sh "$GITHUB_REPOSITORY" "$TAG" || true)"
          # This version's section of CHANGELOG.md: what changed, and what to
          # know before updating, such as compatibility notes.
          VERSION="${TAG#v}"
          SECTION="$(awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md)"
          if [ -z "$SECTION" ]; then
            echo "::warning::CHANGELOG.md has no section for $VERSION; the release body has install steps only."
          fi
          {
            if [ "$PRERELEASE" = "true" ]; then
              # Homebrew and apt are not updated for a pre-release (see below),
              # so their commands install the latest stable release.
              printf '%s\n\n' "**Pre-release.** Homebrew and apt install the latest stable release, not this one. To try ${TAG}, use the archives or packages attached below."
            fi
            if [ -n "$SECTION" ]; then
              printf '## What changed in %s\n%s\n\n' "$VERSION" "$SECTION"
            fi
            if [ -n "$THANKS" ]; then
              printf '%s' "$THANKS"
            fi
            cat packaging/release-install.md
          } > /tmp/release-body.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Toskar ${{ needs.version.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
          body_path: /tmp/release-body.md
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            scripts/install.sh
            scripts/install.ps1
            scripts/benchmark.sh
            scripts/benchmark.ps1
      # Homebrew and apt serve stable releases. A pre-release (a tag with a
      # suffix such as -beta.1) must not replace what their users install.
      - name: Publish the Homebrew formula
        if: ${{ !contains(needs.version.outputs.tag, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          # The new formula is already written in the worktree. Keep a copy, then
          # discard that change so checkout can switch onto main.
          cp Formula/toskar.rb /tmp/toskar.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -f -B formula origin/main
          mkdir -p Formula
          cp /tmp/toskar.rb Formula/toskar.rb
          git add Formula/toskar.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula matches main"
          else
            git commit -m "Publish the Homebrew formula for ${TAG#v}."
            scripts/release-publish.sh formula \
              "Publish the Homebrew formula for ${TAG#v}" \
              "Updates Formula/toskar.rb from the ${TAG} release."
          fi
      - name: Publish the apt repository
        if: ${{ !contains(needs.version.outputs.tag, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          workdir="$(mktemp -d)"
          if git ls-remote --heads "$remote" apt | grep -q refs/heads/apt; then
            git clone --branch apt --single-branch "$remote" "$workdir"
            git -C "$workdir" rm -rf .
          else
            git clone --depth 1 "$remote" "$workdir"
            git -C "$workdir" checkout --orphan apt
            git -C "$workdir" rm -rf --cached . >/dev/null 2>&1 || true
            find "$workdir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          cp -a dist/apt/. "$workdir/"
          git -C "$workdir" config user.name 'github-actions[bot]'
          git -C "$workdir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$workdir" add dists pool toskar.asc
          git -C "$workdir" commit -m "Update the apt repository."
          git -C "$workdir" push origin HEAD:apt
      - name: Publish versioned documentation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -f -B documentation origin/main
          python3 scripts/publish-docs.py \
            --source /tmp/guide.json \
            --destination . \
            --version "$version" \
            --commit "$GITHUB_SHA"
          git add docs/index.json "docs/${version}.json"
          if git diff --cached --quiet; then
            echo "Documentation already published for ${version}"
            exit 0
          fi
          git commit -m "docs: publish Toskar ${version}"
          scripts/release-publish.sh documentation \
            "Publish the documentation for ${version}" \
            "Freezes docs/${version}.json from the ${TAG} release."

  # Capture the release's screenshots and walkthrough and attach them to it,
  # for toskar.ai. A failure here does not undo the release.
  screenshots:
    needs: [version, release]
    if: success()
    permissions:
      contents: write
    uses: ./.github/workflows/screenshots.yml
    with:
      tag: ${{ needs.version.outputs.tag }}

  start-desktop:
    needs: [version, release]
    if: success()
    runs-on: ${{ fromJSON(vars.TRUSTED_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - name: Start the matching desktop release
        env:
          # TOSKAR_APPS_TOKEN, or an earlier name for the same token (#271).
          APPS_TOKEN: ${{ secrets.TOSKAR_APPS_TOKEN || secrets.TOSKAR_DESKTOP_TOKEN || secrets.YGGDRASIL_DESKTOP_TOKEN }}
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${APPS_TOKEN}" ]; then
            # The release itself succeeded, so this is a warning, not a failure.
            echo "::warning title=Apps not notified::TOSKAR_APPS_TOKEN is not set, so toskar-apps was not told about ${VERSION}. Its daily backup check will find the release, or start its Release workflow by hand. See docs/release-checklist.md."
            exit 0
          fi
          GH_TOKEN="$APPS_TOKEN" gh api repos/yeixio/toskar-apps/dispatches \
            -f event_type=core-release \
            -f "client_payload[version]=${VERSION#v}"
          echo "Told toskar-apps about ${VERSION}."
