name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save the release guide
        run: cp docs/user-guide/guide.json /tmp/guide.json
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build packages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          chmod +x scripts/build/package-core-release.sh scripts/build/write-brew-formula.sh scripts/build/apt-index.sh
          VERSION="$VERSION" ./scripts/build/package-core-release.sh
          VERSION="$VERSION" ./scripts/build/write-brew-formula.sh
          ./scripts/build/apt-index.sh
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Yggdrasil ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: packaging/release-install.md
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS.txt
      - name: Open the Homebrew formula pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The new formula is already written in the worktree. Keep a copy, then
          # discard that change so checkout can switch onto main.
          cp Formula/yggdrasil.rb /tmp/yggdrasil.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -f -B formula origin/main
          mkdir -p Formula
          cp /tmp/yggdrasil.rb Formula/yggdrasil.rb
          git add Formula/yggdrasil.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula matches main"
          else
            git commit -m "Publish the Homebrew formula for ${GITHUB_REF_NAME#v}."
            # formula is a release branch. main requires a pull request, so this ref is replaced each release.
            git push --force origin HEAD:formula
            # gh pr view matches a merged pull request for this head, so look for an open one.
            if [ -z "$(gh pr list --head formula --base main --state open --json number --jq '.[0].number')" ]; then
              gh pr create --base main --head formula \
                --title "Publish the Homebrew formula for ${GITHUB_REF_NAME#v}" \
                --body "Updates Formula/yggdrasil.rb from the ${GITHUB_REF_NAME} release."
            fi
            # main requires a pull request. Merge it in this job so the formula is on the default branch Homebrew taps.
            gh pr merge formula --squash --admin
          fi
      - name: Publish the apt repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          workdir="$(mktemp -d)"
          if git ls-remote --heads "$remote" apt | grep -q refs/heads/apt; then
            git clone --branch apt --single-branch "$remote" "$workdir"
            git -C "$workdir" rm -rf .
          else
            git clone --depth 1 "$remote" "$workdir"
            git -C "$workdir" checkout --orphan apt
            git -C "$workdir" rm -rf --cached . >/dev/null 2>&1 || true
            find "$workdir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          cp -a dist/apt/. "$workdir/"
          git -C "$workdir" config user.name 'github-actions[bot]'
          git -C "$workdir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$workdir" add dists pool
          git -C "$workdir" commit -m "Update the apt repository."
          git -C "$workdir" push origin HEAD:apt
      - name: Publish versioned documentation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          # main requires a pull request, so this ref is replaced each release.
          git checkout -f -B documentation origin/main
          python3 scripts/publish-docs.py \
            --source /tmp/guide.json \
            --destination . \
            --version "$version" \
            --commit "$GITHUB_SHA"
          git add docs/index.json "docs/${version}.json"
          if git diff --cached --quiet; then
            echo "Documentation already published for ${version}"
            exit 0
          fi
          git commit -m "docs: publish Yggdrasil ${version}"
          git push --force origin HEAD:documentation
          if [ -z "$(gh pr list --head documentation --base main --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head documentation \
              --title "Publish the documentation for ${version}" \
              --body "Freezes docs/${version}.json from the ${GITHUB_REF_NAME} release."
          fi
          gh pr merge documentation --squash --admin

  start-desktop:
    needs: release
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Start the matching desktop release
        env:
          DESKTOP_TOKEN: ${{ secrets.YGGDRASIL_DESKTOP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${DESKTOP_TOKEN}" ]; then
            echo "YGGDRASIL_DESKTOP_TOKEN is not set. The desktop repository checks for this release every hour after this job succeeds."
            exit 0
          fi
          GH_TOKEN="$DESKTOP_TOKEN" gh api repos/yeixio/yggdrasil-desktop/dispatches \
            -f event_type=core-release \
            -f "client_payload[version]=${VERSION#v}"
