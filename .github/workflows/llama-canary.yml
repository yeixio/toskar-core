name: llama.cpp canary

# Checks each night that the newest llama.cpp release, the one Toskar would
# install, computes what the known-good tag does on the backends people run
# (#833, tests/canary): Metal on the home Mac, Vulkan on the home Linux box's
# AMD card, and the CPU on both. On the Mac it also checks that thinking
# comes apart from the answer and turns off, for a model of each family
# that thinks first (#840, tests/thinking). A failure opens an issue with
# the numbers (or adds them to the open one).
#
# Run it by hand with "refresh" to measure each lane's golden on the good
# tag. The run shows the goldens.json change; it goes in through a reviewed
# pull request, never from the workflow.

on:
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: The llama.cpp release to check, such as b11946. Blank for the newest.
        default: ""
      refresh:
        description: Measure the goldens on the good tag instead of checking a release.
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: llama-canary
  cancel-in-progress: false

jobs:
  canary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: mac
            runs-on: '["self-hosted", "toskar-mac"]'
            lanes: metal-arm64:macos-arm64:1 cpu-arm64:macos-arm64:0
          - host: linux
            runs-on: '["self-hosted", "toskar-ci"]'
            lanes: vulkan-x64:ubuntu-vulkan-x64:1 cpu-x64:ubuntu-x64:0
    name: canary (${{ matrix.host }})
    # The lanes need the home runners' GPUs, so they name them, as the
    # quality run's real-models job does; GitHub's runners have none.
    if: github.repository == 'yeixio/toskar-core'
    runs-on: ${{ fromJSON(matrix.runs-on) }}
    timeout-minutes: 60
    outputs:
      held_mac: ${{ steps.canary.outputs.held_mac }}
      held_linux: ${{ steps.canary.outputs.held_linux }}
    env:
      GH_TOKEN: ${{ github.token }}
      CANARY_NEW_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          # Self-hosted runners keep Go's caches on disk.
          cache: false
      - name: Cache
        run: |
          # Builds and the model stay on the runner between nights; builds
          # unused for two weeks go.
          echo "CANARY_CACHE=$RUNNER_TOOL_CACHE/toskar-canary" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TOOL_CACHE/toskar-canary"
          find "$RUNNER_TOOL_CACHE/toskar-canary" -mindepth 1 -maxdepth 1 -name 'llama.cpp-*' -mtime +14 -exec rm -rf {} +
      - name: Vulkan image
        if: matrix.host == 'linux'
        run: |
          # llama.cpp's Linux builds run in Debian 13 with Mesa's drivers,
          # as the daemon's GPU image does (Dockerfile, target gpu), with the
          # card passed in.
          docker build -t toskar-canary-vulkan - <<'EOF'
          FROM debian:trixie-slim
          RUN apt-get update && apt-get install -y --no-install-recommends \
                ca-certificates libgomp1 libcurl4t64 libvulkan1 mesa-vulkan-drivers vulkan-tools \
           && rm -rf /var/lib/apt/lists/*
          EOF
          exec="docker run --rm --device /dev/dri -e LD_LIBRARY_PATH -v $CANARY_CACHE:$CANARY_CACHE -v $PWD:$PWD -w $PWD toskar-canary-vulkan"
          echo "TOSKAR_CANARY_EXEC=$exec" >> "$GITHUB_ENV"
          echo "GPUs the canary can use:"
          docker run --rm --device /dev/dri toskar-canary-vulkan vulkaninfo --summary 2>/dev/null | grep -E "deviceName|deviceType" || echo "::warning::No Vulkan device; the Vulkan lane will fail."
      - name: Canary
        id: canary
        run: |
          status=0
          for lane in ${{ matrix.lanes }}; do
            IFS=: read -r name build gpu <<<"$lane"
            report="$RUNNER_TEMP/canary-$name.md"
            if [ "${{ inputs.refresh }}" = true ]; then
              CANARY_LANE="$name" CANARY_BUILD="$build" CANARY_GPU="$gpu" TOSKAR_CANARY_REPORT="$report" \
                scripts/llama-canary.sh refresh || status=1
            else
              tag="${CANARY_NEW_TAG:-$(CANARY_BUILD="$build" scripts/llama-canary.sh newest)}"
              CANARY_LANE="$name" CANARY_BUILD="$build" CANARY_GPU="$gpu" TOSKAR_CANARY_REPORT="$report" CANARY_NEW_TAG="$tag" \
                scripts/llama-canary.sh run || status=1
              # A release that computes differently is held back (the hold
              # job); a golden miss alone is this machine changing.
              if grep -qE '^### .*failed \(.*(release|cpu)' "$report" 2>/dev/null; then
                echo "held_${{ matrix.host }}=$tag" >> "$GITHUB_OUTPUT"
              fi
            fi
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
          if [ "${{ inputs.refresh }}" = true ]; then
            { echo '### goldens.json'; echo; echo '```diff'; git diff tests/canary/goldens.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Thinking per family
        # gpt-oss-20b needs about 13 GB, which the Mac has to spare. A
        # failure opens the issue but doesn't hold installs back: thinking
        # that won't turn off is slower, not wrong.
        if: ${{ !cancelled() && matrix.host == 'mac' && inputs.refresh != true }}
        run: |
          report="$RUNNER_TEMP/canary-thinking.md"
          status=0
          CANARY_BUILD=macos-arm64 TOSKAR_THINKING_REPORT="$report" scripts/llama-canary.sh thinking || status=1
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"
      - name: Open an issue
        if: failure() && inputs.refresh != true
        run: |
          # One open issue holds a regression's nights, so a release that
          # stays broken doesn't open one a day.
          title="llama.cpp canary failed"
          body="$RUNNER_TEMP/issue.md"
          {
            echo "The [llama.cpp canary]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) failed on the ${{ matrix.host }} runner (#833)."
            echo
            cat "$RUNNER_TEMP"/canary-*.md 2>/dev/null || echo "It stopped before it measured anything; see the run's log."
          } > "$body"
          open="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number -q '.[0].number')"
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
          fi

  # Holds installs back when a release computes differently (#833):
  # runtimes/llama-cpp.json names the first release held, and the daemon
  # installs the newest release before it (internal/runtimes/llamacpp/hold.go).
  # The hold stays on through later failing nights, and comes off the first
  # night the newest release passes everywhere. A run by hand for one tag,
  # or a refresh, leaves it as it is.
  hold:
    needs: canary
    if: always() && github.repository == 'yeixio/toskar-core' && inputs.refresh != true && inputs.tag == ''
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      # A write deploy key for this workflow alone puts the hold straight on
      # main; without it, the hold opens a pull request (scripts/release-publish.sh).
      RELEASE_DEPLOY_KEY: ${{ secrets.CANARY_DEPLOY_KEY }}
      HELD: ${{ needs.canary.outputs.held_mac || needs.canary.outputs.held_linux }}
      PASSED: ${{ needs.canary.result == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Set or lift the hold
        run: |
          set -euo pipefail
          file=runtimes/llama-cpp.json
          current="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("hold_from", ""))' "$file")"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$HELD" ] && [ -z "$current" ]; then
            from="$HELD"
            reason="the llama.cpp canary found $HELD computes differently from the known-good release ($run)"
            title="Hold llama.cpp installs before $HELD"
          elif [ "$PASSED" = true ] && [ -n "$current" ]; then
            from=""
            reason=""
            title="Lift the llama.cpp hold from $current"
          else
            echo "The hold stays as it is: ${current:-none}."
            exit 0
          fi
          python3 - "$file" "$from" "$reason" <<'EOF'
          import json, sys
          path, held, reason = sys.argv[1:]
          data = json.load(open(path))
          data["hold_from"], data["reason"] = held, reason
          open(path, "w").write(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "$title." -m "From the llama.cpp canary: $run (#833)."
          scripts/release-publish.sh llama-cpp-hold "$title" "From the [llama.cpp canary]($run) (#833). The daemon reads runtimes/llama-cpp.json before it installs llama.cpp."
          echo "$title" >> "$GITHUB_STEP_SUMMARY"
          open="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search '"llama.cpp canary failed" in:title' --json number -q '.[0].number')"
          if [ -n "$open" ]; then
            if [ -n "$from" ]; then
              gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "Installs are held at the releases before $from until a newer release passes."
            else
              gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "The newest release passes on every lane, so installs are no longer held back."
            fi
          fi
