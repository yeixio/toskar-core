      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [build]
              properties:
                build:
                  type: string
                  enum: [gpu, cpu]
      responses:
        "202":
          description: The setup status; a switch that installs a build shows as a job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageSetup"
        "409":
          description: SETUP_REFUSED, such as gpu on a computer without a GPU the build can use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
