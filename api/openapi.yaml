            properties:
              id: {type: string}
              name: {type: string}
              kind: {type: string}
              status: {type: string}
              healthy: {type: boolean}
        artifacts:
          type: object
          description: Summarizes stored files.
          required: [bytes, count]
          properties:
            count: {type: integer}
            bytes: {type: integer, format: int64}
        abilities:
          type: array
          items:
            type: object
            description: Something Yggdrasil can or cannot do right now, and why.
            required: [available, id, label]
            properties:
              id: {type: string}
              label: {type: string}
              available: {type: boolean}
              via:
                type: array
                items: {type: string}
              note: {type: string, description: '`note` says how it works, or what would make it possible.'}
              setup:
                type: object
                description: What would add a missing ability, when Yggdrasil can install it (Gungnir §29).
                required: [ability, name, option, size_bytes, tools]
                properties:
                  ability: {type: string}
                  option: {type: string, description: 'What to install, such as an image model''s id.'}
                  name: {type: string}
                  size_bytes: {type: integer, format: int64}
                  node_id: {type: string}
                  node_name: {type: string}
                  remote: {type: boolean, description: 'A paired computer, not this one (#153), and FreeBytes its free disk space, when known.'}
                  free_bytes: {type: integer, format: int64}
                  tools:
                    type: array
                    description: The tools it makes ready; a profile that denies them is not offered it.
                    items: {type: string}
                  slow: {type: boolean, description: 'A computer without GPU acceleration for it, where each picture takes minutes and a clip can take most of an hour.'}
                  tight_memory: {type: boolean, description: 'A computer below the memory it''s comfortable with, where it may be slow or fail.'}
                  verdict: {type: string, description: 'Verdict, Short, NeedBytes, and HaveBytes are the model''s, from its setup status (#550).'}
                  short: {type: string}
                  need_bytes: {type: integer, format: int64}
                  have_bytes: {type: integer, format: int64}
        setups:
          type: array
          description: Installable ways to add missing abilities.
          items:
            type: object
            description: 'An installable way to add an ability: a provider, how much it downloads, and the computer it would run on.'
            required: [ability, name, option, size_bytes, tools]
            properties:
              ability: {type: string}
              option: {type: string, description: 'What to install, such as an image model''s id.'}
              name: {type: string}
              size_bytes: {type: integer, format: int64}
              node_id: {type: string}
              node_name: {type: string}
              remote: {type: boolean, description: 'A paired computer, not this one (#153), and FreeBytes its free disk space, when known.'}
              free_bytes: {type: integer, format: int64}
              tools:
                type: array
                description: The tools it makes ready; a profile that denies them is not offered it.
                items: {type: string}
              slow: {type: boolean, description: 'A computer without GPU acceleration for it, where each picture takes minutes and a clip can take most of an hour.'}
              tight_memory: {type: boolean, description: 'A computer below the memory it''s comfortable with, where it may be slow or fail.'}
              verdict: {type: string, description: 'Verdict, Short, NeedBytes, and HaveBytes are the model''s, from its setup status (#550).'}
              short: {type: string}
              need_bytes: {type: integer, format: int64}
              have_bytes: {type: integer, format: int64}
    ClassifiedMaterial:
