  /api/v1/chat:
    post:
      summary: Send a chat message
      description: "Without stream, returns {content, metrics}. With stream, a server-sent event stream of token events, then done; an error event ends it early."
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conversation_id:
                  type: string
                message:
                  type: string
                profile_id:
                  type: string
                model_id:
                  type: string
                  description: "A model id, auto, or sai:<slug>"
                effort:
                  type: string
                  enum: [auto, fast, balanced, thorough]
                time_zone:
                  type: string
                  description: "The person's IANA time zone, such as America/Juneau, for the date and time the answer uses; this computer's when empty or unknown"
                parent_id:
                  type: string
                  description: Answer from this message in the chat, as a new version of the point after it (#447)
                retry_of:
                  type: string
                  description: Ask this answer's question again, as a new version of the answer; message may be empty
                edit_of:
                  type: string
                  description: Send message in place of this one, as a new version of it
                client:
                  type: string
                  enum: [phone, tablet, watch, tv, desktop, web]
                  description: The app asking; its run is traced with it, to measure how long answers take to start
                attachments:
                  type: array
                  items:
                    type: string
                  description: Artifact ids from POST /api/v1/artifacts
                execution:
                  type: string
                  description: Where the turn runs, such as local
                stream:
                  type: boolean
              required: [message]
      responses:
        "200":
          description: The answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatAnswer"
            text/event-stream:
              schema:
                type: string
              x-events:
                token: {$ref: "#/components/schemas/ChatToken"}
                done: {$ref: "#/components/schemas/ChatDone"}
                error_code: {$ref: "#/components/schemas/ErrorBody"}
                error: {type: string, description: "The error's message, as plain text, after error_code; for clients from before error codes"}
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/chat/stop:
