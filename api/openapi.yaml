        not_after: {type: string, format: date-time}
        custom: {type: boolean, description: 'The person''s own certificate (api_tls_cert, api_tls_key).'}
        error: {type: string, description: 'Why their certificate couldn''t be used, so Toskar''s own is.'}
    Task:
      type: object
      description: An orchestration unit of work.
      required: [created_at, id, profile_id, prompt, status]
      properties:
        id: {type: string}
        profile_id: {type: string}
        conversation_id: {type: string}
        prompt: {type: string}
        status: {type: string}
        result: {type: string}
        error: {type: string}
        error_code: {type: string, description: '`error_code` and ErrorDetails are Error''s stable code and values (#588).'}
        error_details:
          type: object
          additionalProperties: {}
        created_at: {type: string, format: date-time}
    TrainingBaseModel:
      type: object
      description: One recommended base model.
      required: [display_name, fit, installed, license, model_id, parameters, reasons, recommended]
      properties:
        model_id: {type: string}
        display_name: {type: string}
        parameters: {type: string}
        license: {type: string}
        license_note: {type: string}
        installed: {type: boolean}
        recommended: {type: boolean}
        reasons:
