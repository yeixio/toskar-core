              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeSource"
    post:
      summary: Connect a file, folder, upload, pasted text, database, or web API
      operationId: createKnowledgeSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                kind:
                  type: string
                  enum: [path, text, database, api]
                path:
                  type: string
                  description: A file or folder, for path
                filename:
                  type: string
                  description: "For text; its extension picks the reader"
                text:
                  type: string
                content_base64:
                  type: string
                  description: A binary upload such as .xlsx, in place of text
                profile_ids:
                  type: array
                  items:
                    type: string
                  description: Profiles that use the new source from now on; an unknown one answers 404 PROFILE_NOT_FOUND and saves nothing
                remote:
                  type: object
                  properties:
                    driver:
                      type: string
                      description: sqlite, postgres, or mysql
                    database:
                      type: string
                      description: SQLite file path
                    connection_string:
                      type: string
                      description: "PostgreSQL or MySQL; empty on update keeps the stored one"
                    query:
                      type: string
                      description: A read-only SELECT
                    url:
                      type: string
                      description: A web API returning JSON, CSV, or text
                    items:
                      type: string
                      description: Where the items are in a JSON response
                    headers:
                      type: object
                      additionalProperties:
                        type: string
                      description: "Sent with API requests; an empty value on update keeps the stored one"
                    refresh_minutes:
                      type: integer
              required: [kind]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSource"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
