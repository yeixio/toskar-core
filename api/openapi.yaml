              id: {type: string}
              name: {type: string}
              description: {type: string}
              source: {type: string, description: 'Builtin, connector:<id>, or mcp:<id>.'}
              risk: {type: string}
              enabled: {type: boolean}
              unavailable: {type: string, description: '`unavailable` says why a tool that is on cannot run on this computer yet, such as image generation before it is set up.'}
        connectors:
          type: array
          items:
            type: object
