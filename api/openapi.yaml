            sys_bytes: {type: integer, format: int64}
        samples:
          type: array
          items:
            type: object
            description: The daemon's own memory and background work at a moment.
            required: [at, goroutines, heap_bytes, sys_bytes]
            properties:
              at: {type: string, format: date-time}
              goroutines: {type: integer, description: The daemon's background tasks.}
              heap_bytes: {type: integer, format: int64, description: Memory in use by Go objects; SysBytes is all the memory the Go runtime holds from the system.}
              sys_bytes: {type: integer, format: int64}
        interval_seconds: {type: integer, description: 'How often a sample is kept, in seconds.'}
    TLSInfo:
