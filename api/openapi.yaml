      summary: Load a model
      operationId: startModel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                node_id:
                  type: string
      responses:
        "200":
          description: The running instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunningModelView"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/models/{id}/stop:
    post:
      summary: Unload a model instance
      operationId: stopModel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                node_id:
                  type: string
