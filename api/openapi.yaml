components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API key from the API Access page, or TOSKAR_API_KEY
  schemas:
    License:
      type: object
      properties:
        kind: {type: string, enum: ["", available, trial, unlocked, ended]}
        trial_ends: {type: string, format: date-time}
        store: {type: string, enum: [mac, windows]}
        limited: {type: boolean, description: New setup waits for the Unlock.}
        days_left: {type: integer, description: Days left in a trial, rounded up.}
    PushStatus:
      type: object
      properties:
        relay:
          type: string
          description: The push relay to register with.
        computer_key:
          type: string
          description: This computer's Ed25519 public key, base64.
        registered:
          type: boolean
        platform:
          type: string
    AssistantOptions:
      type: object
      description: The assistant's own controls for an OpenAI-compatible request, sent as toskar (or yggdrasil, its name from before the rename)
      properties:
        memory:
          type: boolean
        knowledge:
          type: boolean
        knowledge_sources:
          type: array
          items:
            type: string
        tools:
          type: array
          items:
            type: string
        effort:
          type: string
          enum: [auto, fast, balanced, thorough]
        placement:
          type: string
          enum: [local, automatic]
        progress:
          type: boolean
          description: Stream progress and tool activity as chunks with an empty delta and the toskar and yggdrasil fields
    RuntimeSample:
      type: object
      properties:
        at:
          type: string
          format: date-time
        goroutines:
          type: integer
          description: The daemon's background tasks
        heap_bytes:
          type: integer
          description: Memory in use by Go objects
        sys_bytes:
          type: integer
          description: All memory the Go runtime holds from the system
    PersonalStyle:
      type: object
      properties:
        length:
          type: string
          enum: [brief, balanced, detailed]
        tone:
          type: string
          enum: [friendly, neutral, direct]
        format:
          type: string
          enum: [prose, lists]
        units:
          type: string
          enum: [metric, imperial]
        about_me:
          type: string
          maxLength: 1500
        instructions:
          type: string
          maxLength: 1500
    ExternalServer:
      type: object
      properties:
        base_url: {type: string}
        has_key: {type: boolean}
        models: {type: array, items: {type: string}}
        error: {type: string, description: Why the model list couldn't be read}
    JoinToken:
      type: object
      properties:
        id: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        used_at: {type: string, format: date-time}
        used_by: {type: string}
        revoked_at: {type: string, format: date-time}
        status: {type: string, enum: [active, used, revoked, expired]}
    NetworkNode:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        address: {type: string}
        status: {type: string}
        fingerprint: {type: string}
    RatingTag:
      type: string
      enum: [great_responses, fast, slow, stable, crashed, too_much_memory, great_for_coding, great_for_chat, good_tool_use, poor_tool_use]
    ModelRating:
      type: object
      description: A person's rating of one model and what sharing it would send.
      required: [ask, model_id, rateable, share_observations, shared, tags]
      properties:
        model_id: {type: string}
        rateable: {type: boolean, description: False when the model cannot be compared with others' ratings (reason says why); it can still be rated on this computer.}
        reason: {type: string}
        stars: {type: integer, description: Absent when not rated}
        tags:
          type: array
          items: {type: string}
        language: {type: string, description: 'The language the rating is for, or "".'}
        shared: {type: boolean}
        shared_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        share_observations: {type: boolean, description: The shared rating includes how the model runs here}
        observations: {$ref: '#/components/schemas/RatingObservations'}
        ask: {type: boolean, description: A good time to ask for a rating}
        shares:
          type: object
          description: What sharing sends besides the stars, tags, a random rating ID, and the app version
          required: [destination, hardware, model]
          properties:
            destination: {type: string}
            model:
              type: object
              description: Which model a rating is about. Ratings of different formats, quantizations, runtimes, or backends are never combined.
              required: [backend, format, id, quantization, runtime]
              properties:
                id: {type: string, description: 'The base model as a lower-case slug, such as qwen2.5-coder-7b-instruct: the same whoever converted it.'}
                format: {type: string}
                quantization: {type: string}
                runtime: {type: string}
                backend: {type: string}
            hardware:
              type: object
              description: 'A computer''s class: never a name, serial, or address.'
              required: [architecture, family, memory_bucket_gb, memory_type, platform, vendor]
              properties:
                platform: {type: string}
                architecture: {type: string}
                vendor: {type: string, description: 'Apple, nvidia, amd, intel, or cpu (no accelerator).'}
                family: {type: string, description: 'The accelerator model, such as m4-max or rtx-4090, or for cpu, the CPU''s maker.'}
                memory_type: {type: string, description: 'Unified, dedicated, or system.'}
                memory_bucket_gb: {type: string, description: 'The memory the model can use, in GB.'}
    RatingStats:
      type: object
      description: One cohort's ratings.
      required: [average, confidence, ratings, tier, weighted_score]
      properties:
        tier: {type: string, enum: [family, class, backend, global]}
        cohort: {type: string}
        ratings: {type: integer}
        average: {type: number}
        weighted_score: {type: number}
        confidence: {type: string, enum: [limited, early, community]}
        tags:
          type: object
          additionalProperties: {type: integer}
        observed: {type: integer, description: Ratings that shared how the model runs}
        median_tokens_per_second: {type: number}
        median_ttft_ms: {type: number}
        successful_start_rate: {type: number}
        crash_rate: {type: number}
        out_of_memory_rate: {type: number}
    RatingObservations:
      type: object
      description: How a model ran on this computer in the last 30 days, leaving out replies on paired computers; absent when nothing was measured
      properties:
        tokens_per_second: {type: number, description: Median, from 3 or more replies}
        ttft_ms: {type: integer, description: Median time to first token, from 3 or more replies}
        starts: {type: integer}
        start_failures: {type: integer}
        crashed: {type: boolean}
        out_of_memory: {type: boolean}
        context_band: {type: string, enum: [0-8k, 8-32k, 32-128k, 128k+]}
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        product:
          type: string
        version:
          type: string
        acceleration:
          type: string
          enum: [gpu, partial, cpu, cpu_expected, idle]
          description: >-
            Where this computer's loaded models run: every layer on a GPU, some, on the CPU although
            there is a GPU, on the CPU with no GPU to use, or no model loaded. Never changes status.
    RunningModelView:
      type: object
      description: A loaded model instance for the Running tab.
      required: [display_name, instance_id, model_id, node_id, node_name, status]
      properties:
        model_id: {type: string}
        display_name: {type: string}
        instance_id: {type: string}
        node_id: {type: string}
        node_name: {type: string}
        status: {type: string}
        memory_bytes: {type: integer, format: int64}
        endpoint: {type: string}
        speed_tok_per_sec: {type: number, description: Generation speed in the model's latest replies}
        used_by_profiles:
          type: array
          items: {type: string}
        accelerator: {type: string, description: 'The devices the model is on, or CPU'}
        last_used_at: {type: string, format: date-time}
        mode: {type: string, description: '"embedding" or "reranking" for a supporting model serving knowledge search, and empty for a chat model.', enum: [embedding, reranking]}
        acceleration:
          type: object
          description: Where the model runs, from the runtime's own report; absent when that is not known.
          required: [backend, layers_offloaded, layers_total, state]
          properties:
            state: {type: string, description: 'Gpu, partial, cpu, or cpu_expected (Acceleration* constants).'}
            reason: {type: string, description: '`reason` says why for a state short of gpu (AccelerationReason*).'}
            backend: {type: string, description: 'Metal, vulkan, cuda, rocm, sycl, or cpu.'}
            devices:
              type: array
              description: The GPUs the model is on.
              items: {type: string}
            layers_offloaded: {type: integer}
            layers_total: {type: integer}
            gpu_memory_bytes: {type: integer, format: int64, description: What the model takes on its GPUs.}
    GPUSetup:
      type: object
      properties:
        gpu: {type: string, description: The card found; absent when there is none}
        problems:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum: [vulkan_loader_missing, vulkan_driver_missing, render_access_denied, nvidia_driver_missing, windows_driver_missing, cpu_build]
              command: {type: string, description: "A terminal command that fixes it on this computer"}
              url: {type: string, description: Where to get what's missing}
    LiveFigures:
      type: object
      properties:
        node_id: {type: string}
        node_name: {type: string}
        current: {$ref: "#/components/schemas/LiveSample"}
        recent: {type: array, items: {$ref: "#/components/schemas/LiveSample"}}
        day: {type: array, items: {$ref: "#/components/schemas/LiveSample"}}
    LiveSample:
      type: object
      properties:
        at: {type: string, format: date-time}
        cpu_percent: {type: number}
        memory_used_bytes: {type: integer}
        memory_total_bytes: {type: integer}
        gpus: {type: array, items: {$ref: "#/components/schemas/GPUSample"}}
    GPUSample:
      type: object
      description: On Apple silicon the GPU shares system memory, so its memory figures are what the GPU is using.
      properties:
        name: {type: string}
        busy_percent: {type: number}
        memory_used_bytes: {type: integer}
        memory_total_bytes: {type: integer}
        temperature_c: {type: number}
        power_watts: {type: number}
    Acceleration:
      type: object
      description: Where a running model runs, from the runtime's own report when it loaded the model.
      properties:
        state: {type: string, enum: [gpu, partial, cpu, cpu_expected]}
        reason:
          type: string
          enum: [cpu_build, gpu_memory, gpu_unavailable, no_gpu]
          description: >-
            Why a state is short of gpu: the CPU-only runtime build is installed where a GPU build would run,
            the model doesn't fit in GPU memory, a GPU build found no GPU it could use (driver or Vulkan
            missing), or this computer has no GPU.
        backend: {type: string, enum: [metal, vulkan, cuda, rocm, sycl, cpu]}
        devices: {type: array, items: {type: string}}
        layers_offloaded: {type: integer}
        layers_total: {type: integer, description: 0 when the runtime did not say}
        gpu_memory_bytes: {type: integer, description: "The model, its cache, and its working memory on the GPUs"}
    VersionResponse:
      type: object
      description: Returned by GET /api/v1/version.
      required: [build_date, commit, contract, license, product, source, version]
      properties:
        version: {type: string}
        commit: {type: string}
        build_date: {type: string}
        product: {type: string}
        license: {type: string}
        source: {type: string, description: URL of the corresponding source for this build.}
        contract: {$ref: '#/components/schemas/ContractInfo'}
    SourceOffer:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        commit:
          type: string
        license:
          type: string
        source:
          type: string
    HardwareInventory:
      type: object
      additionalProperties: true
    Model:
      type: object
      description: A catalog or installed model.
      required: [capabilities, display_name, id, installed]
      properties:
        id: {type: string}
        display_name: {type: string}
        summary: {type: string}
        family: {type: string}
        variant: {type: string}
        parameters: {type: string, description: e.g. "14B"}
        size_bytes: {type: integer, format: int64}
        memory_needed_bytes: {type: integer, format: int64}
        context: {type: integer}
        capabilities:
          type: object
          description: Describes model features.
          required: [coding, tool_calling, vision]
          properties:
            tool_calling: {type: boolean}
            tool_call_support: {type: string, description: native | compatible | limited | unsupported}
            vision: {type: boolean}
            coding: {type: boolean}
        source:
          type: object
          description: Describes where a model artifact comes from.
          required: [url]
          properties:
            url: {type: string}
            sha256: {type: string}
            format: {type: string}
        purpose:
          type: array
          items: {type: string}
        tags:
          type: array
          description: coding, general, reasoning, vision, fast, large
          items: {type: string}
        runtime:
          type: array
          items: {type: string}
        recommended_roles:
          type: array
          items: {type: string}
        installed: {type: boolean}
        installed_on:
          type: array
          items:
            type: object
            description: Records that a model file is present on a computer.
            required: [node_id, node_name]
            properties:
              node_id: {type: string}
              node_name: {type: string}
        status: {type: string, description: available|downloading|installed|loading|running|stopping|error}
        last_used_at: {type: string, format: date-time}
        fit:
          type: object
          description: Describes how well a model fits a node's hardware.
          required: [expected_memory_bytes, install_allowed, label, model_id]
          properties:
            model_id: {type: string}
            node_id: {type: string}
            node_name: {type: string}
            label: {type: string}
            expected_memory_bytes: {type: integer, format: int64}
            reason: {type: string}
            est_tok_per_sec: {type: number}
            tok_per_sec_measured: {type: boolean}
            runtime_memory_low_bytes: {type: integer, format: int64, description: '`runtime_memory_low_bytes` and RuntimeMemoryHighBytes are a conservative range for weights, KV cache, and runtime buffers. They are not the file size alone.'}
            runtime_memory_high_bytes: {type: integer, format: int64}
            weight_bytes: {type: integer, format: int64}
            quantization: {type: string}
            approximate: {type: boolean}
            context_tokens: {type: integer}
            total_memory_bytes: {type: integer, format: int64}
            available_memory_bytes: {type: integer, format: int64}
            memory_kind: {type: string, description: unified | system}
            headroom: {type: number}
            install_allowed: {type: boolean}
            runtime_warning: {type: string}
            recommendations:
              type: array
              items: {type: string}
            gpu_note: {type: string}
            known_to_run: {type: boolean}
            short: {type: string, description: 'What a model is short of when that holds it back: "shared" on Apple silicon, where the graphics may use only part of memory, with NeedBytes what it needs and HaveBytes what the graphics may use (contract 1.46, #751).'}
            need_bytes: {type: integer, format: int64}
            have_bytes: {type: integer, format: int64}
        dynamic: {type: boolean, description: installed from browse-all / URL}
        support_role: {type: string, description: '`support_role` marks a model that serves Yggdrasil instead of chatting: SupportEmbedding, SupportReranker, or SupportClassifier. Empty for chat models.'}
        languages:
          type: array
          description: How well the model writes each language it has a level for (§13–14, §31), best first.
          items:
            type: object
            description: 'How well a model writes a language (multilingual spec §13–14, §31). Levels are coarse on purpose: they don''t imply precision the sources don''t have. A language a model has no level for is unknown, and is left out.'
            required: [confidence, language, level, sources]
            properties:
              language: {type: string, description: 'A BCP 47 tag, such as "de" or "zh-Hans".'}
              level: {type: string, description: '"limited", "fair", "good", or "excellent".'}
              confidence: {type: string, description: '`confidence` in the level: "low", "medium", or "high".'}
              sources:
                type: array
                description: '`sources` the level comes from: "model_card", "maintainer", "benchmark", "provider", "community", or "local_evaluation".'
                items: {type: string}
    AIProfile:
      type: object
      additionalProperties: true
