      required: [code, created_at, expires_at, id, local_node_id, remote_name, remote_node_id, state]
      properties:
        id: {type: string}
        local_node_id: {type: string}
        remote_node_id: {type: string}
        remote_name: {type: string}
        remote_address: {type: string}
        code: {type: string}
        state: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        incoming: {type: boolean}
    Portal:
      type: object
      description: One chat portal.
      required: [access, branding, concurrency, created_at, embed_origins, enabled, has_passcode, hourly_limit, id, language, max_message, memory, name, profile_id, retention_days, slug, tools, updated_at]
      properties:
        id: {type: string}
        slug: {type: string}
        name: {type: string}
        profile_id: {type: string, description: '`profile_id` answers its chats; empty is the default profile.'}
        tools: {type: string, description: 'None, read_only, or profile (the profile''s own).'}
        memory: {type: boolean, description: '`memory` lets a visitor''s chats keep and use memories of their own.'}
        language: {type: string, description: '`language` answers in this language; empty follows the visitor.'}
        access: {type: string, description: Open or passcode.}
        has_passcode: {type: boolean}
        hourly_limit: {type: integer, description: How many messages each visitor may send an hour; 0 is no limit.}
        max_message: {type: integer, description: 'The longest message, in characters.'}
        concurrency: {type: integer, description: How many of the portal's chats may run at once.}
        retention_days: {type: integer, description: How long visitors' conversations are kept; 0 keeps them.}
        embed_origins:
          type: array
          description: The websites that may show the portal in a frame, such as https://shop.example.com.
          items: {type: string}
        branding: {description: 'How the page looks, as the page reads it.'}
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PortalConversation:
      type: object
      description: One of a portal's visitors' conversations.
      required: [created_at, id, messages, title, updated_at, visitor]
      properties:
        id: {type: string}
        title: {type: string}
        visitor: {type: string}
        messages: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PortalMessage:
      type: object
      description: One message of a visitor's conversation.
      required: [content, created_at, role]
      properties:
        role: {type: string}
        content: {type: string}
        created_at: {type: string, format: date-time}
    PortalPage:
      type: object
      description: What a portal's page shows before anyone enters.
      required: [access, branding, entered, language, max_message, name, slug]
      properties:
        slug: {type: string}
        name: {type: string}
        access: {type: string}
        language: {type: string}
        branding: {}
        max_message: {type: integer, description: The longest message the portal takes.}
        entered: {type: boolean, description: True when this browser is already the portal's guest.}
    PortalUsage:
      type: object
      description: How much a portal was used.
      required: [conversations_30, conversations_7, messages_30, messages_7, visitors_30, visitors_7]
      properties:
        visitors_7: {type: integer, description: 'Visitors who wrote, conversations they started, and messages they sent, over the last 7 and 30 days.'}
        conversations_7: {type: integer}
        messages_7: {type: integer}
        visitors_30: {type: integer}
        conversations_30: {type: integer}
        messages_30: {type: integer}
    RuntimeHistory:
      type: object
      description: What the Diagnostics page shows.
      required: [interval_seconds, now, samples, started_at]
      properties:
        started_at: {type: string, format: date-time}
