        release: {type: string}
        active: {type: string, description: "The model images are made with"}
        accelerated: {type: boolean, description: "Pictures and clips are made on the GPU: the installed build, or the one setup would install"}
        build: {type: string, enum: [metal, vulkan, cpu], description: "The installed stable-diffusion.cpp build"}
        gpu_build: {type: string, enum: [metal, vulkan], description: "The GPU build this computer can use; absent when it has none"}
        models:
          type: array
          items:
