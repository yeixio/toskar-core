      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/models/{id}/projector:
    put:
      summary: Give an added model its vision projector
      description: A GGUF vision projector (mmproj) on this computer, copied beside the model so it can see pictures (#467).
      operationId: setModelProjector
