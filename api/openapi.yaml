openapi: 3.0.3
info:
  title: Toskar Control Plane API
  version: "1.56"
  description: >-
    Local AI control plane API for Toskar, its OpenAI-compatible routes, and its MCP server.
    On the default loopback bind no key is needed. When the daemon listens on any other address,
    every /api/v1, /v1, and /mcp route needs Authorization: Bearer YOUR_API_KEY; /about and /source do not.
    Errors are {"error": {"code", "message", "details"}}. docs/api.md describes the behavior of each route.
servers:
  - url: http://127.0.0.1:7331
security:
  - {}
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/version:
    get:
      summary: Application version
      operationId: getVersion
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
  /api/v1/session:
    post:
      summary: Sign in with a username and password (#206)
      description: Sets the session cookie. Five failures for a username in 15 minutes, or twenty from an address in ten, answer 429 SIGN_IN_THROTTLED for a while.
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Signed in; the body is the request's person, as GET /api/v1/me
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401":
          description: SIGN_IN_FAILED, the same whichever of username or password was wrong
        "429":
          description: SIGN_IN_THROTTLED
    delete:
      summary: Sign out this browser
      operationId: signOut
      responses:
        "204":
          description: Signed out
  /api/v1/invites/{token}:
    get:
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      summary: What a one-time sign-in link is for (#206)
      operationId: peekInvite
      responses:
        "200":
          description: Whose link it is, and whether it sets up a sign-in (invite) or a new password (reset)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "410":
          description: INVITE_INVALID, used or expired
    post:
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      summary: Use a one-time link to set a username and password, or a new password, and sign in
      operationId: acceptInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: For an invite; a reset keeps the username
                password:
                  type: string
                  minLength: 10
      responses:
        "200":
          description: Set and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "400":
          description: USERNAME_INVALID or PASSWORD_TOO_SHORT; the link is still good
        "409":
          description: USERNAME_TAKEN; the link is still good
        "410":
          description: INVITE_INVALID
  /api/v1/people:
    get:
      summary: Everyone who uses this Toskar (Admins and the Owner)
      operationId: listPeople
      parameters:
        - name: role
          in: query
          description: Only people with this role (#592).
          schema:
            type: string
            enum: [owner, admin, member, visitor]
        - name: disabled
          in: query
          description: true for only disabled people, false for only active ones.
          schema:
            type: boolean
      responses:
        "200":
          description: People, the Owner first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
    post:
      summary: Add a person and make their invite link (Admins add Members and Visitors; the Owner adds Admins too)
      operationId: addPerson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                role:
                  type: string
                  enum: [admin, member, visitor]
                email:
                  type: string
                  description: Where to reach them (#592).
                username:
                  type: string
                  description: With password, the username they sign in with.
                password:
                  type: string
                  description: Lets them sign in at once, with no invite link (#592).
                must_change:
                  type: boolean
                  description: With password, they must change it at their next sign-in.
      responses:
        "201":
          description: The person, and, without a password, link with path (/invite/<token>), kind, and expires_at
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddedPerson"
        "403":
          description: ROLE_REQUIRED
  /api/v1/people/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      summary: One person (#592)
      operationId: getPerson
      responses:
        "200":
          description: The person, with email and must_change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          description: PERSON_NOT_FOUND
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: transfer_to
          in: query
          description: A person to give their chats, memories, automations, files, and notifications to, instead of deleting them.
          schema:
            type: string
      summary: Remove a person (#592)
      description: Revokes their keys and devices, signs them out, and deletes their data or gives it to transfer_to. Nobody removes themselves or the Owner, and only the Owner removes Admins. The body's confirm must be their name.
      operationId: removePerson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm:
                  type: string
      responses:
        "204":
          description: Removed
        "400":
          description: CONFIRM_NAME or TRANSFER_INVALID
        "403":
          description: ROLE_REQUIRED or OWNER_FIXED
    patch:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      summary: Rename, change the role of, disable, or enable a person
      description: The Owner's role is fixed and they can't be disabled; nobody changes their own role or disables themselves. Disabling signs the person out everywhere and stops their keys.
      operationId: changePerson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                role:
                  type: string
                  enum: [admin, member, visitor]
                disabled:
                  type: boolean
                email:
                  type: string
                  description: Their email address; empty removes it (#592).
                password:
                  type: string
                  description: A password an Admin sets; they're signed out everywhere (#592).
                username:
                  type: string
                  description: With password, when they have no sign-in yet.
                must_change:
                  type: boolean
                  description: With password, they must change it at their next sign-in.
      responses:
        "200":
          description: The person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "403":
          description: ROLE_REQUIRED or OWNER_FIXED
  /api/v1/people/activity:
    get:
      summary: Who changed whom (#592)
      description: Newest first. Adding, changing, disabling, removing, setting passwords, making links, and revoking keys and devices; never a password.
      operationId: peopleActivity
      parameters:
        - name: person
          in: query
          description: Only entries by or about this person.
          schema:
            type: string
        - name: limit
          in: query
          description: At most this many, 100 by default and 500 at most.
          schema:
            type: integer
      responses:
        "200":
          description: Entries with at, actor_id, actor_name, target_id, target_name, action, and detail
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEntry"
  /api/v1/people/{id}/keys:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      summary: A person's API keys, other than their devices (#592)
      operationId: personKeys
      responses:
        "200":
          description: Their keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIKey"
  /api/v1/people/{id}/keys/{key}:
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
      summary: Revoke one of a person's keys (#592)
      operationId: revokePersonKey
      responses:
        "204":
          description: Revoked
        "404":
          description: KEY_NOT_FOUND
  /api/v1/people/{id}/devices:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      summary: A person's connected devices (#592)
      operationId: personDevices
      responses:
        "200":
          description: Their devices' keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIKey"
  /api/v1/people/{id}/devices/{key}:
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
      summary: Disconnect one of a person's devices (#592)
      operationId: revokePersonDevice
      responses:
        "204":
          description: Disconnected
        "404":
          description: KEY_NOT_FOUND
  /api/v1/me/password:
    post:
      summary: Change your own password (#592)
      description: With your current one. A password an Admin set with must_change is changed here before anything else works; until then other routes answer PASSWORD_CHANGE_REQUIRED. You're signed out everywhere else.
      operationId: changeMyPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current:
                  type: string
                new:
                  type: string
      responses:
        "200":
          description: Who you are now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "403":
          description: PASSWORD_WRONG
  /api/v1/roles/capabilities:
    get:
      summary: What each role may use (#589)
      description: Every capability in order, each role's, and the defaults each role ships with. The Owner always has everything.
      operationId: roleCapabilities
      responses:
        "200":
          description: capabilities, roles, and defaults
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleCapabilities"
  /api/v1/roles/{role}/capabilities:
    put:
      summary: Change what a role may use (#589)
      description: Only the Owner changes the Admins'. The Owner's are fixed.
      operationId: setRoleCapabilities
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum: [admin, member, visitor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Capability ids (files, pictures_in, make_pictures, make_video, voice, web, knowledge, knowledge_add, automations, changing_tools, choose_model, remote_access) to true (allowed) or false.
              additionalProperties:
                type: boolean
      responses:
        "200":
          description: The role's capabilities now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "400":
          description: OWNER_FIXED or CAPABILITY_UNKNOWN
  /api/v1/people/{id}/capabilities:
    get:
      summary: What one person may use (#589)
      operationId: personCapabilities
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: set (their own Allows and Blocks) and effective (what they may use now)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonCapabilities"
    put:
      summary: Allow or Block something for one person (#589)
      description: true allows, false blocks, and null is as their role's. The Owner's are fixed.
      operationId: setPersonCapabilities
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: boolean
                nullable: true
      responses:
        "200":
          description: set and effective
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonCapabilities"
  /api/v1/people/{id}/link:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      summary: A new one-time link for a person; a reset link once they have a sign-in
      operationId: personLink
      responses:
        "201":
          description: path (/invite/<token>), kind (invite or reset), and expires_at (a week for an invite, a day for a reset)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteLink"
  /api/v1/people/{id}/profiles:
    put:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      summary: Pin a Member or Visitor to profiles (#345)
      description: "profiles: a list replaces their role's pin, [] is any profile, and null is their role's again. The Owner and Admins can't be pinned."
      operationId: setPersonProfiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profiles:
                  type: array
                  nullable: true
                  items:
                    type: string
      responses:
        "200":
          description: The person, with profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          description: PIN_INVALID
  /api/v1/profiles/{id}/try-topics:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      summary: Try one message against a profile's topic controls (#345)
      description: "message (up to 2000 characters), and optional topics: draft topic controls used in place of the saved ones. Nothing is saved. The answer is a quick one, without tools, knowledge, or memories."
      operationId: tryTopics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                topics:
                  type: object
      responses:
        "200":
          description: "label (on_topic, small_talk, off_topic, or empty), held, replaced, and reply"
        "400":
          description: TRIAL_FAILED
        "404":
          description: PROFILE_NOT_FOUND
  /api/v1/profiles/{id}/topic-attempts:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: days
          in: query
          schema:
            type: integer
      summary: A profile's off-topic attempts (#345)
      description: What an Enforce profile held, or whose answer it replaced, over the last days (30 by default, up to 365), kept as run records are.
      operationId: getTopicAttempts
      responses:
        "200":
          description: "days, total, by_day ({day, count}), by_where ({kind: portal, key, person, or automation; id; name; count}), and attempts, the latest 100 with their where"
        "404":
          description: PROFILE_NOT_FOUND
  /api/v1/profiles/{id}/topic-attempts/{aid}/on-topic:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: aid
          in: path
          required: true
          schema:
            type: string
      summary: Mark an off-topic attempt as on topic (#345)
      description: Adds its message to the profile's example questions and forgets the attempts with that message.
      operationId: markOnTopic
      responses:
        "204":
          description: Added
        "404":
          description: ATTEMPT_NOT_FOUND
        "409":
          description: EXAMPLES_FULL
  /api/v1/profile-pins:
    get:
      summary: The profiles each pinnable role is kept to (#345)
      operationId: getProfilePins
      responses:
        "200":
          description: "roles: member and visitor, each a list of profile ids; empty is any profile"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePins"
  /api/v1/profile-pins/{role}:
    put:
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum: [member, visitor]
      summary: Pin a role to profiles (#345)
      operationId: setRoleProfiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profiles:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: The pins of every role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePins"
        "400":
          description: PIN_INVALID
  /api/v1/me:
    get:
      summary: Who the request is from (#206)
      description: The person, their role, and how Toskar knows. A request from this computer is the Owner's; one with an API key is its person's.
      operationId: getMe
      responses:
        "200":
          description: The request's person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
  /api/v1/portals:
    get:
      summary: Chat portals (#205)
      description: Every portal, for Admins and the Owner.
      operationId: listPortals
      responses:
        "200":
          description: The portals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Portal"
    post:
      summary: Add a chat portal (#205)
      description: slug (2 to 40 lowercase letters, digits, or dashes) and name are required. It starts with no tools, no memory, passcode access (passcode required), and on.
      operationId: createPortal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: The portal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portal"
        "400":
          description: A setting that can't be used
        "409":
          description: Another portal has that address
  /api/v1/portals/{id}:
    get:
      summary: One chat portal (#205)
      operationId: getPortal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The portal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portal"
        "404":
          description: No such portal
    patch:
      summary: Change a chat portal (#205)
      description: Any of slug, name, profile_id, tools (none, read_only, profile), memory, language, access (open, passcode), passcode (empty removes it), branding (a JSON object), and enabled. Turning it off stops its visitors at once.
      operationId: updatePortal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: The portal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portal"
    delete:
      summary: Remove a chat portal (#205)
      description: Its guests can no longer chat.
      operationId: deletePortal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
  /api/v1/portals/{id}/conversations:
    get:
      summary: A portal's visitors' conversations (#205)
      description: Newest first, for Admins. A Members only portal's chats are each Member's own, so they aren't here.
      operationId: listPortalConversations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: id, title, visitor, messages, created_at, updated_at
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalConversation"
  /api/v1/portals/{id}/conversations/{cid}/messages:
    get:
      summary: One visitor's conversation, to read (#205)
      operationId: listPortalMessages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: cid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: role, content, created_at, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalMessage"
        "404":
          description: Not one of the portal's conversations
  /api/v1/portals/{id}/usage:
    get:
      summary: How much a portal is used (#205)
      description: Visitors who wrote, conversations, and messages they sent, over the last 7 and 30 days.
      operationId: getPortalUsage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUsage"
  /api/v1/portals/{id}/visitors:
    get:
      summary: A portal's invited visitors (#205)
      operationId: listPortalVisitors
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The visitors, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
    post:
      summary: Invite a visitor to a portal by name (#205)
      description: Answers with the visitor and their one-time link (path /p/<slug>?invite=<token>, good for a week).
      operationId: invitePortalVisitor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "201":
          description: The visitor and their link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitedVisitor"
  /api/v1/portals/{id}/visitors/{vid}/link:
    post:
      summary: A new link for an invited visitor (#205)
      description: Replaces any link they haven't used.
      operationId: portalVisitorLink
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: vid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorLink"
  /api/v1/portals/{id}/visitors/{vid}:
    delete:
      summary: Remove an invited visitor (#205)
      description: They're disabled and signed out at once.
      operationId: removePortalVisitor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: vid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
  /api/v1/portals/{slug}/page:
    get:
      summary: What a portal's page shows (#205)
      description: Its name, access, language, and branding, and whether this browser is already its guest. Answers without signing in.
      operationId: getPortalPage
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalPage"
        "404":
          description: No portal there, or it's turned off
  /api/v1/portals/{slug}/enter:
    post:
      summary: Enter a portal as its guest (#205)
      description: With passcode when the portal has one. Makes this browser the portal's guest, signed in by a toskar_portal_<slug> cookie that counts only on requests carrying X-Toskar-Portal. A guest reaches only the portal's chat, with the portal's profile, tools, memory, and language.
      operationId: enterPortal
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The guest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnteredPortal"
        "401":
          description: Wrong passcode
        "404":
          description: No portal there, or it's turned off
  /api/v1/oidc:
    get:
      summary: Whether sign-in with an OpenID Connect provider is offered (#206)
      operationId: getOIDC
      security: []
      responses:
        "200":
          description: Whether it's on, and the provider's name for the button
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCInfo"
  /api/v1/oidc/start:
    get:
      summary: Go to the provider to sign in (#206)
      description: Redirects to the provider with PKCE, and sets a short-lived cookie with the sign-in's state. return is the path in Toskar to go to afterwards.
      operationId: startOIDC
      security: []
      parameters:
        - name: return
          in: query
          schema:
            type: string
      responses:
        "302":
          description: To the provider
        "303":
          description: Back to Toskar with oidc_error, when sign-in can't start
  /api/v1/oidc/callback:
    get:
      summary: Where the provider sends people back (#206)
      description: Checks the state against this browser's cookie, swaps the code for an ID token and checks it, signs the browser in, and redirects to the path it started from. A failure redirects to /?oidc_error= failed, refused, disabled, or unavailable.
      operationId: oidcCallback
      security: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
      responses:
        "303":
          description: Signed in, or back to the sign-in screen with oidc_error
  /api/v1/me/push:
    get:
      summary: Push to the Toskar app on this device (#460)
      description: >-
        What a paired phone or tablet needs to register with the push relay (the relay and this
        computer's key, which the relay seals into the device's handle), and whether this device
        has registered. See docs/push.md.
      operationId: getPushStatus
      responses:
        "200":
          description: The relay, the computer's key, and this device's registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushStatus"
    put:
      summary: Register this device's push handle
      description: >-
        A paired phone or tablet gives the sealed handle the push relay made from its push token.
        Only a paired device's key may; another gets PUSH_DEVICE_ONLY. The computer never sees
        the token. Disconnecting the device ends its pushes.
      operationId: registerPush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle, platform]
              properties:
                handle:
                  type: string
                platform:
                  type: string
                  enum: [ios, android]
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushStatus"
        "400":
          description: PUSH_INVALID
        "403":
          description: PUSH_DEVICE_ONLY
    delete:
      summary: Stop pushes to this device
      operationId: unregisterPush
      responses:
        "204":
          description: No longer registered
  /api/v1/me/devices:
    get:
      summary: Your connected devices (#206)
      description: The phones, tablets, and TVs connected as the request's person, whatever their role.
      operationId: listMyDevices
      responses:
        "200":
          description: The person's device keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyDevice"
    post:
      summary: Connect a companion device, such as a watch with its phone
      description: >-
        A connected device asks for a key of its own for a device that goes along with it
        (yeixio/toskar-apps#213), for the same person, so it shows in Devices and can be
        disconnected on its own. It works from anywhere, as no code is typed. The answer is
        the same as POST /devices/pair's. A person may have 20 connected devices.
      operationId: addCompanionDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_name:
                  type: string
      responses:
        "201":
          description: The companion's key, the certificate's fingerprint, and the route for away from home
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairedDevice"
        "409":
          description: DEVICE_LIMIT, the person has 20 connected devices
  /api/v1/me/devices/{id}:
    delete:
      summary: Disconnect one of your devices (#206)
      operationId: disconnectMyDevice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Disconnected; it needs a new code to connect again
        "404":
          description: No device of yours has that id
  /api/v1/me/device:
    delete:
      summary: Disconnect this device, with its companions (#766)
      description: A device's own key disconnects it, as the apps do when the person removes this computer. Its key and its companions' keys, such as its watch's, are revoked, and their notifications stop.
      operationId: disconnectThisDevice
      responses:
        "204":
          description: Disconnected; it needs a new code to connect again
        "400":
          description: The request didn't come from a connected device's key (NOT_A_DEVICE)
  /api/v1/me/preferences:
    patch:
      summary: Save your own languages (#206)
      description: The request's person's App language and assistant language, whatever their role. The Owner's are the install's, which others start from until they choose. Answers with the person's settings.
      operationId: setMyPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ui_locale:
                  type: string
                assistant_language_mode:
                  type: string
                  enum: [auto, app, language]
                assistant_language:
                  type: string
      responses:
        "200":
          description: The person's settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsView"
        "400":
          description: A setting that isn't the person's own, or an invalid value
  /api/v1/remote-access:
    get:
      summary: Access from anywhere's setting and its listener (#456)
      description: "enabled, port, address (a forwarded address, when set), listening (the address it listens on) or error, port_mapping, mapped and mapped_by (pcp, nat-pmp, or upnp) for the router port it opened, map_error, ipv6, reachable (direct, ipv6, manual, relay, or none) with reason (off, not_listening, carrier_nat, or no_port), relay (name, state: no_token, ended (contract 1.41: the token ran out with nothing to renew it, so it isn't sent; a new one takes over within a minute), connecting, connected, or error, and error, its code) while the relay client runs, and check, the last outside check (#546, contract 1.28): at, relay and direct (each way in with address, ok, reason, and ms), tried, and error when the last attempt didn't reach the relay (CHECK_UNSUPPORTED, CHECK_TOO_SOON, NO_TOKEN, RELAY_UNREACHABLE). With Toskar's relay, subscription (#639, contract 1.38): state (none, pending, active, or ended; contract 1.41: ended also when the token from the app's store or a subscription ran out, with expires the day it did), store (stripe when bought here in Settings, app when bought in the Toskar app), expires, open (whether Toskar's relay takes new subscriptions now, when known), checkout (the open checkout's page while pending), error (the last exchange's code when it didn't reach the relay), and in_app_only (contract 1.39: this copy is the Mac App Store's, which neither sells nor manages it; the Toskar app on a phone or tablet does). Set it with PATCH /api/v1/settings: remote_access_enabled, remote_access_port, remote_access_address, remote_access_port_mapping, remote_access_relay (an organization's relay, empty for Toskar's), and remote_access_relay_secret (its enrollment secret; write-only, empty clears it)."
      operationId: getRemoteAccess
      responses:
        "200":
          description: The setting and what the listener is doing
  /api/v1/remote-access/check:
    post:
      summary: Check access from anywhere from outside, now (#546)
      description: "The relay reaches this computer from the internet, through its tunnel and each direct way in, as a paired device away from home does: TLS to this computer's certificate and GET /api/v1/health. It also runs on its own every 30 minutes and after the relay connects or the ways in change. Answers what GET /api/v1/remote-access does, with check updated. Admins only. 409 REMOTE_ACCESS_OFF when access from anywhere is off or its listener isn't up."
      operationId: checkRemoteAccess
      responses:
        "200":
          description: The setting and the listener, with check
        "409":
          description: REMOTE_ACCESS_OFF
  /api/v1/remote-access/route:
    get:
      summary: The route secret, for a paired device on the home network (#456)
      description: "route_secret (base64url, 32 bytes), route_id, relay (the relay this computer uses away from home), and token, the computer's current token for Toskar's relay when it has one (contract 1.27), so each paired device can look it up away from home. Given only on the home network, never through the remote listener; pairing (POST /api/v1/devices/pair) returns them too."
      operationId: getRouteSecret
      responses:
        "200":
          description: route_secret and route_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRoute"
        "403":
          description: ROUTE_NOT_LOCAL
  /api/v1/remote-access/relay-token:
    put:
      summary: Hand over a subscription's relay token (#456)
      description: "Body {token, enable}. token is the route token the app got for this computer by exchanging a store receipt with Toskar's relay; the computer keeps it and registers and keeps its tunnel there. A paired device may send it, from home or through the remote listener. enable also turns access from anywhere on, and needs an Admin (403 ROLE_REQUIRED). Answers state: the relay client's state, or off. 400 RELAY_TOKEN_INVALID for a token that isn't for this computer's route or has expired, RELAY_TOKEN_NOT_NEEDED when an organization's relay is set."
      operationId: putRelayToken
      responses:
        "200":
          description: The token is kept; state
        "400":
          description: RELAY_TOKEN_INVALID or RELAY_TOKEN_NOT_NEEDED
        "403":
          description: ROLE_REQUIRED, turning access from anywhere on without the admin role
  /api/v1/remote-access/subscription/checkout:
    post:
      summary: Subscribe to access from anywhere here, with Stripe (#639)
      description: "Body {plan}: monthly or yearly. Opens a Stripe checkout at yeix.io, which bills for Toskar, for this computer's route on Toskar's relay, and answers {url}, its page, for the person to open. Toskar then asks the relay every few seconds whether it's paid; once it is, it keeps the relay token, turns access from anywhere on, and renews the token as the subscription does. Admins only. 400 SUBSCRIPTION_PLAN_INVALID; 409 SUBSCRIPTION_IN_APP_ONLY in the Mac App Store's copy, SUBSCRIPTION_OWN_RELAY with an organization's relay, SUBSCRIPTION_ACTIVE when this computer already has a current token; 503 RELAY_SOLD_OUT when Toskar's relay takes no new subscriptions; 502 BILLING_UNAVAILABLE."
      operationId: startSubscriptionCheckout
      responses:
        "200":
          description: The checkout page, url
        "400":
          description: SUBSCRIPTION_PLAN_INVALID
        "409":
          description: SUBSCRIPTION_OWN_RELAY or SUBSCRIPTION_ACTIVE
        "502":
          description: BILLING_UNAVAILABLE
        "503":
          description: RELAY_SOLD_OUT
  /api/v1/remote-access/subscription/manage:
    post:
      summary: The billing page for the subscription bought here (#639)
      description: "Answers {url}, Stripe's billing page for the subscription bought in Settings: change the card, download receipts, cancel. Admins only. 409 SUBSCRIPTION_IN_APP_ONLY in the Mac App Store's copy; 404 SUBSCRIPTION_NONE when none was bought here (one bought in the Toskar app is managed in the device's store); 502 BILLING_UNAVAILABLE."
      operationId: manageSubscription
      responses:
        "200":
          description: The billing page, url
        "404":
          description: SUBSCRIPTION_NONE
        "502":
          description: BILLING_UNAVAILABLE
  /api/v1/tls:
    get:
      summary: How the API speaks HTTPS on the local network (#213)
      operationId: getApiTLS
      responses:
        "200":
          description: The certificate the API serves over HTTPS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TLSInfo"
  /about:
    get:
      summary: AGPL corresponding-source offer
      operationId: getAbout
      responses:
        "200":
          description: Name, version, commit, license, and source URL for this build
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceOffer"
  /source:
    get:
      summary: AGPL corresponding-source offer
      operationId: getSource
      responses:
        "200":
          description: Same body as /about
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceOffer"
  /hooks/{token}:
    post:
      summary: Start the automation a webhook link belongs to
      description: The token in the link is the only proof, so this needs no API key. The request body (up to 64 KB, any type) goes to the run as data from the caller, never as instructions. One automation's link takes a call at most every 10 seconds.
      operationId: runHook
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          "*/*":
            schema:
              type: string
      responses:
        "202":
          description: The run started; its progress arrives as automation events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HookRun"
        "404":
          description: No automation has this link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: AUTOMATION_PAUSED, or AUTOMATION_RUNNING while a run is going
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: HOOK_TOO_LARGE, a body over 64 KB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: HOOK_TOO_SOON, called again within 10 seconds; Retry-After says when to try
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/hardware:
    get:
      summary: Local hardware inventory
      operationId: getHardware
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardwareInventory"
  /api/v1/models:
    get:
      summary: List catalog and installed models
      operationId: listModels
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Model"
  /api/v1/profiles:
    get:
      summary: List AI profiles
      operationId: listProfiles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AIProfile"
    post:
      summary: Create a profile
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIProfile"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProfile"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/nodes:
    get:
      summary: List local and discovered computers
      operationId: listNodes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Node"
  /api/v1/settings:
    get:
      summary: Get settings
      operationId: getSettings
      responses:
        "200":
          description: "OK. For Admins and the Owner, network_access (#711, contract 1.42) counts who could use Toskar from another computer: people (who sign in with a username and password, or still have a link to choose them), devices (connected with a code), keys (API keys for apps and scripts), and sign_in_service (a trusted proxy or OpenID Connect provider). lan_api_enabled can be turned on when any of them is there."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsView"
    patch:
      summary: Update settings
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsView"
    put:
      summary: Update settings (same as PATCH)
      operationId: putSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsView"
  /api/v1/settings/reset:
    post:
      summary: Reset application to defaults
      description: >
        Clears chats, custom profiles, tasks, and API keys; restores settings and
        built-in profiles. Downloaded models and runtimes are kept unless delete_models
        is true. The client should clear local UI state and restart onboarding. Not reversible.
      operationId: resetApp
      parameters:
        - name: delete_models
          in: query
          schema:
            type: string
            enum: ["true", "false"]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                delete_models:
                  type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsView"
  /api/v1/diagnostics/gpu:
    get:
      summary: What this computer still needs for Toskar to use its GPU
      description: >-
        The graphics card found and each missing piece, most basic first, with a fix written for this
        computer: the Vulkan loader or drivers, permission to open the card's render device, NVIDIA's
        driver, a Windows card's driver, or the CPU-only llama.cpp build. No problems when the GPU is
        ready, when there is no GPU, and on macOS.
      operationId: getGPUSetup
      responses:
        "200":
          description: GPU setup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GPUSetup"
  /api/v1/performance/live:
    get:
      summary: Live CPU, memory, and GPU figures for this and paired computers
      description: >-
        Each computer's figures now, every few seconds over the last hour (every minute when no model
        is loaded), and per-minute averages over the last day. A figure a computer can't give, such as
        GPU temperature on a Mac, is left out rather than reported as 0. A paired computer that doesn't
        answer within 5 seconds is left out.
      operationId: listLiveFigures
      responses:
        "200":
          description: One entry per computer, this one first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LiveFigures"
  /api/v1/performance:
    get:
      summary: List generation performance samples
      operationId: listPerformance
      parameters:
        - name: sort
          in: query
          schema:
            type: string
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GenerationRun"
  /api/v1/benchmarks/workloads:
    get:
      summary: List benchmark workload categories
      operationId: listBenchmarkWorkloads
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BenchmarkWorkload"
  /api/v1/benchmarks:
    get:
      summary: List recent benchmark jobs
      operationId: listBenchmarks
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BenchmarkJob"
    post:
      summary: Start a multi-model benchmark
      operationId: startBenchmark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenchmarkRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkJob"
  /api/v1/benchmarks/{id}:
    get:
      summary: Get benchmark job status and results
      operationId: getBenchmark
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkJob"
  /api/v1/benchmarks/{id}/cancel:
    post:
      summary: Cancel a running benchmark
      operationId: cancelBenchmark
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
  /api/v1/conversations:
    get:
      summary: List conversations
      operationId: listConversations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      summary: Create conversation
      operationId: createConversation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                profile_id:
                  type: string
                model_id:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /api/v1/conversations/delete:
    post:
      summary: Delete several conversations
      description: Deletes the caller's chats among ids, with their messages and files, in one request (#452, contract 1.25). Another person's chat, or one that doesn't exist, is skipped as not_found.
      operationId: deleteConversations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: string
      responses:
        "200":
          description: What was deleted, and what was skipped and why
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationsDeleted"
        "400":
          description: INVALID_JSON, or INVALID_CONVERSATION_IDS for no ids or more than 1,000
  /api/v1/conversations/{id}:
    patch:
      summary: Update conversation
      operationId: updateConversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                profile_id:
                  type: string
                model_id:
                  type: string
                memory_off:
                  type: boolean
                  description: Turn memory off for this chat
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
    delete:
      summary: Delete conversation
      operationId: deleteConversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /api/v1/events:
    get:
      summary: Heimdall event stream (SSE)
      operationId: eventStream
      responses:
        "200":
          description: >-
            Server-sent events, one per event: its name is the event's type, such as
            model.unloaded, and its data the Event. A ": ping" comment keeps the
            connection open. x-events describes them, since OpenAPI 3.0 can't.
          content:
            text/event-stream:
              schema:
                type: string
              x-events:
                "*": {$ref: "#/components/schemas/Event"}
  /api/v1/logs:
    get:
      summary: List diagnostic log files
      operationId: listLogs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogFile"
  /api/v1/logs/{name}:
    get:
      summary: Read a log file tail
      operationId: getLog
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: tail_bytes
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogContent"
  /api/v1/notifications:
    get:
      summary: List notifications that were not dismissed, newest first
      operationId: listNotifications
      parameters:
        - name: unread
          in: query
          description: "1 lists unread notifications only"
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: category
          in: query
          description: automation, approval, model, training, health, or system
          schema:
            type: string
      responses:
        "200":
          description: Notifications and the unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
  /api/v1/notifications/read:
    post:
      summary: Mark notifications read; no ids marks all of them
      operationId: markNotificationsRead
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        "204":
          description: Marked read
  /api/v1/notifications/{id}/dismiss:
    post:
      summary: Hide a notification from the notification center
      operationId: dismissNotification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Dismissed
        "404":
          description: No such notification
  /api/v1/connectors:
    get:
      summary: List connected services and their status. Secret values are never returned.
      operationId: listConnectors
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectorStatus"
  /api/v1/connectors/{id}:
    put:
      summary: Check values with the service, then store them and add its tools
      operationId: connectService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                values:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Connected
        "400":
          description: The service did not accept the values
        "404":
          description: Unknown service
    delete:
      summary: Delete the stored credential and remove the service's tools
      operationId: disconnectService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Disconnected
  /api/v1/connectors/{id}/check:
    post:
      summary: Check the stored credential again
      operationId: checkConnector
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Status
  /api/v1/devices:
    get:
      summary: The connected services' devices, by kind (#586)
      operationId: listDevices
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [camera, sensor, speaker, light, switch, lock, cover, climate, other]
      responses:
        "200":
          description: "{devices: [{connector, device, name, kind, state}]}"
        "502":
          description: The service couldn't be read (DEVICES_FAILED)
  /api/v1/mcp/servers:
    get:
      summary: List MCP tool sources with status, tools, and masked values. Secret values are never returned.
      operationId: listMCPServers
      responses:
        "200":
          description: Tool sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MCPServer"
    post:
      summary: Check a tool source connects and list its tools, then store it and add the tools
      description: >-
        Send a gallery entry ({"preset", "values"}), a spec ({"spec", "values"}), or a server from
        another app ({"import": {"app", "name"}}). redirect_base is the address the browser uses, for a
        sign-in. When the service needs a sign-in, the source is stored and sign_in_url is returned.
      operationId: addMCPServer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                preset:
                  type: string
                spec:
                  type: object
                  additionalProperties: true
                import:
                  type: object
                  properties:
                    app:
                      type: string
                    name:
                      type: string
                values:
                  type: object
                  additionalProperties:
                    type: string
                redirect_base:
                  type: string
      responses:
        "201":
          description: Added; server, and sign_in_url when a sign-in is needed
        "400":
          description: It could not connect, or a value is missing
        "404":
          description: Unknown gallery entry
  /api/v1/mcp/servers/{id}:
    get:
      summary: One tool source
      operationId: getMCPServer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tool source
        "404":
          description: Unknown tool source
    patch:
      summary: Change enabled, allow_sampling, always_offer, keywords, or per-tool policies (allow, ask, default)
      operationId: updateMCPServer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Tool source
    put:
      summary: Change how a tool source is reached, then check it. Blank secret values keep the stored ones.
      operationId: replaceMCPServer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                spec:
                  type: object
                  additionalProperties: true
                values:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Tool source
    delete:
      summary: Stop a tool source, remove its tools, and delete its stored secrets
      operationId: removeMCPServer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
  /api/v1/mcp/servers/{id}/check:
    post:
      summary: Connect again and list the tools
      operationId: checkMCPServer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tool source
  /api/v1/mcp/servers/{id}/sign-in:
    post:
      summary: Start signing in to the tool source's service; returns the address to open
      operationId: signInMCPServer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect_base:
                  type: string
      responses:
        "200":
          description: "{\"url\": \"...\"}"
  /api/v1/mcp/servers/{id}/sign-out:
    post:
      summary: Forget the tool source's sign-in
      operationId: signOutMCPServer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tool source
  /api/v1/mcp/servers/{id}/logs:
    get:
      summary: Recent log lines of a tool source
      operationId: mcpServerLogs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Log lines
  /api/v1/mcp/servers/{id}/prompts:
    get:
      summary: The tool source's ready-made prompts
      operationId: mcpServerPrompts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prompts
  /api/v1/mcp/servers/{id}/prompts/{name}:
    post:
      summary: Fill a prompt; returns its text
      operationId: getMCPPrompt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                arguments:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: "{\"text\": \"...\"}"
  /api/v1/mcp/servers/{id}/resources:
    get:
      summary: The tool source's resources
      operationId: mcpServerResources
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resources
  /api/v1/mcp/gallery:
    get:
      summary: Gallery entries, with programs that are missing and sources already added
      operationId: mcpGallery
      responses:
        "200":
          description: Gallery
  /api/v1/mcp/import:
    get:
      summary: MCP servers set up in other apps on this computer, with secret values hidden
      operationId: mcpImportCandidates
      responses:
        "200":
          description: Servers
  /api/v1/mcp/parse:
    post:
      summary: Read pasted settings, a web address, or a command line into server specs and what each still needs
      operationId: parseMCP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
      responses:
        "200":
          description: Parsed servers
        "400":
          description: Nothing could be read
  /api/v1/mcp/share:
    get:
      summary: The address and command other apps use to reach Toskar's MCP server
      operationId: mcpShare
      responses:
        "200":
          description: Address, command, args, and whether a key is needed
  /mcp:
    post:
      summary: Toskar's MCP server (Streamable HTTP, JSON-RPC). Tools ask_local_ai, list_local_models, search_my_knowledge.
      description: >-
        Checked like /v1. A request with an Origin header from another site is refused.
      operationId: mcpServer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: JSON-RPC response
        "202":
          description: Notification accepted
        "401":
          description: An API key is required
        "403":
          description: Origin not allowed
    get:
      summary: Not supported; the server does not open a stream
      operationId: mcpServerGet
      responses:
        "405":
          description: This endpoint takes POST
    delete:
      summary: End an MCP session
      operationId: mcpServerDelete
      responses:
        "200":
          description: Ended
  /mcp/oauth/callback:
    get:
      summary: Where a tool source's sign-in returns; shows a page that says how it went
      operationId: mcpOAuthCallback
      responses:
        "200":
          description: HTML page
  /api/v1/personalization:
    get:
      summary: How the person likes answers
      operationId: getPersonalization
      responses:
        "200":
          description: Style
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalStyle"
    put:
      summary: Save how the person likes answers. Style only; it cannot grant a permission.
      operationId: setPersonalization
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalStyle"
      responses:
        "200":
          description: Saved
        "400":
          description: Invalid, or tries to grant a permission
  /api/v1/api-keys/{id}/permissions:
    put:
      summary: Change what an API key may ask of the assistant
      operationId: setAPIKeyPermissions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                memory:
                  type: string
                  enum: [never, on_request, always]
                knowledge:
                  type: string
                  enum: [never, on_request, always]
                tools:
                  type: string
                  enum: [profile, read_only, none]
                placement:
                  type: boolean
      responses:
        "200":
          description: The key, with its permissions
        "400":
          description: Invalid permissions or unknown key
  /api/v1/devices/pairing:
    post:
      summary: Show a 6-digit code a phone connects with, replacing any other
      operationId: startDevicePairing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enable_lan:
                  type: boolean
                  description: Turn on local network access first, which a phone needs
      responses:
        "201":
          description: The code, when it expires, this computer's address, and whether a phone can reach it yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePairing"
    get:
      summary: Whether a phone has connected with the code shown
      operationId: getDevicePairing
      responses:
        "200":
          description: The state (waiting, connected, expired, or cancelled) and the phone's key record, without the code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePairing"
    delete:
      summary: Stop showing the code
      operationId: cancelDevicePairing
      responses:
        "204":
          description: Stopped
  /api/v1/devices/pair:
    post:
      summary: A phone exchanges the code for its own key (no key needed; local network only)
      operationId: pairDevice
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  example: "123456"
                device_name:
                  type: string
                  example: Sam's iPhone
      responses:
        "201":
          description: The phone's key (api_key, shown once) and its record, with kind device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairedDevice"
        "401":
          description: PAIRING_WRONG_CODE
        "403":
          description: PAIRING_NOT_LOCAL
        "410":
          description: PAIRING_NOT_STARTED or PAIRING_EXPIRED
        "429":
          description: PAIRING_THROTTLED
  /api/v1/egress:
    get:
      summary: What left this computer, newest first
      operationId: listEgress
      parameters:
        - name: conversation_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EgressRecord"
  /api/v1/license:
    get:
      summary: Toskar Pro's trial or Unlock, as its desktop app last said
      operationId: getLicense
      description: Core on its own has no license (`kind` empty) and nothing is limited. The Toskar Pro desktop app from the Mac App Store or the Microsoft Store sets a 14-day trial, unlocked, or ended (yeixio/toskar-apps#336). While `limited`, installing models, creating automations, and adding people answer 403 `UNLOCK_REQUIRED`; what's set up keeps working.
      responses:
        "200":
          description: The license now; a trial past its end reads `ended`
          content:
            application/json:
              schema: {$ref: "#/components/schemas/License"}
    put:
      summary: Set Toskar Pro's trial or Unlock (the desktop app only)
      operationId: putLicense
      description: Only the Toskar Pro desktop app on this computer, with the `X-Toskar-Shell` secret it started Core with (`TOSKAR_SHELL_SECRET`). Anything else gets 403 `SHELL_ONLY`.
      parameters:
        - {name: X-Toskar-Shell, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: {type: string, enum: ["", available, trial, unlocked, ended]}
                trial_ends: {type: string, format: date-time, description: Required with trial.}
                store: {type: string, enum: [mac, windows]}
      responses:
        "200":
          description: The license kept
          content:
            application/json:
              schema: {$ref: "#/components/schemas/License"}
        "400": {description: Not a license (INVALID_JSON or BAD_REQUEST)}
        "403": {description: Not the desktop app on this computer (SHELL_ONLY)}
  /api/v1/updates:
    get:
      summary: Whether a newer Toskar is out, from the daily check of toskar.ai
      operationId: getUpdates
      description: Release builds installed from a download check https://toskar.ai/releases/latest.json once a day, while the `update_check` setting is on. The App Store edition, the copy the desktop app runs (`TOSKAR_UPDATE_CHECK=off`), and development builds don't check, and say `supported` false.
      responses:
        "200":
          description: The last check's result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"
  /api/v1/news:
    get:
      summary: The AI news from toskar.ai
      operationId: getNews
      description: New open models, runtime releases, and AI labs' announcements, a few lines each, from https://toskar.ai/news.json (#750). Read when asked, at most every six hours, and kept in the data folder so it shows offline; each read is listed in What left this computer as `news`. With the `ai_news` setting off, nothing is read and `enabled` is false. Members and Admins.
      responses:
        "200":
          description: The news
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/News"
        "502":
          description: NEWS_UNAVAILABLE, toskar.ai couldn't be reached and no copy is kept
  /api/v1/privacy:
    get:
      summary: Run record retention and a 30-day summary of what left this computer
      operationId: getPrivacy
      responses:
        "200":
          description: Overview
    put:
      summary: Set how long run records are kept; 0 keeps them
      operationId: setRunRetention
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                retention_days: {type: integer, minimum: 0, maximum: 3650}
      responses:
        "200":
          description: Overview
        "400":
          description: Invalid retention
  /api/v1/privacy/delete-runs:
    post:
      summary: Delete run records now
      operationId: deleteRunRecords
      responses:
        "200":
          description: How many records were removed
  /api/v1/runs:
    get:
      summary: Recent run traces, newest first
      operationId: listRuns
      parameters:
        - name: conversation_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Runs
  /api/v1/runs/{id}:
    get:
      summary: One run trace
      operationId: getRun
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The run
        "404":
          description: Not recorded, or removed by retention
  /api/v1/diagnostics:
    get:
      summary: Create a diagnostics bundle (a zip without secrets or private keys)
      operationId: exportDiagnostics
      parameters:
        - name: include_conversations
          in: query
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: Where the bundle was written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticsBundle"
        "500":
          description: The bundle could not be created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a diagnostics bundle
      operationId: createDiagnostics
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                include_conversations:
                  type: boolean
      responses:
        "200":
          description: Where the bundle was written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticsBundle"
        "500":
          description: The bundle could not be created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/diagnostics/runtime:
    get:
      summary: The daemon's memory and goroutines now and over the last day
      description: Sampled every five minutes and kept for a day, so a slow leak shows on the Diagnostics page. Resets when the daemon restarts.
      operationId: getRuntimeHistory
      responses:
        "200":
          description: Current and sampled counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeHistory"
  /api/v1/diagnostics/report:
    get:
      summary: What a problem report sends, scrubbed
      description: >-
        Versions and the kind of computer, and for an Admin Core's last 40 warnings and errors.
        Email addresses, keys, tokens, home folder names, the computer's name, and internet
        addresses are taken out first. Members and paired devices may call it.
      operationId: getReport
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticsReport"
    post:
      summary: Send a problem report to Toskar (#588)
      description: >-
        Body {product (core, the default, or apps), app, where, code, error, note, email, details}.
        Core scrubs the error and note as it scrubs its own report, adds that report when details
        is true, and sends it to Toskar's report service (https://toskar.ai/api/report, or
        TOSKAR_REPORT_URL), which files it as an issue in a private repository, grouped with
        others for the same error and version. A reply address goes to the Toskar team by email,
        never into the issue. Answers {status: created or added, number}. Each one is listed in
        What left this computer as problem_report. Members and paired devices may send. 400
        REPORT_INVALID; 403 REPORTS_OFF when an Admin turned problem_reports off; 429
        REPORT_RATE_LIMITED; 502 REPORTS_UNAVAILABLE when the service can't be reached or isn't
        set up, for the client to send by email instead (contract 1.40).
      operationId: sendReport
      responses:
        "200":
          description: Sent; status and the issue's number
        "400":
          description: REPORT_INVALID or INVALID_JSON
        "403":
          description: REPORTS_OFF
        "429":
          description: REPORT_RATE_LIMITED
        "502":
          description: REPORTS_UNAVAILABLE
  /api/v1/diagnostics/first-answers:
    get:
      summary: How long answers took to start, by app, cold or warm
      description: >-
        Chat runs that reached a first token, grouped by the app that asked (the chat request's client)
        and by whether a model had to load first. Automations are left out.
      operationId: getFirstAnswers
      parameters:
        - name: days
          in: query
          description: How many days back to look; 7 by default, 90 at most.
          schema:
            type: integer
      responses:
        "200":
          description: First-answer times
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirstAnswers"
  /v1/models:
    get:
      summary: OpenAI-compatible model list
      description: auto, each profile as profile:<id>, and each deployed specialized AI as sai:<slug>.
      operationId: openaiListModels
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIModelList"
  /v1/chat/completions:
    post:
      summary: OpenAI-compatible chat completions
      description: >-
        temperature and max_tokens apply to the calls that write the answer (#70). The toskar object asks for
        memory, knowledge, tools, effort, and placement, within what the API key allows.
        yggdrasil, its name from before the rename, works too; toskar wins when both are
        sent. Responses carry the answer's extension fields under both names.
      operationId: openaiChatCompletions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model:
                  type: string
                  description: auto, profile:<id>, sai:<slug>, or a model id
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                      content:
                        type: string
                stream:
                  type: boolean
                temperature:
                  type: number
                  minimum: 0
                  maximum: 2
                  description: For the answer; 0 gives the same most likely answer every time. Left out, the model's default.
                max_tokens:
                  type: integer
                  minimum: 1
                  description: The most tokens each answer-writing call may use. Left out, the model's default.
                max_completion_tokens:
                  type: integer
                  minimum: 1
                  description: OpenAI's newer name for max_tokens; wins when both are sent.
                reasoning_effort:
                  type: string
                  enum: [low, medium, high]
                include_reasoning:
                  type: boolean
                  description: "A reasoning model's thinking as reasoning_content, on the message or as stream deltas before the answer (#701, contract 1.43). Off by default."
                response_format:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [text, json_object, json_schema]
                    json_schema:
                      type: object
                      properties:
                        name:
                          type: string
                        schema:
                          type: object
                          additionalProperties: true
                toskar:
                  $ref: "#/components/schemas/AssistantOptions"
                yggdrasil:
                  $ref: "#/components/schemas/AssistantOptions"
      responses:
        "200":
          description: The completion, or with stream, OpenAI's server-sent events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIChatCompletion"
            text/event-stream:
              schema:
                type: string
              x-events:
                message: {type: string, description: "A chat.completion.chunk as JSON, and last [DONE], as OpenAI streams them"}
        "400":
          description: Invalid JSON, no user message, or an invalid response_format
        "401":
          description: An API key is required
        "403":
          description: The API key does not allow what was asked
        "422":
          description: The answer did not fit response_format after repair and one retry
        "500":
          description: The chat failed; the message says why
  /api/v1/capabilities:
