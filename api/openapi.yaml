        id: {type: string}
        name: {type: string}
        supported: {type: boolean}
        reason: {type: string}
        installed: {type: boolean, description: '`installed` says its Python environment is set up.'}
    TrainingExamples:
      type: object
      description: A specialized AI's examples, and what they add up to.
      required: [examples, stats]
      properties:
        examples:
          type: array
          items:
            type: object
            description: One training example.
            required: [ai_id, created_at, excluded, id, messages]
            properties:
              id: {type: string}
              ai_id: {type: string}
              material_id: {type: string}
              messages:
                type: array
                items:
                  type: object
                  description: One chat turn in a training example.
                  required: [content, role]
                  properties:
                    role: {type: string}
                    content: {type: string}
              flags:
                type: array
                items: {type: string}
              excluded: {type: boolean, description: The user's choice to leave the example out.}
              created_at: {type: string, format: date-time}
        stats:
          type: object
          description: Summarizes the examples that will train.
          required: [excluded, flagged, p95_tokens, tokens, total, usable]
          properties:
            total: {type: integer}
            usable: {type: integer}
            excluded: {type: integer}
            flagged:
              type: object
              additionalProperties: {type: integer}
            tokens: {type: integer}
            p95_tokens: {type: integer, description: '`p95_tokens` sizes the maximum sequence length.'}
            warnings:
              type: array
              description: Human sentences about the dataset as a whole.
              items: {type: string}
    DiagnosticsBundle:
      type: object
      description: Where a diagnostics bundle was saved on this computer.
      required: [message, path]
      properties:
        path: {type: string}
        message: {type: string}
    Transcription:
      type: object
      description: A recording's text, for the person to check before sending, with the language it was in and how long it was.
      required: [duration_seconds, language, text]
      properties:
        text: {type: string}
        language: {type: string}
        duration_seconds: {type: number}
    ToolActivity:
      type: object
      description: A short diagnostics record. It does not include file contents.
      required: [at, status, tool_id]
      properties:
        tool_id: {type: string}
        status: {type: string}
        summary: {type: string}
        duration_ms: {type: integer, format: int64}
        error: {type: string}
        at: {type: string, format: date-time}
    NodeToolProviders:
      type: object
      description: One computer's providers, for Diagnostics (§16).
      required: [local, name, node_id, online, providers]
      properties:
        node_id: {type: string}
        name: {type: string}
        local: {type: boolean}
        online: {type: boolean}
        note: {type: string}
        providers:
          type: array
          items:
            type: object
            description: One computer's ability to run one tool.
            required: [accelerated, state, tool]
            properties:
              tool: {type: string}
              name: {type: string, description: 'What runs it, such as FLUX.2 [klein] 4B.'}
              state: {type: string}
              reason: {type: string, description: '`reason` says why it is not healthy.'}
              accelerated: {type: boolean, description: '`accelerated` means a GPU does the work, which matters for images.'}
              languages:
                type: array
                description: The languages the provider works in, as base BCP 47 tags such as "de", when they matter, such as for speech (multilingual spec §20). Empty means any language, or not known.
                items: {type: string}
              auto_detect: {type: boolean, description: '`auto_detect` means the provider tells the language itself, such as Whisper hearing which language is spoken.'}
    ToolResult:
      type: object
      description: "What the tool answered. Each tool's result is its own: see the tool's description in GET /api/v1/tools."
      additionalProperties: true
    OpenAIModel:
      type: object
      description: "A model as OpenAI clients list them: auto (Toskar picks), profile:<id>, or a specialized AI."
      required: [id, object, owned_by]
      properties:
        id: {type: string, example: "profile:default"}
        object: {type: string, enum: [model]}
        owned_by: {type: string, description: "yggdrasil, within contract 1.x (#237)"}
    OpenAIModelList:
      type: object
      required: [object, data]
      properties:
        object: {type: string, enum: [list]}
        data:
          type: array
          items: {$ref: "#/components/schemas/OpenAIModel"}
    ToskarExtension:
      type: object
      description: "What Toskar adds to an OpenAI answer, under toskar (and yggdrasil, its name before): the answer's sources, steps, notice, and files."
      properties:
        sources:
          type: array
          items: {$ref: "#/components/schemas/Citation"}
        steps:
          type: array
          items: {$ref: "#/components/schemas/ActivityStep"}
        notice: {type: string}
        files:
          type: array
          items: {$ref: "#/components/schemas/FileRef"}
    OpenAIChatCompletion:
      type: object
      description: "An OpenAI chat completion, for clients that speak OpenAI's API."
      required: [id, object, model, choices]
      properties:
        id: {type: string}
        object: {type: string, enum: [chat.completion]}
        model: {type: string}
        choices:
          type: array
          items:
            type: object
            required: [index, message, finish_reason]
            properties:
              index: {type: integer}
              message:
                type: object
                required: [role, content]
                properties:
                  role: {type: string, enum: [assistant]}
                  content: {type: string}
                  reasoning_content: {type: string, description: "What a reasoning model thought first, when the request asked for it"}
              finish_reason: {type: string}
        toskar: {$ref: "#/components/schemas/ToskarExtension"}
        yggdrasil: {$ref: "#/components/schemas/ToskarExtension"}