              schema:
                $ref: "#/components/schemas/Automation"
        "400":
          description: Invalid automation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such automation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflicts with its current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete an automation
      operationId: deleteAutomation
      parameters:
        - name: id
