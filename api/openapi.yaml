  /api/v1/models/import:
    post:
      summary: Add a model from a GGUF file
      description: >-
        A path on this computer as JSON, copied into the models folder (the default; progress comes as
        model.download events) or used in place with in_place, or the file itself as an
        application/octet-stream body with filename in the query. The header and tensor bounds are
        checked first (#467).
      operationId: importModel
      parameters:
        - name: filename
          in: query
          description: For an upload, the file's name, ending in .gguf
          schema:
            type: string
        - name: display_name
          in: query
          schema:
            type: string
        - name: id
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: An absolute path to a .gguf file on this computer
                in_place:
                  type: boolean
                id:
                  type: string
                display_name:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Added; status is copying or installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportedModel"
        "400":
          description: MODEL_FILE_NOT_FOUND, MODEL_FILE_INVALID (not GGUF, incomplete, or damaged), or MODEL_FILE_PROJECTOR
  /api/v1/models/import/found:
    get:
      summary: Models other local AI apps keep on this computer
      description: >-
        GGUF models LM Studio, Ollama (through its manifests), llama.cpp, and GPT4All already
        downloaded, to add with POST /api/v1/models/import without downloading them again. Only
        headers and Ollama's manifests are read; incomplete files and vision projectors are left out (#467).
        GGUF files put in Toskar's own models folder by hand that aren't models yet come first, as app
        toskar; one is always added in place (#763).
      operationId: findModelsInOtherApps
      responses:
        "200":
          description: The models found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundModels"
  /api/v1/models/install-from-url/preview:
    post:
      summary: What a download from a URL would bring, without downloading it
      description: >-
        The file and its size (and its vision projector's) from the repository, the free space where models are kept,
        whether it's already a model here, and copies of the same file other apps have (by name, Ollama's SHA-256 blob,
        or a large file's exact size), which can be added where they are instead (#611).
      operationId: previewModelFromURL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallFromURLRequest"
      responses:
        "200":
          description: The preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/URLPreview"
        "400":
          description: Not a GGUF URL
