    get:
      summary: Everyone's ratings of the models here, from hardware like this computer's and overall
      description: Empty unless `community_ratings` is on. The public summary is downloaded at most once a day; when that fails, the last one is used and `error` says why.
      operationId: getCommunityRatings
      responses:
        "200":
          description: Community ratings by local model ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityRatings"
  /api/v1/models/warm:
    post:
      summary: Start loading the model a chat would use
      description: >-
        Starts loading, in the background, the model a chat on the profile
        would use, and answers at once (#498), so it loads while someone types
        or speaks. Never loads beside a model that is answering, nor one that
        wouldn't fit beside those already loaded.
