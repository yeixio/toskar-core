              license: {type: string}
              memory_bytes: {type: integer, format: int64}
              size_bytes: {type: integer, format: int64}
              edits: {type: boolean, description: "Edits images, or for a video model, animates them"}
              kind: {type: string, enum: [image, video]}
              installed: {type: boolean}
              recommended: {type: boolean}
              files:
                type: array
                items:
                  type: object
                  properties:
                    role: {type: string, enum: [diffusion, vae, llm, t5xxl]}
                    repo: {type: string}
                    path: {type: string}
                    size_bytes: {type: integer, format: int64}
                    sha256: {type: string}
        job:
          type: object
          properties:
            model_id: {type: string}
            stage: {type: string, enum: [program, model]}
            done_bytes: {type: integer, format: int64}
            total_bytes: {type: integer, format: int64}
            running: {type: boolean}
            error: {type: string}
    Artifact:
      type: object
      description: One stored file.
      required: [created_at, id, kind, mime_type, name, producer, size_bytes]
      properties:
        id: {type: string}
        conversation_id: {type: string}
        name: {type: string}
        mime_type: {type: string}
        kind: {type: string, description: 'Document, spreadsheet, pdf, image, code, or other.'}
        size_bytes: {type: integer, format: int64}
        producer: {type: string}
        source_task: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, description: 'When a file that belongs to no chat is removed, a week after it was made. A file attached to or made in a chat has none.'}
        details:
          type: object
          description: How it was made, such as a picture's model, seed, and prompt (#553).
          additionalProperties: {}
    Memory:
      type: object
      description: One durable fact or preference.
      required: [category, content, created_at, enabled, id, local_only, source_type, updated_at]
      properties:
        id: {type: string}
        content: {type: string}
        category: {type: string}
        source_type: {type: string}
        source_ref: {type: string}
        enabled: {type: boolean}
        local_only: {type: boolean, description: '`local_only` keeps the memory on this computer: work that uses it is never sent to a paired computer (§63).'}
        language: {type: string, description: 'The language the memory is written in, as a BCP 47 tag detected on this computer (multilingual spec §18), or "" when it is too short to tell. A memory is found in any language; this says which one its text is in.'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    KnowledgeSource:
      type: object
      description: One connected knowledge source.
      required: [chunk_count, created_at, embedded_count, id, kind, local_only, name, status, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [path, text, database, api]}
        path: {type: string}
        filename: {type: string}
        status: {type: string}
        error: {type: string}
        error_code: {type: string, description: 'The error''s stable code (#588, contract 1.36), with its values in error_details.'}
        error_details:
          type: object
          additionalProperties: {}
        chunk_count: {type: integer}
        embedded_count: {type: integer, description: 'How many passages have a vector for semantic search, and EmbeddingModel the model that made them. Both are empty until an embedding model is installed.'}
        embedding_model: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        refreshed_at: {type: string, format: date-time}
        local_only: {type: boolean, description: '`local_only` keeps the source on this computer: a turn that uses its passages is never sent to a paired computer (§63).'}
        language: {type: string, description: 'The language most of the source''s passages are written in, detected on this computer when it was indexed (multilingual spec §19), and Languages every language found, with its passage count. A question in another language still finds it by meaning when a multilingual embedding model is installed.'}
        languages:
          type: array
          items:
            type: object
            description: A language a source is written in, and how many of its passages are in it.
            required: [language, passages]
            properties:
              language: {type: string}
              passages: {type: integer}
        remote:
          type: object
          description: How a database or API source is reached, without its credentials
          required: [refresh_minutes]
          properties:
            driver: {type: string}
            database: {type: string, description: 'The SQLite file. A PostgreSQL or MySQL connection string contains credentials, so it is stored as a secret.'}
            query: {type: string}
            url: {type: string}
            items: {type: string, description: 'The dotted path to the list in a JSON response, such as "data.products". Empty finds a top-level list.'}
            header_names:
              type: array
              description: '`header_names` lists the request headers that are set, without values.'
              items: {type: string}
            refresh_minutes: {type: integer, description: How old the data may get before a search fetches it again.}
