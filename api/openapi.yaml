openapi: 3.0.3
info:
  title: Yggdrasil Control Plane API
  version: 0.1.0
  description: Local AI control plane API for Yggdrasil.
servers:
  - url: http://127.0.0.1:7331
paths:
  /api/v1/health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/version:
    get:
      summary: Application version
      operationId: getVersion
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
  /about:
    get:
      summary: AGPL corresponding-source offer
      operationId: getAbout
      responses:
        "200":
          description: Name, version, commit, license, and source URL for this build
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceOffer"
  /source:
    get:
      summary: AGPL corresponding-source offer
      operationId: getSource
      responses:
        "200":
          description: Same body as /about
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceOffer"
  /api/v1/hardware:
    get:
      summary: Local hardware inventory
      operationId: getHardware
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardwareInventory"
  /api/v1/models:
    get:
      summary: List catalog and installed models
      operationId: listModels
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Model"
  /api/v1/profiles:
    get:
      summary: List AI profiles
      operationId: listProfiles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AIProfile"
  /api/v1/nodes:
    get:
      summary: List local and discovered computers
      operationId: listNodes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Node"
  /api/v1/settings:
    get:
      summary: Get settings
      operationId: getSettings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsView"
    patch:
      summary: Update settings
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsView"
  /api/v1/settings/reset:
    post:
      summary: Reset application to defaults
      description: >
        Clears chats, custom profiles, tasks, and API keys; restores settings and
        built-in profiles. Downloaded models and runtimes are kept. The client should
        clear local UI state and restart onboarding.
      operationId: resetApp
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsView"
  /api/v1/performance:
    get:
      summary: List generation performance samples
      operationId: listPerformance
      parameters:
        - name: sort
          in: query
          schema:
            type: string
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GenerationRun"
  /api/v1/benchmarks/workloads:
    get:
      summary: List benchmark workload categories
      operationId: listBenchmarkWorkloads
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BenchmarkWorkload"
  /api/v1/benchmarks:
    get:
      summary: List recent benchmark jobs
      operationId: listBenchmarks
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BenchmarkJob"
    post:
      summary: Start a multi-model benchmark
      operationId: startBenchmark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenchmarkRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkJob"
  /api/v1/benchmarks/{id}:
    get:
      summary: Get benchmark job status and results
      operationId: getBenchmark
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkJob"
  /api/v1/benchmarks/{id}/cancel:
    post:
      summary: Cancel a running benchmark
      operationId: cancelBenchmark
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /api/v1/conversations:
    get:
      summary: List conversations
      operationId: listConversations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      summary: Create conversation
      operationId: createConversation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                profile_id:
                  type: string
                model_id:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /api/v1/conversations/{id}:
    patch:
      summary: Update conversation
      operationId: updateConversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                profile_id:
                  type: string
                model_id:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
    delete:
      summary: Delete conversation
      operationId: deleteConversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /api/v1/events:
    get:
      summary: Heimdall event stream (SSE)
      operationId: eventStream
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
  /api/v1/logs:
    get:
      summary: List diagnostic log files
      operationId: listLogs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /api/v1/logs/{name}:
    get:
      summary: Read a log file tail
      operationId: getLog
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: tail_bytes
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/notifications:
    get:
      summary: List notifications that were not dismissed, newest first
      operationId: listNotifications
      parameters:
        - name: unread
          in: query
          description: "1 lists unread notifications only"
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Notifications and the unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  unread:
                    type: integer
  /api/v1/notifications/read:
    post:
      summary: Mark notifications read; no ids marks all of them
      operationId: markNotificationsRead
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        "204":
          description: Marked read
  /api/v1/notifications/{id}/dismiss:
    post:
      summary: Hide a notification from the notification center
      operationId: dismissNotification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Dismissed
        "404":
          description: No such notification
  /api/v1/connectors:
    get:
      summary: List connected services and their status. Secret values are never returned.
      operationId: listConnectors
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /api/v1/connectors/{id}:
    put:
      summary: Check values with the service, then store them and add its tools
      operationId: connectService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                values:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Connected
        "400":
          description: The service did not accept the values
        "404":
          description: Unknown service
    delete:
      summary: Delete the stored credential and remove the service's tools
      operationId: disconnectService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Disconnected
  /api/v1/connectors/{id}/check:
    post:
      summary: Check the stored credential again
      operationId: checkConnector
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Status
  /api/v1/mcp/servers:
    get:
      summary: List MCP tool sources with status, tools, and masked values. Secret values are never returned.
      operationId: listMCPServers
      responses:
        "200":
          description: Tool sources
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
    post:
      summary: Check a tool source connects and list its tools, then store it and add the tools
      description: >-
        Send a gallery entry ({"preset", "values"}), a spec ({"spec", "values"}), or a server from
        another app ({"import": {"app", "name"}}). redirect_base is the address the browser uses, for a
        sign-in. When the service needs a sign-in, the source is stored and sign_in_url is returned.
      operationId: addMCPServer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                preset:
                  type: string
                spec:
                  type: object
                  additionalProperties: true
                import:
                  type: object
                  properties:
                    app:
                      type: string
                    name:
                      type: string
                values:
                  type: object
                  additionalProperties:
                    type: string
                redirect_base:
                  type: string
      responses:
        "201":
          description: Added; server, and sign_in_url when a sign-in is needed
        "400":
          description: It could not connect, or a value is missing
        "404":
          description: Unknown gallery entry
  /api/v1/mcp/servers/{id}:
    get:
      summary: One tool source
      operationId: getMCPServer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tool source
        "404":
          description: Unknown tool source
    patch:
      summary: Change enabled, allow_sampling, always_offer, keywords, or per-tool policies (allow, ask, default)
      operationId: updateMCPServer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Tool source
    put:
      summary: Change how a tool source is reached, then check it. Blank secret values keep the stored ones.
      operationId: replaceMCPServer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                spec:
                  type: object
                  additionalProperties: true
                values:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Tool source
    delete:
      summary: Stop a tool source, remove its tools, and delete its stored secrets
      operationId: removeMCPServer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
  /api/v1/mcp/servers/{id}/check:
    post:
      summary: Connect again and list the tools
      operationId: checkMCPServer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tool source
  /api/v1/mcp/servers/{id}/sign-in:
    post:
      summary: Start signing in to the tool source's service; returns the address to open
      operationId: signInMCPServer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect_base:
                  type: string
      responses:
        "200":
          description: "{\"url\": \"...\"}"
  /api/v1/mcp/servers/{id}/sign-out:
    post:
      summary: Forget the tool source's sign-in
      operationId: signOutMCPServer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tool source
  /api/v1/mcp/servers/{id}/logs:
    get:
      summary: Recent log lines of a tool source
      operationId: mcpServerLogs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Log lines
  /api/v1/mcp/servers/{id}/prompts:
    get:
      summary: The tool source's ready-made prompts
      operationId: mcpServerPrompts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prompts
  /api/v1/mcp/servers/{id}/prompts/{name}:
    post:
      summary: Fill a prompt; returns its text
      operationId: getMCPPrompt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                arguments:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: "{\"text\": \"...\"}"
  /api/v1/mcp/servers/{id}/resources:
    get:
      summary: The tool source's resources
      operationId: mcpServerResources
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resources
  /api/v1/mcp/gallery:
    get:
      summary: Gallery entries, with programs that are missing and sources already added
      operationId: mcpGallery
      responses:
        "200":
          description: Gallery
  /api/v1/mcp/import:
    get:
      summary: MCP servers set up in other apps on this computer, with secret values hidden
      operationId: mcpImportCandidates
      responses:
        "200":
          description: Servers
  /api/v1/mcp/parse:
    post:
      summary: Read pasted settings, a web address, or a command line into server specs and what each still needs
      operationId: parseMCP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
      responses:
        "200":
          description: Parsed servers
        "400":
          description: Nothing could be read
  /api/v1/mcp/share:
    get:
      summary: The address and command other apps use to reach Yggdrasil's MCP server
      operationId: mcpShare
      responses:
        "200":
          description: Address, command, args, and whether a key is needed
  /mcp:
    post:
      summary: Yggdrasil's MCP server (Streamable HTTP, JSON-RPC). Tools ask_local_ai, list_local_models, search_my_knowledge.
      description: >-
        Checked like /v1. A request with an Origin header from another site is refused.
      operationId: mcpServer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: JSON-RPC response
        "202":
          description: Notification accepted
        "401":
          description: An API key is required
        "403":
          description: Origin not allowed
  /mcp/oauth/callback:
    get:
      summary: Where a tool source's sign-in returns; shows a page that says how it went
      operationId: mcpOAuthCallback
      responses:
        "200":
          description: HTML page
  /api/v1/personalization:
    get:
      summary: How the person likes answers
      operationId: getPersonalization
      responses:
        "200":
          description: Style
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalStyle"
    put:
      summary: Save how the person likes answers. Style only; it cannot grant a permission.
      operationId: setPersonalization
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalStyle"
      responses:
        "200":
          description: Saved
        "400":
          description: Invalid, or tries to grant a permission
  /api/v1/api-keys/{id}/permissions:
    put:
      summary: Change what an API key may ask of the assistant
      operationId: setAPIKeyPermissions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                memory:
                  type: string
                  enum: [never, on_request, always]
                knowledge:
                  type: string
                  enum: [never, on_request, always]
                tools:
                  type: string
                  enum: [profile, read_only, none]
                placement:
                  type: boolean
      responses:
        "200":
          description: The key, with its permissions
        "400":
          description: Invalid permissions or unknown key
  /api/v1/egress:
    get:
      summary: What left this computer, newest first
      operationId: listEgress
      parameters:
        - name: conversation_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Records
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string}
                    at: {type: string, format: date-time}
                    kind: {type: string, enum: [web_search, web_page, paired_computer, external_server, connector]}
                    destination: {type: string}
                    detail: {type: string}
                    source: {type: string}
                    conversation_id: {type: string}
                    task_id: {type: string}
  /api/v1/privacy:
    get:
      summary: Run record retention and a 30-day summary of what left this computer
      operationId: getPrivacy
      responses:
        "200":
          description: Overview
    put:
      summary: Set how long run records are kept; 0 keeps them
      operationId: setRunRetention
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                retention_days: {type: integer, minimum: 0, maximum: 3650}
      responses:
        "200":
          description: Overview
        "400":
          description: Invalid retention
  /api/v1/privacy/delete-runs:
    post:
      summary: Delete run records now
      operationId: deleteRunRecords
      responses:
        "200":
          description: How many records were removed
  /api/v1/runs:
    get:
      summary: Recent run traces, newest first
      operationId: listRuns
      parameters:
        - name: conversation_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Runs
  /api/v1/runs/{id}:
    get:
      summary: One run trace
      operationId: getRun
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The run
        "404":
          description: Not recorded, or removed by retention
  /api/v1/diagnostics:
    get:
      summary: Create a diagnostics bundle
      operationId: exportDiagnostics
      responses:
        "200":
          description: OK
  /v1/models:
    get:
      summary: OpenAI-compatible model list
      operationId: openaiListModels
      responses:
        "200":
          description: OK
  /v1/chat/completions:
    post:
      summary: OpenAI-compatible chat completions
      operationId: openaiChatCompletions
      responses:
        "200":
          description: OK
        "501":
          description: Not implemented yet
components:
  schemas:
    PersonalStyle:
      type: object
      properties:
        length:
          type: string
          enum: [brief, balanced, detailed]
        tone:
          type: string
          enum: [friendly, neutral, direct]
        format:
          type: string
          enum: [prose, lists]
        units:
          type: string
          enum: [metric, imperial]
        about_me:
          type: string
          maxLength: 1500
        instructions:
          type: string
          maxLength: 1500
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        product:
          type: string
        version:
          type: string
    VersionResponse:
      type: object
      properties:
        version:
          type: string
        commit:
          type: string
        build_date:
          type: string
        product:
          type: string
        license:
          type: string
        source:
          type: string
          description: URL of the corresponding source for this build.
        contract:
          type: object
          description: The client contract this build speaks (major.minor). Also in the Yggdrasil-Contract header on every response.
          properties:
            version:
              type: string
            major:
              type: integer
    SourceOffer:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        commit:
          type: string
        license:
          type: string
        source:
          type: string
    HardwareInventory:
      type: object
      additionalProperties: true
    Model:
      type: object
      additionalProperties: true
    AIProfile:
      type: object
      additionalProperties: true
    Node:
      type: object
      additionalProperties: true
    SettingsView:
      type: object
      additionalProperties: true
    GenerationRun:
      type: object
      additionalProperties: true
    BenchmarkWorkload:
      type: object
      additionalProperties: true
    BenchmarkRequest:
      type: object
      additionalProperties: true
    BenchmarkJob:
      type: object
      additionalProperties: true
    Conversation:
      type: object
      additionalProperties: true
