    Schedule:
      type: object
      description: The time rule for an automation. Clock fields are civil time in TimeZone. At and Anchor are absolute instants.
      required: [kind, time_zone]
      properties:
        kind: {type: string, enum: [once, daily, weekly, monthly, interval, cron, manual]}
        time_zone: {type: string, description: IANA time zone}
        at: {type: string, format: date-time, description: For once}
        hour: {type: integer, description: 'The first of times, for clients that read one'}
        minute: {type: integer}
        weekday: {type: integer, description: 'Sunday is 0. The first of weekdays, for clients that read one'}
        every_seconds: {type: integer, description: For interval}
        anchor: {type: string, format: date-time}
        weekdays:
          type: array
          description: A weekly schedule's days, Sunday is 0; 1-5 is weekdays only
          items: {type: integer}
        times:
          type: array
          description: The times of day a daily, weekly, or monthly schedule runs at
          items:
            type: object
            description: A time of day, in the schedule's time zone.
            required: [hour, minute]
            properties:
              hour: {type: integer}
              minute: {type: integer}
        month_day: {type: integer, description: For monthly. A month without the day runs on its last day.}
        cron: {type: string, description: 'For cron, five fields (minute hour day-of-month month day-of-week) in time_zone, such as "0 9 * * 1-5"'}
    AutomationNotification:
      type: object
      description: Stored with the automation and evaluated after the run result is saved.
      required: [mode]
      properties:
        mode: {type: string, enum: [always, condition, change, failure, none]}
        condition:
          type: object
          description: The structured rule for NotifyOnCondition. Price checks use threshold. Stock checks use available. A model can mark a result significant.
          required: [kind]
          properties:
            kind: {type: string, enum: [threshold, available, significant]}
            op: {type: string, description: Below or above. It applies to a threshold., enum: [below, above]}
            value: {type: number}
            currency: {type: string, description: 'ISO 4217 code of a threshold''s value, such as EUR. The run reports the price in this currency. Omitted means USD.'}
    AutomationInput:
      type: object
      description: The caller-supplied body of a new automation.
      required: [name, notification, prompt, schedule]
      properties:
        name: {type: string}
        enabled: {type: boolean}
        schedule: {$ref: '#/components/schemas/Schedule'}
        prompt: {type: string}
        profile_id: {type: string}
        model_id: {type: string, description: 'An installed model, or auto'}
        tools:
          type: array
          description: Tools approved to run unattended
          items: {type: string}
        notification: {$ref: '#/components/schemas/AutomationNotification'}
        response_language: {type: string, description: 'The language results are written in. account (or omitted) follows the assistant language setting, app the App language, auto the language of the request, or a BCP 47 tag such as de. A language the request asks for always wins.'}
        conversation_id: {type: string, description: 'The chat the automation was made from, when it came from a chat''s draft'}
        draft_id: {type: string, description: The id of the chat's draft (an answer's meta.automation). Creating the same draft again returns the automation it made.}
        save_folder: {type: string, description: 'A folder in the home folder, such as ~/Documents/Toskar, to also save each result to as a Markdown file. Empty stops saving.'}
        trigger:
          type: object
          description: Run only when a page, feed, or folder changed, checked on the schedule. On update, a trigger with no kind runs on the schedule again.
          required: [kind]
          properties:
            kind: {type: string, description: 'Page (a web page''s text changed), feed (an RSS or Atom feed has new posts), or folder (files in a folder, or one file, changed).', enum: [page, feed, folder, webhook, after, device, ""]}
            url: {type: string, description: 'The page or feed, for page and feed'}
            path: {type: string, description: 'A folder or file in the home folder, for folder; ~ is the home folder'}
            automation_id: {type: string, description: 'For after, the automation it runs after'}
            when: {type: string, description: 'For after, each time that one succeeds (the default) or only when it notifies', enum: [succeeded, notified]}
            connector: {type: string, description: 'For device, the connected service whose device it watches (#586)', enum: [homeassistant]}
            device: {type: string, description: 'For device, the device as that service names it, such as binary_sensor.front_door_visitor'}
            to: {type: string, description: 'For device, the state it must change to, such as on; empty runs on any change'}
            cooldown_seconds: {type: integer, description: 'For device, the seconds after a run during which changes start no other; 0 is 60'}
        cameras:
          type: array
          description: Cameras to look at as each run starts (#667). Their pictures, taken through the connected service, are shown to a model that can see. On update, an empty list stops looking.
          items:
            type: object
            description: 'One an automation looks at as each run starts (#667): a connected service''s camera, whose picture is then shown to a model that can see, like a photo attached in chat. Device is the camera as that service names it; Home Assistant''s are the first, such as camera.driveway.'
            required: [connector, device]
            properties:
              connector: {type: string, enum: [homeassistant]}
              device: {type: string, description: 'The camera as that service names it, such as Home Assistant''s camera.driveway'}
    Automation:
      type: object
      description: A scheduled prompt owned by the daemon.
      required: [consecutive_failures, created_at, enabled, id, name, notification, prompt, schedule, tools, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        enabled: {type: boolean}
        schedule: {$ref: '#/components/schemas/Schedule'}
        prompt: {type: string}
        profile_id: {type: string}
        model_id: {type: string, description: The installed model this scheduled prompt runs.}
        tools:
          type: array
          items: {type: string}
        notification: {$ref: '#/components/schemas/AutomationNotification'}
        response_language: {type: string, description: 'The language results are written in. account (or omitted) follows the assistant language setting, app the App language, auto the language of the request, or a BCP 47 tag such as de. A language the request asks for always wins.'}
        conversation_id: {type: string, description: The chat the automation was made from}
        draft_id: {type: string, description: The chat draft it was made from}
        save_folder: {type: string, description: The folder each result is also saved to}
        trigger:
          type: object
          description: Run only when a page, feed, or folder changed, checked on the schedule.
          required: [kind]
          properties:
            kind: {type: string, description: 'Page (a web page''s text changed), feed (an RSS or Atom feed has new posts), or folder (files in a folder, or one file, changed).', enum: [page, feed, folder, webhook, after, device, ""]}
            url: {type: string, description: 'The page or feed, for page and feed'}
            path: {type: string, description: 'A folder or file in the home folder, for folder; ~ is the home folder'}
            automation_id: {type: string, description: 'For after, the automation it runs after'}
            when: {type: string, description: 'For after, each time that one succeeds (the default) or only when it notifies', enum: [succeeded, notified]}
            connector: {type: string, description: 'For device, the connected service whose device it watches (#586)', enum: [homeassistant]}
            device: {type: string, description: 'For device, the device as that service names it, such as binary_sensor.front_door_visitor'}
            to: {type: string, description: 'For device, the state it must change to, such as on; empty runs on any change'}
            cooldown_seconds: {type: integer, description: 'For device, the seconds after a run during which changes start no other; 0 is 60'}
        cameras:
          type: array
          description: The cameras looked at as each run starts (#667)
          items:
            type: object
            description: 'One an automation looks at as each run starts (#667): a connected service''s camera, whose picture is then shown to a model that can see, like a photo attached in chat. Device is the camera as that service names it; Home Assistant''s are the first, such as camera.driveway.'
            required: [connector, device]
            properties:
              connector: {type: string}
              device: {type: string}
        last_checked_at: {type: string, format: date-time, description: When the trigger last checked and found nothing new}
        hook_set: {type: boolean, description: 'A webhook trigger has a link; POST /api/v1/automations/{id}/hook makes a new one'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        next_run_at: {type: string, format: date-time, description: The occurrence the daemon should execute next. A missed restart keeps only the latest missed occurrence here.}
        last_run_at: {type: string, format: date-time, description: When the previous occurrence finished. Zero means never run.}
        consecutive_failures: {type: integer, description: '`consecutive_failures` counts terminal failures in a row. A success clears it.'}
        last_error: {type: string, description: 'The most recent failure, including one that is waiting to retry.'}
        last_error_code: {type: string, description: 'The last error''s stable code (#588, contract 1.36), with its values in last_error_details.'}
        last_error_details:
          type: object
          additionalProperties: {}
        last_status: {type: string, description: '`last_status` and LastResult summarize the newest occurrence. List fills them.'}
        last_result: {type: string}
    PairingOffer:
      type: object
      properties:
        session_id:
          type: string
        from_node_id:
          type: string
        to_node_id:
          type: string
          description: The computer the offer is for; others refuse it.
        from_name:
          type: string
        from_cert_pem:
          type: string
        from_address:
          type: string
        code:
          type: string
        expires_at:
          type: string
        signature:
          type: string
          description: Base64 ed25519 signature by the key in from_cert_pem over the session, both node IDs, the code, the expiry, and the key's fingerprint. Unsigned offers are refused.
    APIKey:
      type: object
      description: An API key's details; its secret is shown only when it's made.
      required: [id, name, prefix, created_at, revoked, permissions, person_id]
      properties:
        id: {type: string}
        name: {type: string}
        prefix: {type: string}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        revoked: {type: boolean}
        permissions:
          type: object
          description: What the key may ask of the assistant
          required: [memory, knowledge, tools, placement]
          properties:
            memory: {type: string, enum: [never, on_request, always]}
            knowledge: {type: string, enum: [never, on_request, always]}
            tools: {type: string, enum: [profile, read_only, none]}
            placement: {type: boolean}
            profile: {type: string, description: "The one profile the key is pinned to (#345); absent lets each request choose"}
        kind: {type: string, enum: [device], description: "device for a key a phone or other device got by pairing (#216); absent for one made in API Access"}
        person_id: {type: string}
    Notification:
      type: object
      description: A stored notice.
      required: [body, category, created_at, id, severity, source_type, title]
      properties:
        id: {type: string}
        created_at: {type: string, format: date-time}
        source_type: {type: string}
        source_id: {type: string}
        category: {type: string, enum: [automation, approval, model, training, health, system]}
        severity: {type: string, enum: [info, success, warning, error]}
        title: {type: string, description: '`title` and Body are in English, for logs and clients that read text.'}
        body: {type: string}
        message:
          type: object
          description: The title and body as catalog keys with their values (multilingual spec §22), so each place that shows the notification writes it in its own language. Notices whose text comes from elsewhere, such as an automation's result, may have none.
          required: [title]
          properties:
            title:
              type: object
              description: 'One piece of a message: a catalog key with the values it needs, such as {"key": "notifications:notices.modelReady"}, or literal text that is the same in every language, such as an automation''s name or what a model wrote.'
              properties:
                key: {type: string}
                params:
                  type: object
                  additionalProperties: {}
                text: {type: string}
            body:
              type: array
              items:
                type: object
                description: 'One piece of a message: a catalog key with the values it needs, such as {"key": "notifications:notices.modelReady"}, or literal text that is the same in every language, such as an automation''s name or what a model wrote.'
                properties:
                  key: {type: string}
                  params:
                    type: object
                    additionalProperties: {}
                  text: {type: string}
        link: {type: string, description: 'An app path to the source, such as /automations?id=….'}
        url: {type: string, description: 'The web page it''s about, such as the product page an automation watched, so a tap opens it without reaching this computer (#460).'}
        read_at: {type: string, format: date-time}
        repeat_count: {type: integer, description: 'How many times the same notice came within the dedupe window, shown as "4 times" (§22).'}
        deliveries:
          type: array
          items:
            type: object
            description: One channel's attempt to deliver a notification.
            required: [attempts, channel, status]
            properties:
              channel: {type: string, description: 'desktop, or email:<id> or webhook:<id>'}
              destination_id: {type: string, description: 'The email or webhook destination, when there is one.'}
              status: {type: string, enum: [delivered, failed, suppressed, pending, held, cancelled]}
              attempts: {type: integer}
              delivered_at: {type: string, format: date-time}
              next_attempt_at: {type: string, format: date-time, description: When a pending or held delivery is tried next.}
              error: {type: string}
    NotificationDestinationInput:
      type: object
      description: Creates or changes a destination. On a change, nil fields keep their value, and an empty Password keeps the stored one.
      properties:
        kind: {type: string, description: Required when creating, enum: [email, webhook, ntfy]}
        name: {type: string}
        enabled: {type: boolean}
        email:
          type: object
          description: How an email destination reaches your SMTP server (§12). The password is a secret and is not part of it.
          required: [from, host, port, to]
          properties:
            host: {type: string}
            port: {type: integer, description: Default 587}
            username: {type: string}
            from: {type: string}
            to:
              type: array
              items: {type: string}
            tls: {type: string, description: none only for a server on this computer, enum: [starttls, tls, none]}
        webhook:
          type: object
          description: Where a webhook destination posts (§13). Its signing secret is a secret and is not part of it.
          required: [url]
          properties:
            url: {type: string, description: 'https, or http on this computer or the local network'}
        ntfy:
          type: object
          description: Where push notifications are published. An access token, when the topic needs one, is a secret and is not part of it.
          required: [server, topic]
          properties:
            server: {type: string, description: 'Default https://ntfy.sh'}
            topic: {type: string}
            content: {type: string, description: private sends only a generic notice; the default on ntfy.sh, enum: [full, private]}
            open_url: {type: string, description: This Toskar's address; tapping a notification opens it there}
        app:
          type: object
          description: 'What an app push carries (§11). Content is title (the default): the notification''s title, which the person''s own automation or Toskar wrote, with the text left on the computer; full: the title and text; or private: only "You have a new Toskar notification".'
          properties:
            content: {type: string}
        categories:
          type: array
          description: Empty receives every category
          items: {type: string}
        min_severity: {type: string, enum: [info, success, warning, error]}
        digest: {$ref: '#/components/schemas/NotificationDigest'}
        password: {type: string, description: The SMTP password or ntfy access token; stored as a secret and never returned}
    NotificationDestination:
      type: object
      description: An email address or a webhook that notifications are sent to.
      required: [enabled, has_secret, id, kind, name]
      properties:
        id: {type: string}
        kind: {type: string, enum: [email, webhook, ntfy]}
        name: {type: string}
        enabled: {type: boolean}
        email:
          type: object
          description: How an email destination reaches your SMTP server (§12). The password is a secret and is not part of it.
          required: [from, host, port, to]
          properties:
            host: {type: string}
            port: {type: integer}
            username: {type: string}
            from: {type: string}
            to:
              type: array
              items: {type: string}
            tls: {type: string, description: 'Starttls (the default), tls (implicit, usually port 465), or none, which is allowed only for a server on this computer.'}
        webhook:
          type: object
          description: Where a webhook destination posts (§13). Its signing secret is a secret and is not part of it.
          required: [url]
          properties:
            url: {type: string}
        ntfy:
          type: object
          description: Where push notifications are published. An access token, when the topic needs one, is a secret and is not part of it.
          required: [server, topic]
          properties:
            server: {type: string}
            topic: {type: string}
            content: {type: string, description: 'Full (title and text) or private, which sends only "You have a new Yggdrasil notification" (§11). Private is the default on the public server, where anyone who knows the topic can read it.'}
            open_url: {type: string, description: 'This Yggdrasil''s address, such as http://192.168.1.10:7331. When set, tapping a notification opens it there.'}
        app:
          type: object
          description: 'What an app push carries (§11). Content is title (the default): the notification''s title, which the person''s own automation or Toskar wrote, with the text left on the computer; full: the title and text; or private: only "You have a new Toskar notification".'
          properties:
            content: {type: string}
        categories:
          type: array
          description: '`categories` it receives; empty receives every category (§26).'
          items: {type: string}
        min_severity: {type: string, description: 'The lowest severity it receives: info (the default), success, warning, or error.'}
        digest: {$ref: '#/components/schemas/NotificationDigest'}
        has_secret: {type: boolean, description: '`has_secret` reports a stored password, signing secret, or access token, never its value.'}
    NotificationDigest:
      type: object
      description: A daily digest instead of each notice; errors still go out at once. On a change, an empty at turns it off.
      required: [at, time_zone]
      properties:
        at: {type: string, description: 'HH:MM'}
        time_zone: {type: string, description: IANA time zone; UTC when left out}
    QuietHours:
      type: object
      description: Hold notices from channels outside the app overnight (§24–25). Held notices are in the notification center at once and go out when quiet hours end.
      required: [allow, enabled, end, start, time_zone]
      properties:
        enabled: {type: boolean}
        start: {type: string, description: '`start` and End are HH:MM in TimeZone; End may be the next day.', example: "22:00"}
        end: {type: string, example: "07:00"}
        time_zone: {type: string, example: Europe/Berlin}
        allow: {type: string, description: errors lets errors through; nothing holds everything, enum: [errors, nothing]}
    ToolDescriptor:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        capability: {type: string}
        source: {type: string}
        risk: {type: string, enum: [read, create, write]}
        default_policy: {type: string}
        version: {type: integer}
        input_schema: {type: object, additionalProperties: true, description: JSON Schema of the arguments}
        outputs: {type: array, items: {type: string, enum: [text, file, image, audio, video]}}
        level: {type: integer, minimum: 1, maximum: 4, description: "1 low risk on this computer, 2 reads outside data, 3 changes things, 4 runs commands or code"}
        level_name: {type: string}
        execution: {type: string, enum: [local, remote, either]}
        requirements:
          type: object
          properties:
            network: {type: boolean}
            filesystem: {type: boolean}
            credentials: {type: boolean}
            runtime: {type: string}
            gpu: {type: boolean}
        supports:
          type: object
          properties:
            progress: {type: boolean}
            cancel: {type: boolean}
        timeout_seconds: {type: integer}
        provider: {type: string, description: "builtin, connector:<service>, or mcp:<source>"}
        enabled: {type: boolean}
        health: {type: string, enum: [ok, off, unavailable]}
        profiles: {type: array, items: {type: string}}
    ToolRun:
      type: object
      properties:
        id: {type: string}
        at: {type: string, format: date-time}
        tool_id: {type: string}
        status: {type: string, enum: [completed, cached, failed, denied, refused, disabled]}
        approval: {type: string, enum: [profile, you, session]}
        duration_ms: {type: integer}
        summary: {type: string, description: "What the call was about: a query, an address, a path; never a file's contents"}
        error: {type: string}
        source: {type: string}
        conversation_id: {type: string}
        task_id: {type: string}

    Person:
      type: object
      description: Someone who uses this computer (#206).
      required: [id, name, role, created_at, sign_in]
      properties:
        id: {type: string}
        name: {type: string}
        username: {type: string, description: "Set once they can sign in with a password"}
        role: {type: string, enum: [owner, admin, member, visitor]}
        created_at: {type: string, format: date-time}
        disabled_at: {type: string, format: date-time, description: "When an Admin turned them off; absent while they're on"}
        sign_in: {type: boolean, description: "They've set a username and password"}
        external: {type: string, description: "Who they are at a trusted proxy or OpenID Connect provider"}
        portal_id: {type: string, description: "The chat portal a guest belongs to (#205)"}
        profiles:
          type: array
          items: {type: string}
          description: "The profiles they're pinned to (#345). Absent is their role's; empty is any profile."
        email: {type: string}
        must_change: {type: boolean, description: "The password an Admin set must be changed at their next sign-in"}
    Principal:
      type: object
      description: Who a request is from, and how Toskar knows.
      required: [person, via]
      properties:
        person: {$ref: "#/components/schemas/Person"}
        via: {type: string, enum: [this_computer, api_key, session, proxy, none, system]}
        key_id: {type: string, description: "The API key the request used, when via is api_key"}
        key_profile: {type: string, description: "The profile that key is pinned to (#345)"}
    Me:
      type: object
      description: "Who the request is from (#206): a Principal, with the profiles and capabilities they have."
      required: [person, via, capabilities]
      properties:
        person: {$ref: "#/components/schemas/Person"}
        via: {type: string, enum: [this_computer, api_key, session, proxy, none, system]}
        key_id: {type: string}
        key_profile: {type: string}
        profiles:
          type: array
          items: {type: string}
          description: "The profiles they may chat with, when they're pinned to some (#345)"
        capabilities: {$ref: "#/components/schemas/Capabilities"}
    Invite:
      type: object
      description: Whom an invite or reset link is for, before it's used.
      required: [name, kind]
      properties:
        name: {type: string}
        kind: {type: string, enum: [invite, reset, portal]}
        username: {type: string}
    InviteLink:
      type: object
      description: A link that lets someone set their password, once, before it expires.
      required: [path, kind, expires_at]
      properties:
        path: {type: string, description: "The link's path on this computer, such as /invite/TOKEN"}
        kind: {type: string, enum: [invite, reset]}
        expires_at: {type: string, format: date-time}
    AddedPerson:
      type: object
      description: The person just added, and their invite link unless an Admin set their password.
      required: [person]
      properties:
        person: {$ref: "#/components/schemas/Person"}
        link: {$ref: "#/components/schemas/InviteLink"}
    ActivityEntry:
      type: object
      description: Something an Admin did to someone's account (#592).
      required: [at, actor_id, actor_name, target_id, target_name, action]
      properties:
        at: {type: string, format: date-time}
        actor_id: {type: string}
        actor_name: {type: string}
        target_id: {type: string}
        target_name: {type: string}
        action: {type: string, enum: [added, changed, disabled, enabled, deleted, password_set, link_made, key_revoked, device_revoked]}
        detail: {type: string, description: "What changed, such as \"role member → admin\""}
    RoleCapabilities:
      type: object
      description: What each role may use (#589), and the defaults.
      required: [capabilities, roles, defaults]
      properties:
        capabilities: {type: array, items: {type: string}, description: "Every capability there is"}
        roles:
          type: object
          additionalProperties: {$ref: "#/components/schemas/Capabilities"}
        defaults:
          type: object
          additionalProperties: {$ref: "#/components/schemas/Capabilities"}
    PersonCapabilities:
      type: object
      description: One person's own capability settings (#589), and what they end up with.
      required: [set, effective]
      properties:
        set:
          type: object
          additionalProperties: {type: boolean}
          description: Set for them, over their role's
        effective: {$ref: "#/components/schemas/Capabilities"}
    ProfilePins:
      type: object
      description: The profiles each role is pinned to (#345); a role pinned to none may use any.
      required: [roles]
      properties:
        roles:
          type: object
          additionalProperties: {type: array, items: {type: string}}
    Capabilities:
      type: object
      description: "What someone may use (#589): each capability, on or off, so an app hides what they can't."
      additionalProperties: {type: boolean}
    OIDCInfo:
      type: object
      description: Whether the sign-in screen offers an OpenID Connect provider.
      required: [enabled]
      properties:
        enabled: {type: boolean}
        label: {type: string, description: "The provider's name for its button"}
    DevicePairing:
      type: object
      description: "A code shown to connect a device (#216), and what became of it."
      required: [expires_at, state, reachable]
      properties:
        code: {type: string, description: "The 6 digits; only when the code is made"}
        expires_at: {type: string, format: date-time}
        state: {type: string, enum: [waiting, connected, expired, cancelled]}
        device: {$ref: "#/components/schemas/APIKey"}
        address: {type: string, description: "This computer's address on the local network, such as 192.168.1.20:7331"}
        reachable: {type: boolean, description: "False while the API answers only on this computer, so a device can't connect yet"}
        tls_short: {type: string, description: "The start of the certificate's fingerprint, which the device shows too (#213)"}
    PairedDevice:
      type: object
      description: "A newly connected device's key, shown once, with the certificate to pin from now on (#213) and, when this computer has one, its route (#456)."
      required: [api_key, key, tls_fingerprint, tls_short]
      properties:
        api_key: {type: string, description: "The device's own key; keep it, it isn't shown again"}
        key: {$ref: "#/components/schemas/APIKey"}
        tls_fingerprint: {type: string, description: "SHA-256 of the API certificate's public key, to pin"}
        tls_short: {type: string}
        route_secret: {type: string, description: "Seals and finds this computer's address record (#456); present when it has access from anywhere"}
        route_id: {type: string}
        relay: {type: string, description: "The relay it's reached through, such as relay.toskar.ai"}
        token: {type: string, description: "This computer's token for the relay, for every paired device on the home network"}
    DeviceRoute:
      type: object
      description: "How a paired device finds this computer away from home (#456)."
      required: [route_secret, route_id]
      properties:
        route_secret: {type: string, description: "Seals and finds this computer's address record (#456); present when it has access from anywhere"}
        route_id: {type: string}
        relay: {type: string, description: "The relay it's reached through, such as relay.toskar.ai"}
        token: {type: string, description: "This computer's token for the relay, for every paired device on the home network"}
    MyDevice:
      description: "One of your connected devices, and whether it takes pushes from the Toskar app (#460)."
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [push]
          properties:
            push: {type: boolean}
    ConversationSummary:
      type: object
      description: Covers a conversation's older messages, through one message. The messages themselves stay saved; the summary is only what the model sees in their place.
      required: [conversation_id, edited, message_count, summary, through_created_at, through_message_id, updated_at]
      properties:
        conversation_id: {type: string}
        through_message_id: {type: string}
        through_created_at: {type: string, format: date-time}
        message_count: {type: integer}
        summary: {type: string}
        model_id: {type: string}
        updated_at: {type: string, format: date-time}
        edited: {type: boolean, description: '`edited` says the person corrected it (#342); later summaries keep their corrections.'}
    Event:
      type: object
      description: A structured Heimdall event.
      required: [contract, id, timestamp, type]
      properties:
        id: {type: string}
        type: {type: string}
        timestamp: {type: string, format: date-time}
        task_id: {type: string}
        node_id: {type: string}
        payload:
          type: object
          additionalProperties: {}
        contract: {type: string, description: The client contract the event is written in (§68).}
    Run:
      type: object
      description: A traced request.
      required: [contract, id, models, nodes, retries, started_at, status, strategy, tools, verification_passes]
      properties:
        id: {type: string}
        contract: {type: string, description: The client contract the trace is written in (§68).}
        conversation_id: {type: string}
        profile_id: {type: string}
        source: {type: string}
        client: {type: string, description: 'The app that asked: phone, tablet, watch, tv, desktop, or web, or other; empty when it didn''t say, such as an API call (#498).'}
        remote: {type: boolean, description: Set when the request came from outside the home network.}
        strategy:
          type: array
          items: {type: string}
        effort: {type: string}
        status: {type: string}
        error: {type: string, description: The English text; ErrorCode and ErrorDetails let clients show it in the App language (multilingual spec §10).}
        error_code: {type: string}
        error_details:
          type: object
          additionalProperties: {}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        latency_ms: {type: number}
        pipeline_ms: {type: number, description: The time before the first model call.}
        models:
          type: array
          items: {$ref: '#/components/schemas/ModelUse'}
        tools:
          type: array
          items: {$ref: '#/components/schemas/ToolUse'}
        nodes:
          type: array
          items: {type: string}
        workers: {type: integer, description: How many parts a plan had; 0 when there was no plan.}
        parallel: {type: boolean}
        verification_passes: {type: integer, description: '`verification_passes` counts answer checks; Issues and Fixed what they found.'}
        verification_issues: {type: integer}
        verification_fixed: {type: integer}
        retries: {type: integer, description: '`retries` counts answers tried again on another model.'}
        context_tokens: {type: integer}
        context_limit: {type: integer}
        cache_hits:
          type: object
          description: '`cache_hits` counts tool calls answered from a cache, by tool (§36).'
          additionalProperties: {type: integer}
        topic: {type: string, description: 'What an Enforce profile''s topic check found (#345): on_topic, small_talk, off_topic when the set reply went out without an answer, or answer_off_topic when the answer was replaced by it.'}
    ModelUse:
      type: object
      description: One model's part in a run.
      required: [cached_tokens, calls, completion_tokens, model_id, prompt_tokens]
      properties:
        model_id: {type: string}
        role: {type: string}
        node: {type: string}
        calls: {type: integer}
        load_ms: {type: number, description: 'Time spent starting the model for this run, if it had to.'}
        first_token_ms: {type: number, description: 'The wait for the first token of the first call, including loading.'}
        ttft_ms: {type: number}
        prompt_tokens: {type: integer}
        completion_tokens: {type: integer}
        cached_tokens: {type: integer}
        tok_per_sec: {type: number}
        backend: {type: string, description: '`backend` and Device ran the model, such as vulkan and "AMD Radeon RX 7900 XTX" (#317); empty when not known, such as on a paired computer.'}
        device: {type: string}
    ToolUse:
      type: object
      description: One tool's part in a run.
      required: [calls, tool_id, total_ms]
      properties:
        tool_id: {type: string}
        calls: {type: integer}
        failures: {type: integer}
        total_ms: {type: number}
    FirstAnswers:
      type: object
      description: How long people waited for the first word of an answer (#498), by the app they asked from and whether a model had to load first.
      required: [groups, since]
      properties:
        since: {type: string, format: date-time}
        groups:
          type: array
          items: {$ref: '#/components/schemas/FirstAnswersGroup'}
    FirstAnswersGroup:
      type: object
      description: One app's answers, cold (a model loaded first) or warm (every model was already running).
      required: [client, cold, first_word_ms, first_word_p90_ms, runs]
      properties:
        client: {type: string, description: As in Run; empty for requests that didn't say.}
        cold: {type: boolean}
        runs: {type: integer}
        remote: {type: integer, description: '`remote` counts the runs that came from outside the home network.'}
        first_word_ms: {type: number, description: The median wait from the request to the first token; FirstWordP90Ms is the wait nine in ten answers beat.}
        first_word_p90_ms: {type: number}
        load_ms: {type: number, description: The median time spent loading models; 0 when warm.}
    MessageMeta:
      type: object
      description: What an assistant answer used and did.
      properties:
        sources:
          type: array
          items: {$ref: '#/components/schemas/Citation'}
        steps:
          type: array
          items: {$ref: '#/components/schemas/ActivityStep'}
        notice: {type: string, description: '`notice` tells the user something changed that may affect the answer, such as a smaller model answering after the chosen one failed.'}
        files:
          type: array
          description: Attached to a question or produced with an answer.
          items: {$ref: '#/components/schemas/FileRef'}
        run_id: {type: string, description: '`run_id` names the run trace behind the answer (§35), at GET /api/v1/runs/{id}.'}
        contract: {type: string, description: 'The client contract the metadata was written in (§68). Metadata saved before the contract existed has none, and reads as 1.0.'}
        setup: {$ref: '#/components/schemas/SetupOffer'}
        context: {$ref: '#/components/schemas/ContextUsage'}
        backend: {type: string, description: '`backend` and Device ran the answer, such as vulkan and "AMD Radeon RX 7900 XTX", or cpu and "" (#317, contract 1.8), so a client such as the iPhone app can say whether it came from the GPU. Empty when not known, such as when a step ran on a paired computer.'}
        device: {type: string}
        automation: {$ref: '#/components/schemas/AutomationDraft'}
        automation_run: {$ref: '#/components/schemas/AutomationRun'}
        deliberation:
          type: object
          description: 'How the answer was reached when its profile deliberates: the drafts compared and the outcome (#459, contract 1.23).'
          required: [drafts, outcome]
          properties:
            outcome: {type: string, description: 'Agreed (every draft gave the same short final answer), majority (most did), disagreed (no answer had a majority), or long (the answers weren''t short, so there was nothing to compare).'}
            final: {type: string, description: 'The final answer kept, when there was one.'}
            drafts:
              type: array
              items:
                type: object
                description: One independent draft.
                required: [role]
                properties:
                  role: {type: string, description: 'The turn''s own role for the first draft, then drafter:2…'}
                  model_id: {type: string}
                  node_id: {type: string}
                  node_name: {type: string, description: 'The computer it ran on, for people.'}
                  final: {type: string, description: 'Its short final answer, when it gave one.'}
                  text: {type: string, description: 'The draft, cut to a few thousand characters.'}
                  chosen: {type: boolean}
                  failed: {type: boolean}
            critiques:
              type: array
              description: Each draft checked by another drafter, when the drafts disagreed or were too long to compare (contract 1.24).
              items:
                type: object
                description: One draft checked against the others.
                required: [critic, draft]
                properties:
                  draft: {type: integer, description: The index of the draft checked; Critic the drafter's role.}
                  critic: {type: string}
                  claims:
                    type: array
                    items: {type: string}
                  disagreements:
                    type: array
                    items: {type: string}
                  likely_errors:
                    type: array
                    items: {type: string}
                  failed: {type: boolean}
            judge:
              type: object
              description: '`judge` wrote the answer from the drafts and critiques, when it did (contract 1.24). Then no draft is chosen.'
              required: [role]
              properties:
                role: {type: string}
                model_id: {type: string}
                node_id: {type: string}
                node_name: {type: string}
        reasoning:
          type: object
          description: How long a reasoning model thought before it answered, and what it thought (#701, contract 1.43).
          required: [ms]
          properties:
            ms: {type: integer, format: int64, description: 'How long it thought, in milliseconds.'}
            text: {type: string, description: 'What it thought, cut at 20,000 characters; empty when the model didn''t say.'}
    Citation:
      type: object
      description: A source an answer drew on. The product renders citations; the model is not asked to invent citation syntax.
      required: [kind, title]
      properties:
        kind: {type: string, description: 'Web, knowledge, or file.'}
        title: {type: string}
        url: {type: string}
        source: {type: string, description: The knowledge source name or the file path.}
        snippet: {type: string}
        artifact_id: {type: string, description: 'The chat file a file citation names, so a client can offer it for download (contract 1.9).'}
    ActivityStep:
      type: object
      description: One thing the assistant did for an answer, in plain language.
      required: [kind, text]
      properties:
        kind: {type: string, description: 'Knowledge, memory, search, read, file, write, create, command, git, route, or recover.'}
        text: {type: string}
    FileRef:
      type: object
      description: Points at a stored file (an artifact). Its bytes are at GET /api/v1/artifacts/{id}/content.
      required: [id, kind, mime_type, name, producer, size_bytes]
      properties:
        id: {type: string}
        name: {type: string}
        mime_type: {type: string}
        kind: {type: string, description: 'Document, spreadsheet, pdf, image, code, or other.'}
        size_bytes: {type: integer, format: int64}
        producer: {type: string, description: 'User for an attachment, assistant for a produced file.'}
        details:
          type: object
          description: 'How a made file was made, such as a picture''s model, quality, seed, size, and prompt (contract 1.29, #553).'
          additionalProperties: {}
    SetupOffer:
      type: object
      description: Offers to install a missing ability, such as image generation, and to finish the request once it is ready.
      required: [ability, label, name, option, size_bytes]
      properties:
        ability: {type: string, description: 'The inventory ability, such as image_generation.'}
        label: {type: string}
        option: {type: string, description: 'What to install: for image_generation, the model id for POST /api/v1/images/setup.'}
        name: {type: string}
        size_bytes: {type: integer, format: int64}
        node_id: {type: string}
        node_name: {type: string}
        request: {type: string, description: The message to send again once it is set up; empty for a question about the ability.}
        slow: {type: boolean, description: '`slow` says the computer it runs on has no GPU acceleration for it, so each picture takes minutes and a clip can take most of an hour (contract 1.12).'}
        tight_memory: {type: boolean, description: '`tight_memory` says the computer has less memory than the model is comfortable with, so it may be slow or fail (contract 1.12).'}
        verdict: {type: string, description: 'Works, tight (set up only when the person agrees), or unsupported; for tight, Short is what it''s short of (memory, graphics for a card''s own memory, or shared for the share of memory Apple silicon''s graphics may use), NeedBytes what the model needs of it, and HaveBytes what the computer has (contract 1.34, #550).'}
        short: {type: string}
        need_bytes: {type: integer, format: int64}
        have_bytes: {type: integer, format: int64}
        remote: {type: boolean, description: '`remote` says NodeID is a paired computer, not this one, and FreeBytes is its free disk space when known (contract 1.14, #153). The app sets it up there with ?node_id= on the setup routes.'}
        free_bytes: {type: integer, format: int64}
        attachments:
          type: array
          description: 'The files to send again with Request, such as the pictures a vision model is set up to look at (contract 1.28, #529). For ability "vision", Option is the model id for POST /api/v1/models/{id}/install.'
          items: {type: string}
        reason: {type: string, description: '`reason` and Fit are for a model offer (#707, contract 1.45; ability model): why the model would answer this kind of request better (coding, data, language, reasoning, or context), and how well it fits this computer (excellent or good). Request is then answered again with Option.'}
        fit: {type: string}
    AutomationDraft:
      type: object
      description: An automation a chat drafted from a request. A client shows it and, when the person confirms, creates it with POST /api/v1/automations, passing ID as draft_id and the conversation as conversation_id; creating the same draft again returns that automation.
      required: [id, name, notification, prompt, schedule]
      properties:
        id: {type: string}
        name: {type: string}
        prompt: {type: string}
        schedule: {description: '`schedule` and Notification are the automation''s, as POST /api/v1/automations takes them.'}
        notification: {}
        profile_id: {type: string, description: 'The chat''s profile, which runs it.'}
        notes:
          type: array
          description: '`notes` say what was assumed, such as a time the request didn''t give, in the App language.'
          items: {type: string}
    AutomationRun:
      type: object
      description: The automation run a chat message came from.
      required: [automation_id, name, run_id]
      properties:
        automation_id: {type: string}
        run_id: {type: string}
        name: {type: string, description: The automation's name when it ran.}
    ContextUsage:
      type: object
      description: How a turn used the model's context window, in tokens.
      required: [conversation, instructions, limit, prompt_tokens, tool_results, tools]
      properties:
        prompt_tokens: {type: integer}
        limit: {type: integer}
        instructions: {type: integer}
        tools: {type: integer}
        conversation: {type: integer}
        tool_results: {type: integer}
        estimated: {type: boolean}
        summarized_messages: {type: integer, description: Older messages the model saw as a summary.}
        memory_bytes: {type: integer, format: int64, description: 'About how much memory the window reserves, when the model ran on this computer.'}
    ConversationsDeleted:
      type: object
      description: What a bulk delete removed, and what it left and why.
      required: [deleted, skipped]
      properties:
        deleted:
          type: array
          items: {type: string}
        skipped:
          type: array
          items: {$ref: '#/components/schemas/ConversationSkipped'}
    ConversationSkipped:
      type: object
      description: 'A chat a bulk delete left. Reason is not_found: there''s no such chat, or it''s someone else''s.'
      required: [id, reason]
      properties:
        id: {type: string}
        reason: {type: string}
    ModelWarmRequest:
      type: object
      description: 'Asks this computer to load the model a chat would use, before the question arrives (#498): a device sends it when someone starts asking. model_id empty or "auto" means the model Auto would pick for a chat on profile_id (empty: the default profile).'
      properties:
        profile_id: {type: string}
        model_id: {type: string}
    ModelWarmResponse:
      type: object
      description: Says what a warm-up did. Status is loading (started now, or already starting), loaded (ready), busy (a model is answering, so nothing new loads), no_room (it wouldn't fit beside the loaded models), not_local (not installed on this computer), or none (nothing to load).
      required: [status]
      properties:
        model_id: {type: string}
        status: {type: string}
    EgressRecord:
      type: object
      description: One time data left this computer.
      required: [at, destination, id, kind]
      properties:
        id: {type: string}
        at: {type: string, format: date-time}
        kind: {type: string}
        destination: {type: string, description: 'Where it went: a host, a paired computer''s name, or a connected service.'}
        detail: {type: string, description: 'What went: a search query, a page address, or what was sent.'}
        source: {type: string}
        conversation_id: {type: string}
        task_id: {type: string}
    ContractInfo:
      type: object
      description: Describes the contract in /api/v1/version.
      required: [major, version]
      properties:
        version: {type: string}
        major: {type: integer, description: The major version clients must match.}
    ErrorBody:
      type: object
      description: The standard public API error envelope.
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        details:
          type: object
          additionalProperties: {}
    ChatStopped:
      type: object
      description: Says whether a turn was running to stop.
      required: [stopped]
      properties:
        stopped: {type: boolean}
    ChatAnswer:
      type: object
      description: 'POST /api/v1/chat''s answer when it isn''t streamed: the whole reply, and how the model did when the runtime said.'
      required: [content]
      properties:
        content: {type: string}
        metrics: {$ref: '#/components/schemas/GenerationMetrics'}
    ChatToken:
      type: object
      description: 'A token event: the next piece of the answer.'
      required: [content]
      properties:
        content: {type: string}
    ChatDone:
      type: object
      description: 'The done event: the answer is finished and saved.'
      properties:
        metrics: {$ref: '#/components/schemas/GenerationMetrics'}
    GenerationMetrics:
      type: object
      description: Per-turn inference performance.
      required: [completion_tokens, eval_ms, eval_tok_per_sec, prompt_ms, prompt_tok_per_sec, prompt_tokens, total_ms, total_tokens, ttft_ms]
      properties:
        prompt_tokens: {type: integer}
        completion_tokens: {type: integer}
        total_tokens: {type: integer}
        ttft_ms: {type: number}
        prompt_ms: {type: number}
        eval_ms: {type: number}
        total_ms: {type: number}
        prompt_tok_per_sec: {type: number}
        eval_tok_per_sec: {type: number}
        cached_tokens: {type: integer, description: 'Prompt tokens reused from the model''s cache instead of processed again, when the runtime reports them.'}
    Recommendation:
      type: object
      description: Explains a recommended model setup.
      required: [estimated_storage_bytes, estimated_vram_bytes, models, purpose, reason, roles]
      properties:
        purpose: {type: string}
        roles:
          type: array
          items:
            type: object
            description: Assignment within a profile.
            required: [model_id, required, role]
            properties:
              role: {type: string}
              model_id: {type: string}
              node_id: {type: string}
              required: {type: boolean}
        models:
          type: array
          items: {$ref: '#/components/schemas/Model'}
        reason: {type: string}
        estimated_storage_bytes: {type: integer, format: int64}
        estimated_vram_bytes: {type: integer, format: int64}
        community_chosen: {type: boolean, description: True when community ratings moved the main model ahead of the curated first choice.}
    ModelFit:
      type: object
      description: Returned by GET /models/fit.
      required: [fits, memory_bytes, winners]
      properties:
        node_id: {type: string}
        node_name: {type: string}
        memory_bytes: {type: integer, format: int64}
        fits:
          type: array
          items:
            type: object
            description: Describes how well a model fits a node's hardware.
            required: [expected_memory_bytes, install_allowed, label, model_id]
            properties:
              model_id: {type: string}
              node_id: {type: string}
              node_name: {type: string}
              label: {type: string}
              expected_memory_bytes: {type: integer, format: int64}
              reason: {type: string}
              est_tok_per_sec: {type: number}
              tok_per_sec_measured: {type: boolean}
              runtime_memory_low_bytes: {type: integer, format: int64, description: '`runtime_memory_low_bytes` and RuntimeMemoryHighBytes are a conservative range for weights, KV cache, and runtime buffers. They are not the file size alone.'}
              runtime_memory_high_bytes: {type: integer, format: int64}
              weight_bytes: {type: integer, format: int64}
              quantization: {type: string}
              approximate: {type: boolean}
              context_tokens: {type: integer}
              total_memory_bytes: {type: integer, format: int64}
              available_memory_bytes: {type: integer, format: int64}
              memory_kind: {type: string, description: unified | system}
              headroom: {type: number}
              install_allowed: {type: boolean}
              runtime_warning: {type: string}
              recommendations:
                type: array
                items: {type: string}
              gpu_note: {type: string}
              known_to_run: {type: boolean}
              short: {type: string, description: 'What a model is short of when that holds it back: "shared" on Apple silicon, where the graphics may use only part of memory, with NeedBytes what it needs and HaveBytes what the graphics may use (contract 1.46, #751).'}
              need_bytes: {type: integer, format: int64}
              have_bytes: {type: integer, format: int64}
        winners:
          type: array
          items:
            type: object
            description: A recommendation badge for Discover.
            required: [category, label, model_id]
            properties:
              category: {type: string, description: best_overall|fastest|best_quality|lowest_memory|coding|general|reasoning|vision}
              label: {type: string, description: human label e.g. "Best coding"}
              model_id: {type: string}
              community_chosen: {type: boolean, description: True when community ratings from hardware like this computer's moved this model ahead of the curated first choice.}
    BrowseModel:
      type: object
      description: A Hugging Face browse-all hit (GGUF filtered).
      required: [display_name, filename, id, repo_id, source_url]
      properties:
        id: {type: string}
        display_name: {type: string}
        summary: {type: string}
        repo_id: {type: string}
        filename: {type: string}
        source_url: {type: string}
        size_bytes: {type: integer, format: int64}
        parameters: {type: string}
        variant: {type: string}
        downloads: {type: integer}
        tags:
          type: array
          items: {type: string}
    URLPreview:
      type: object
      description: 'What a download from a link would bring, shown before it starts (#611): the file and its size, the free space where models are kept, and a copy of the same file another app already has, which can be used where it is instead of downloaded again.'
      required: [filename, model_id]
      properties:
        model_id: {type: string}
        filename: {type: string}
        size_bytes: {type: integer, format: int64, description: 'The model file''s size, and ProjectorBytes its vision projector''s, both from the repository; 0 when it didn''t say.'}
        projector_bytes: {type: integer, format: int64}
        free_bytes: {type: integer, format: int64, description: The space left where models are kept; 0 when unknown.}
        installed: {type: boolean, description: Set when this model is already here; InstalledAs is its model ID.}
        installed_as: {type: string}
        elsewhere:
          type: array
          description: Copies of the same file that other apps have.
          items: {$ref: '#/components/schemas/FoundModel'}
    FoundModel:
      type: object
      description: A GGUF model another local AI app already downloaded on this computer, which can be added without downloading it again (#467).
      required: [app, name, path, size_bytes]
      properties:
        app: {type: string, description: 'Lmstudio, ollama, llamacpp, or gpt4all; toskar is a file put in Toskar''s own models folder by hand (#763).'}
        path: {type: string, description: 'The file; an Ollama model is its blob, named by digest.'}
        name: {type: string, description: 'What the app calls it (Ollama''s model:tag), or the header''s name, or the file''s.'}
        size_bytes: {type: integer, format: int64}
        architecture: {type: string}
        parameters: {type: string}
        quantization: {type: string}
        model_id: {type: string, description: Set when the file is already a model here.}
        projector: {type: string, description: 'Its vision projector, when the app keeps one with it.'}
    FoundModels:
      type: object
      description: Model files other apps on this computer have (#467).
      required: [models]
      properties:
        models:
          type: array
          items: {$ref: '#/components/schemas/FoundModel'}
    ImportedModel:
      type: object
      description: 'A model added from a file (#467): copying while its file is still being copied in, then installed.'
      required: [details, model_id, projector, status]
      properties:
        model_id: {type: string}
        projector: {type: string, description: 'The vision projector found beside it, if any.'}
        status: {type: string}
        details: {$ref: '#/components/schemas/ModelFileDetails'}
    ModelFileDetails:
      type: object
      description: What a GGUF file says about its model.
      required: [architecture, chat_template, context_length, license, name, parameters, quantization, size_label]
      properties:
        name: {type: string}
        architecture: {type: string}
        parameters: {type: integer, format: int64}
        size_label: {type: string}
        context_length: {type: integer, format: int64}
        quantization: {type: string}
        chat_template: {type: boolean, description: '`chat_template` says the file has its own chat template.'}
        license: {type: string}
    ModelInstall:
      type: object
      description: A model's download started, or already installed; its progress comes as events.
      required: [model_id, status]
      properties:
        status: {type: string}
        model_id: {type: string}
    AddedModel:
      type: object
      description: An added model's name and tags, after a change.
      required: [display_name, model_id, tags]
      properties:
        model_id: {type: string}
        display_name: {type: string}
        tags:
          type: array
          items: {type: string}
    ModelVision:
      type: object
      description: Says a model sees pictures now, with its projector set.
      required: [model_id, vision]
      properties:
        model_id: {type: string}
        vision: {type: boolean}
    ModelPlacement:
      type: object
      description: 'Where a model can run: each computer that has it, whether it''s online, and whether the model fits.'
      required: [computers, model_id]
      properties:
        model_id: {type: string}
        computers:
          type: array
          items:
            type: object
            description: Whether a computer can run a model.
            required: [fits, installed, node, note, online]
            properties:
              node: {type: string}
              online: {type: boolean}
              installed: {type: boolean}
              fits: {type: boolean}
              note: {type: string}
    CommunityRatings:
      type: object
      description: Everyone's ratings of the models here.
      required: [enabled, models]
      properties:
        enabled: {type: boolean, description: Whether community ratings are shown.}
        fetched_at: {type: string, format: date-time, description: When the summary was downloaded; nil when there is none.}
        generated_at: {type: string, format: date-time}
        source: {type: string}
        error: {type: string, description: Why the latest download failed; an older summary may still be shown.}
        models:
          type: object
          description: By local model ID.
          additionalProperties:
            type: object
            description: 'One model''s community ratings: from hardware like this computer''s, from everyone who runs it the same way, and from everyone by the language they used it in.'
            properties:
              similar: {$ref: '#/components/schemas/RatingStats'}
              overall: {$ref: '#/components/schemas/RatingStats'}
              languages:
                type: array
                items:
                  type: object
                  description: 'A model configuration''s ratings given for one language, for everyone who runs it that way: never split by hardware.'
                  required: [average, confidence, language, ratings, weighted_score]
                  properties:
                    language: {type: string}
                    ratings: {type: integer}
                    average: {type: number}
                    weighted_score: {type: number}
                    confidence: {type: string}
    RuntimeInfo:
      type: object
      description: The API view of a runtime.
      required: [detection, display_name, id, status]
      properties:
        id: {type: string}
        display_name: {type: string}
        detection:
          type: object
          description: Reports what a runtime found on the host.
          required: [installed]
          properties:
            installed: {type: boolean}
            version: {type: string}
            path: {type: string}
            message: {type: string}
            backends:
              type: array
              description: What the installed build can run on, such as ["cpu", "vulkan"]; a CPU-only build is just ["cpu"] (#317).
              items: {type: string}
        status: {type: string}
    RuntimeInstall:
      type: object
      description: A runtime installed.
      required: [runtime_id, status]
      properties:
        status: {type: string}
        runtime_id: {type: string}
    OK:
      type: object
      description: The answer of a route that has nothing else to say.
      required: [ok]
      properties:
        ok: {type: boolean}
    AutomationDetail:
      type: object
      description: An automation and its newest runs, newest occurrence first.
      required: [consecutive_failures, created_at, enabled, history, history_more, id, name, notification, prompt, schedule, tools, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        enabled: {type: boolean}
        schedule: {$ref: '#/components/schemas/Schedule'}
        prompt: {type: string}
        profile_id: {type: string}
        model_id: {type: string, description: The installed model this scheduled prompt runs.}
        tools:
          type: array
          items: {type: string}
        notification: {$ref: '#/components/schemas/AutomationNotification'}
        response_language: {type: string, description: 'The language results are written in (multilingual spec §22): "" or "account" follows the assistant language setting, "app" the App language, "auto" the language the request is written in, or a BCP 47 tag such as "de". A language the request asks for always wins.'}
        conversation_id: {type: string, description: 'The chat the automation was made from, and DraftID the draft that chat showed (#204). Both are empty for one made elsewhere.'}
        draft_id: {type: string}
        save_folder: {type: string, description: 'SaveFolder, when set, is a folder each result is also saved to as a Markdown file (#204), such as ~/Documents/Toskar/News.'}
        trigger:
          type: object
          description: Trigger, when set, runs the automation only when what it watches changed, checked on the schedule (#204).
          required: [kind]
          properties:
            kind: {type: string, description: 'Page (a web page''s text changed), feed (an RSS or Atom feed has new posts), or folder (files in a folder, or one file, changed).'}
            url: {type: string}
            path: {type: string, description: 'A folder''s or file''s, in the home folder; ~ is the home folder.'}
            automation_id: {type: string, description: 'The automation an after trigger follows, and When is succeeded (the default: each time it finishes well) or notified (only when it notified) (#204).'}
            when: {type: string}
            connector: {type: string, description: '`connector` and Device are a device trigger''s: a connected service''s device, such as Home Assistant''s binary_sensor.front_door_visitor, whose state changing runs the automation at once (#586, #667). To, when set, is the state it must change to, such as on; Cooldown is the seconds after a run during which changes start no other run, so a flickering sensor runs it once (0 is DefaultDeviceCooldown).'}
            device: {type: string}
            to: {type: string}
            cooldown_seconds: {type: integer}
        cameras:
          type: array
          description: Looked at as each run starts (#667).
          items:
            type: object
            description: 'One an automation looks at as each run starts (#667): a connected service''s camera, whose picture is then shown to a model that can see, like a photo attached in chat. Device is the camera as that service names it; Home Assistant''s are the first, such as camera.driveway.'
            required: [connector, device]
            properties:
              connector: {type: string}
              device: {type: string}
        last_checked_at: {type: string, format: date-time}
        hook_set: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        next_run_at: {type: string, format: date-time, description: The occurrence the daemon should execute next. A missed restart keeps only the latest missed occurrence here.}
        last_run_at: {type: string, format: date-time, description: When the previous occurrence finished. Zero means never run.}
        consecutive_failures: {type: integer, description: '`consecutive_failures` counts terminal failures in a row. A success clears it.'}
        last_error: {type: string, description: 'The most recent failure, including one that is waiting to retry.'}
        last_error_code: {type: string, description: '`last_error_code` and LastErrorDetails are its stable code and values (#588).'}
        last_error_details:
          type: object
          additionalProperties: {}
        last_status: {type: string, description: '`last_status` and LastResult summarize the newest occurrence. List fills them.'}
        last_result: {type: string}
        history:
          type: array
          items: {$ref: '#/components/schemas/AutomationRunInfo'}
        history_more: {type: boolean, description: '`history_more` says older runs exist; GET /automations/{id}/runs pages them.'}
    AutomationPreview:
      type: object
      description: One unsaved run of a draft automation.
      required: [reason, would_notify]
      properties:
        result: {type: string}
        error: {type: string}
        error_code: {type: string, description: '`error_code` and ErrorDetails are Error''s stable code and values (#588).'}
        error_details:
          type: object
          additionalProperties: {}
        model_id: {type: string}
        node_id: {type: string}
        would_notify: {type: boolean}
        reason: {type: string}
    AutomationRequest:
      type: object
      description: An automation read from a request.
      required: [name, notes, notification, prompt, schedule]
      properties:
        name: {type: string}
        prompt: {type: string}
        schedule: {$ref: '#/components/schemas/Schedule'}
        notification: {$ref: '#/components/schemas/AutomationNotification'}
        notes:
          type: array
          description: '`notes` say what was assumed, such as a time of day when none was given.'
          items: {type: string}
    AutomationRunInfo:
      type: object
      description: The durable record for one occurrence of an automation.
      required: [attempt, automation_id, created_at, id, notification_sent, occurrence_at, status]
      properties:
        id: {type: string}
        automation_id: {type: string}
        occurrence_at: {type: string, format: date-time}
        status: {type: string}
        claimed_at: {type: string, format: date-time}
        lease_until: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        result: {type: string}
        error: {type: string}
        error_code: {type: string, description: '`error_code` and ErrorDetails are Error''s stable code and values (#588).'}
        error_details:
          type: object
          additionalProperties: {}
        notification_sent: {type: boolean}
        model_id: {type: string}
        node_id: {type: string}
        attempt: {type: integer}
        retry_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        notify_detail: {type: string, description: '`notify_detail` says why a finished run did or didn''t notify, as automations:notice.<detail>, with NotifyValues for its placeholders (price, amount, currency), so the apps explain the server''s decision (#204). Empty for runs from before it was recorded.'}
        notify_values:
          type: object
          additionalProperties: {}
        conversation_id: {type: string, description: 'The chat its result was posted to, by the automation''s own chat or by "Continue in chat" (#204).'}
        saved_file: {type: string, description: 'Where its result was saved, for an automation with a save folder (#204).'}
    AutomationRunsPage:
      type: object
      description: One page of an automation's runs, newest first.
      required: [more, runs]
      properties:
        runs:
          type: array
          items: {$ref: '#/components/schemas/AutomationRunInfo'}
        more: {type: boolean, description: '`more` says older runs exist; ask again with before set to the last run''s id.'}
    CacheInfo:
      type: object
      description: A cache's policy and stats, for listing.
      required: [entries, evictions, hits, invalidation, key, label, misses, name, privacy, scope, ttl, ttl_ns]
      properties:
        name: {type: string}
        label: {type: string, description: How the cache is shown.}
        key: {type: string, description: '`key` says what an entry is looked up by.'}
        ttl_ns: {type: integer, format: int64}
        invalidation: {type: string, description: '`invalidation` says what removes entries besides age.'}
        scope: {type: string, description: '`scope` says where the cache applies, such as "this computer".'}
        privacy: {type: string}
        max_entries: {type: integer, description: '`max_entries` bounds the cache; the least recently used entry goes first.'}
        persistent: {type: boolean, description: '`persistent` marks a store kept on disk by its owner, which this package describes but does not hold.'}
        ttl: {type: string}
        entries: {type: integer}
        hits: {type: integer, format: int64}
        misses: {type: integer, format: int64}
        evictions: {type: integer, format: int64}
        last_cleared: {type: string, format: date-time}
    ConnectorStatus:
      type: object
      description: 'What may be shown about a service: never a secret value.'
      required: [connected, description, fields, id, name, scopes, tools]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        scopes: {type: string}
        fields:
          type: array
          items:
            type: object
            description: One value a service needs to connect, such as a token.
            required: [key, label, secret]
            properties:
              key: {type: string}
              label: {type: string}
              help: {type: string}
              secret: {type: boolean, description: '`secret` values are stored in the secrets directory and never shown again.'}
              optional: {type: boolean}
              placeholder: {type: string}
        connected: {type: boolean}
        status: {type: string}
        account: {type: string}
        connected_at: {type: string, format: date-time}
        checked_at: {type: string, format: date-time}
        error: {type: string}
        values:
          type: object
          description: '`values` shows non-secret fields as stored, and secret ones masked.'
          additionalProperties: {type: string}
        tools:
          type: array
          items:
            type: object
            description: 'One registered tool: built in, from a connected service, or from an MCP tool source.'
            required: [capability, default_policy, description, id, name, risk, schema, source]
            properties:
              id: {type: string}
              name: {type: string}
              description: {type: string}
              capability: {type: string}
              source: {type: string}
              schema: {type: string}
              default_policy: {type: string}
              risk: {type: string, description: read | create | write}
              prefetch: {type: boolean, description: '`prefetch` marks a connected service''s read tool that Yggdrasil calls, with no arguments, before the model answers a message about that service, as it looks up the web first for current questions.'}
              cues:
                type: array
                description: Words that show a message is about this tool's service, such as a connected home's device names.
                items: {type: string}
              always: {type: boolean, description: '`always` offers the tool with every request, not only ones about its service: a tool source the person set to always be available.'}
    DiagnosticsReport:
      type: object
      description: 'What a "Report this" sends with a problem (#588): enough to find it, nothing that says who or where the person is.'
      required: [arch, contract, os, version]
      properties:
        version: {type: string}
        commit: {type: string}
        contract: {type: string}
        os: {type: string}
        arch: {type: string}
        cpu: {type: string}
        memory_gb: {type: integer}
        gpus:
          type: array
          description: '`gpus` names each graphics card or chip, such as "Apple M3 Pro".'
          items: {type: string}
        log:
          type: array
          description: Core's last warnings and errors, scrubbed, for an Admin.
          items: {type: string}
    EvalPrompt:
      type: object
      description: One test prompt.
      required: [id, prompt]
      properties:
        id: {type: string}
        prompt: {type: string}
    JoinResult:
      type: object
      description: A finished join.
      required: [network_id, node, server, status]
      properties:
        status: {type: string, description: 'Joined, or already_joined when this computer already trusted the server.'}
        network_id: {type: string}
        server:
          type: object
          description: A computer in a network.
          required: [id, name]
          properties:
            id: {type: string}
            name: {type: string}
            address: {type: string}
            status: {type: string}
            fingerprint: {type: string}
        node:
          type: object
          description: This computer, named as the server knows it.
          required: [id, name]
          properties:
            id: {type: string}
            name: {type: string}
            address: {type: string}
            status: {type: string}
            fingerprint: {type: string}
    JoinTokenCreated:
      type: object
      description: A new token, shown once, and the command to use it.
      required: [command, created_at, expires_at, fingerprint, id, install_command, server, status, token, windows_command]
      properties:
        id: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        used_at: {type: string, format: date-time}
        used_by: {type: string, description: The name of the computer that joined with it.}
        revoked_at: {type: string, format: date-time}
        status: {type: string, description: 'Active, used, revoked, or expired.'}
        token: {type: string}
        server: {type: string}
        fingerprint: {type: string}
        command: {type: string}
        install_command: {type: string, description: '`install_command` installs Yggdrasil on a Linux or macOS computer that doesn''t have it yet, then joins; WindowsCommand does so in PowerShell.'}
        windows_command: {type: string}
    KnowledgeHit:
      type: object
      description: One retrieved passage.
      required: [body, score, source_id, source_name, title]
      properties:
        source_id: {type: string}
        source_name: {type: string}
        title: {type: string}
        body: {type: string}
        score: {type: number, description: '`score` orders the hits; higher is better. It compares hits within one search only: BM25 for keyword-only search, fused rank for hybrid search, and the reranker''s score when a reranker ordered them.'}
        match: {type: string, description: '`match` says how the passage was found: MatchKeyword, MatchSemantic, or MatchBoth.'}
    LeaveResult:
      type: object
      description: Says which computers were told this one left.
      required: [left, unreachable]
      properties:
        left:
          type: array
          items: {type: string}
        unreachable:
          type: array
          items: {type: string}
    LogContent:
      type: object
      description: A log file payload returned to the UI.
      required: [content, kind, label, name, size_bytes, truncated]
      properties:
        name: {type: string}
        kind: {type: string}
        label: {type: string}
        content: {type: string}
        truncated: {type: boolean}
        size_bytes: {type: integer, format: int64}
    LogFile:
      type: object
      description: Describes a log file available for diagnostics.
      required: [kind, label, modified_at, name, size_bytes]
      properties:
        name: {type: string}
        kind: {type: string, description: daemon | runtime | other}
        size_bytes: {type: integer, format: int64}
        modified_at: {type: string, format: date-time}
        label: {type: string}
    MCPServer:
      type: object
      description: 'What may be shown about a source: never a secret value.'
      required: [added_at, allow_sampling, always_offer, enabled, env, has_prompts, has_resources, headers, id, keywords, name, running, status, tools, where]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        preset: {type: string}
        where: {type: string, description: '"local" for a program on this computer, "remote" for a web address.'}
        command: {type: string}
        args:
          type: array
          items: {type: string}
        url: {type: string}
        env:
          type: array
          items:
            type: object
            description: An environment variable or header; secret values show only their last four characters.
            required: [key, secret, value]
            properties:
              key: {type: string}
              value: {type: string}
              secret: {type: boolean}
        headers:
          type: array
          items:
            type: object
            description: An environment variable or header; secret values show only their last four characters.
            required: [key, secret, value]
            properties:
              key: {type: string}
              value: {type: string}
              secret: {type: boolean}
        enabled: {type: boolean}
        allow_sampling: {type: boolean}
        always_offer: {type: boolean}
        keywords:
          type: array
          items: {type: string}
        status: {type: string, description: 'Ready, sign_in, error, or off.'}
        running: {type: boolean}
        error: {type: string}
        signed_in: {type: boolean}
        missing: {type: string, description: '`missing` names a program this source needs that is not installed, such as Node.js.'}
        server_name: {type: string}
        server_version: {type: string}
        protocol: {type: string}
        instructions: {type: string}
        has_resources: {type: boolean}
        has_prompts: {type: boolean}
        tools:
          type: array
          items:
            type: object
            description: One of a source's tools.
            required: [changed, description, enabled, id, name, policy, remote_name, risk]
            properties:
              id: {type: string}
              name: {type: string}
              remote_name: {type: string}
              description: {type: string}
              risk: {type: string}
              policy: {type: string, description: Allow or ask; Changed is true when the person set it.}
              changed: {type: boolean}
              enabled: {type: boolean}
        added_at: {type: string, format: date-time}
        checked_at: {type: string, format: date-time}
        last_used: {type: string, format: date-time}
    NetworkStatus:
      type: object
      description: This computer's network membership.
      required: [network_id, node, peers, reachable]
      properties:
        network_id: {type: string}
        reachable: {type: boolean, description: Whether other computers can reach this one's Bifrost.}
        node:
          type: object
          description: A computer in a network.
          required: [id, name]
          properties:
            id: {type: string}
            name: {type: string}
            address: {type: string}
            status: {type: string}
            fingerprint: {type: string}
        peers:
          type: array
          items:
            type: object
            description: A computer in a network.
            required: [id, name]
            properties:
              id: {type: string}
              name: {type: string}
              address: {type: string}
              status: {type: string}
              fingerprint: {type: string}
    News:
      type: object
      description: What the app shows.
      required: [enabled, items]
      properties:
        enabled: {type: boolean, description: False when the setting is off; nothing is read then.}
        items:
          type: array
          items:
            type: object
            description: One piece of news.
            required: [date, id, kind, source, summary, title]
